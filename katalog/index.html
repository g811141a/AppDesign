<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bean-Katalog">
<meta name="theme-color" content="#f2f2f7">
<title>Bean-Katalog</title>
<!-- Bean-Katalog (AppDesign katalog/, APD-140, seit 4.65.0; Designrichtlinie 14, R-1.13): je AD-Bean eine Seite zum Ansehen und Ausprobieren –
     Split View wie die Apps (Seitenleiste nach Bereichen, geplante Beans grau), Bean-Seite wie Einstellungen am iPad: Karte, Ausprobieren, Ereignisse,
     Regeln, Schnittstelle, Verlauf. Lädt immer den Arbeitsstand v5/ (gehört nicht zur festen Fassung). Je Bean eine Datei <kennung>.js, die sich mit
     catalogBean({…}) anmeldet. Prüfung: checkBeans (Liste ↔ katalog/), tests/katalog.mjs (lädt fehlerfrei, Grundregeln, Versionszeile). -->
<link rel="stylesheet" href="../v5/design.css">
<style>
  /* Nur, was der Katalog selbst braucht – alles Gemeinsame kommt aus design.css */
  .bk-kopf { background: var(--card); border-radius: 22px; box-shadow: var(--table-shadow); padding: calc(18px * var(--f-body)) 20px; margin-top: 12px; }
  .bk-icon { width: calc(56px * var(--f-body)); height: calc(56px * var(--f-body)); border-radius: 14px; background: var(--accent-fill); color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .bk-icon .ic { width: 60%; height: 60%; }
  .bk-kopf h1 { margin: 12px 0 4px; }
  .bk-kopf p { margin: 0; color: var(--muted); font-size: var(--t-body); line-height: 1.35; }
  .bk-kopf .bk-steck { margin-top: 10px; font-size: var(--t-subhead); color: var(--muted); }
  .bk-abschnitt { margin: 24px 16px 8px; font-size: var(--t-subhead); font-weight: 600; color: var(--muted); }
  .bk-zeile { cursor: default; }
  .bk-zeile .t { flex: 1; min-width: 0; }
  .bk-zeile b { display: block; font-weight: 600; }
  .bk-zeile small { display: block; color: var(--muted); font-size: var(--t-subhead); }
  .bk-zeile .val { flex: none; color: var(--muted); font-size: var(--t-body); }
  code { font: calc(15px * var(--f-body)) ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bk-zeile b code { font-weight: 600; }
  .ilist .swlist { margin: 0 0 0 16px; padding-right: 16px; border-top: .5px solid var(--line); }
  .bk-anleitung { margin: 8px 16px 0; }
  .bk-protokoll { list-style: none; margin: 0; padding: 4px 16px 8px; text-align: left; }
  .bk-protokoll li { padding: 8px 0; border-bottom: .5px solid var(--line); font-size: var(--t-body); }
  .bk-protokoll li:last-child { border-bottom: none; }
  .bk-protokoll li small { color: var(--muted); margin-left: 8px; }
  .bk-protokoll .bk-leer { color: var(--muted); }
  /* Vorführung der Wischaktionen: Kacheln wie in der Seitenleiste (15.4) */
  .bk-liste { padding: 2px 0 0; }
  .bk-knoepfe { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 16px 12px; }
  .bk-kachel { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: var(--card); border-radius: 22px;
    box-shadow: var(--table-shadow); padding: calc(12px * var(--f-body)) 16px; margin-bottom: 10px; min-height: 60px; font: inherit; color: inherit; }
  .bk-kachel .t { flex: 1; min-width: 0; } .bk-kachel b { display: block; font-weight: 600; } .bk-kachel small { display: block; color: var(--muted); font-size: var(--t-subhead); }
  .bk-kachel > .ic { color: var(--th-line); }
  .bk-kachel.on { background: var(--sel-bg); box-shadow: inset 0 0 0 .5px var(--accent); }
  /* Seitenleiste: Symbol vor dem Namen wie in Einstellungen; geplante Beans grau, ohne Pfeil */
  .side-row .bk-sym { flex: none; width: calc(30px * var(--f-body)); height: calc(30px * var(--f-body)); border-radius: 8px; background: var(--accent-fill);
    color: #fff; display: flex; align-items: center; justify-content: center; }
  .side-row .bk-sym .ic { width: 62%; height: 62%; }
  .side-row.current .bk-sym { background: rgba(255,255,255,.25); }
  #side .side-row.geplant { box-shadow: none; background: transparent; cursor: default; }
  #side .side-row.geplant b, #side .side-row.geplant small { color: var(--muted); }
  #side .side-row.geplant .bk-sym { background: var(--th-line); }
  @media print { #app, #side, dialog, .fab { display: none !important; } }
</style>
</head>
<body>
<aside id="side" hidden></aside>
<main id="app"></main>
<div class="fab" id="fab" hidden>
  <button type="button" id="toTop" aria-label="Nach oben"></button>
  <button type="button" id="toEnd" aria-label="Ans Ende"></button>
</div>
<dialog id="dlg"></dialog>
<dialog id="msg"></dialog>

<script src="../v5/ui.js"></script>
<script>
'use strict';
// Anmeldung der Beans – vor den Bean-Dateien
const BEANS = [];
function catalogBean(b) { BEANS.push(b); }
</script>
<script src="swipeactions.js"></script>
<script src="alert.js"></script>
<script src="sourcehighlight.js"></script>
<script src="notice.js"></script>
<script src="recentlydeleted.js"></script>
<!-- Beans im Entwurf (Designrichtlinie 14, APD-149/J-1): eigener Code auf v5/, in der Seitenleiste unter ‚Entwurf‘, in keiner Fassung. Seit 5.0.0 (APD-145)
     ist entwurf/presentation-commands.js nicht mehr geladen: er baut auf inneren Namen von ui.js, die im Namensraum AD nur noch innen stehen;
     die Beans commands und presentation kommen mit APD-149 in v5/ui.js. -->
<script>
'use strict';

const APP_NAME = 'Bean-Katalog';
const app = document.getElementById('app');
const side = document.getElementById('side');
const fab = document.getElementById('fab');

// Nur die Darstellung wird gespeichert (R-1.2); sonst hat der Katalog keine Daten.
const STORAGE_KEY = 'adkatalog.v1';
let db = { settings: { appearance: 'auto' } };
try { Object.assign(db.settings, JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')); } catch (e) { /* Standard */ }
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db.settings)); } catch (e) { /* ohne Speicher */ } return true; }

/* ---------- Bereiche (Designrichtlinie 15) ---------- */

const BEREICHE = ['Aktionen und Menüs', 'Navigation und Suche', 'Fenster und Meldungen', 'Eingabe', 'Inhalt', 'Dienste'];
// Geplante Beans (APD-136) – grau, ohne Seite, ohne eigene Datei (Designrichtlinie 14)
const GEPLANT = [
  { id: 'field', name: 'Eingabefeld (Grundlage)', area: 'Eingabe' },
  { id: 'decimal', name: 'Betragsfeld', area: 'Eingabe' },
];

/* ---------- Zustand ---------- */

let currentId = new URLSearchParams(location.search).get('bean') || location.hash.slice(1) || BEANS[0].id;
if (!BEANS.some(b => b.id === currentId)) currentId = BEANS[0].id;
let sideOpen = true, phoneList = AD.isPhone(), abmelden = null;
const ereignisse = [];
const getBean = id => BEANS.find(b => b.id === id);

/* ---------- Bean-Seite ---------- */

const zeilen = (liste, mitWert) => `<div class="ilist">${liste.map(([n, w, s]) => `<div class="irow bk-zeile"><span class="t"><b><code>${AD.esc(n)}</code></b><small>${AD.esc(mitWert ? s : w)}</small></span>${mitWert ? `<span class="val">${AD.esc(w)}</span>` : ''}</div>`).join('')}</div>`;
const textZeilen = liste => `<div class="ilist">${liste.map(([n, s]) => `<div class="irow bk-zeile"><span class="t"><b>${AD.esc(n)}</b><small>${AD.esc(s)}</small></span></div>`).join('')}</div>`;
const abschnitt = t => `<h2 class="bk-abschnitt">${t}</h2>`;
const protokollHtml = () => `<ul class="bk-protokoll" id="bkProt">${ereignisse.length ? ereignisse.map(([z, t, d]) => `<li>${AD.esc(t)}${d ? ` · ${AD.esc(d)}` : ''}<small>${z}</small></li>`).join('') : '<li class="bk-leer">Noch keine Ereignisse – probier die Bean oben aus.</li>'}</ul>`;
function protokoll(text, dazu = '') {
  ereignisse.unshift([new Date().toLocaleTimeString('de-DE'), text, dazu]);
  ereignisse.length = Math.min(ereignisse.length, 6);
  const p = app.querySelector('#bkProt'); if (p) p.outerHTML = protokollHtml();
}

function teilProbe(b) { return `${abschnitt('Ausprobieren')}<div id="bkProbe"></div><p class="hint bk-anleitung">${AD.esc(b.howTo)}</p>${abschnitt('Ereignisse')}<div class="ilist">${protokollHtml()}</div>`; }
function teilRegeln(b) { return `${abschnitt('Regeln')}${textZeilen(b.rules)}`; }
function teilSchnittstelle(b) {
  return `${abschnitt('Schnittstelle')}<div class="ilist"><div class="irow bk-zeile"><span class="t"><b><code>${AD.esc(b.create)}</code></b><small>Anlegen – die App nutzt nur Anlegen, Eigenschaften, Methoden und Ereignisse (R-1.13)</small></span></div></div>
    ${abschnitt('Eigenschaften')}${zeilen(b.properties, true)}${abschnitt('Nur lesen')}${zeilen(b.readOnly)}
    ${abschnitt('Methoden')}${zeilen(b.methods)}${abschnitt('Ereignisse <code>on(…)</code>')}${zeilen(b.events)}`;
}
function teilVerlauf(b) { return `${abschnitt('Verlauf')}${textZeilen(b.history.map(([v, s]) => [b.draft ? v : `AppDesign ${v}`, s]))}`; }

function render() {
  const b = getBean(currentId), phone = AD.isPhone();
  if (phone && phoneList) { fab.hidden = true; app.innerHTML = ''; renderSide(); return; }
  renderSide();
  fab.hidden = false;
  const kopf = `<div class="bk-kopf"><div class="bk-icon">${AD.ic(b.icon)}</div><h1>${AD.esc(b.name)}</h1><p>${AD.esc(b.abstract)}</p>
    <div class="bk-steck"><code>${b.id}</code> · ${AD.esc(b.area)} · ${b.draft ? 'Entwurf' : `seit AppDesign ${b.since}`} · Designrichtlinie ${b.section}</div></div>`;
  const inhalt = teilProbe(b) + teilRegeln(b) + teilSchnittstelle(b) + teilVerlauf(b);
  AD.setHtml(app, `
    ${phone ? `<div class="pnav" id="bar"><span><button type="button" class="round" id="back" aria-label="AD-Beans">${AD.ic('chevron-left')}</button></span>
      <span class="pnav-title">${AD.esc(b.name)}</span><span></span></div>`
    : `<div class="nb" id="bar"><div class="nb1"><span>${sideToggleHtml()}</span><span class="nb-title">${AD.esc(b.name)}</span><span></span></div></div>`}
    <div class="rolle" id="rolle">${kopf}${inhalt}<div style="height:24px"></div></div>`);
  document.documentElement.style.setProperty('--bar-h', app.querySelector('#bar').offsetHeight + 'px');
  bindSideToggle(app);
  AD.updateBar();   // iPhone: ohne großen Titel steht der Titel in der Leiste (R-2.2)
  const back = app.querySelector('#back'); if (back) back.onclick = AD.navPop;
  abmelden?.(); abmelden = null;
  const probe = app.querySelector('#bkProbe');
  if (probe) abmelden = b.demo(probe, protokoll);
}

function showBean(id) {
  if (id !== currentId) ereignisse.length = 0;
  currentId = id; phoneList = false;
  history.replaceState(null, '', '#' + id);
  render(); AD.scrollView.to(0);
}

/* ---------- Seitenleiste bzw. Startliste ---------- */

const sideFest = () => !AD.isPhone();
const sideToggleHtml = () => sideOpen && !AD.isPhone() ? '' : `<button type="button" class="round" data-side-toggle aria-label="Seitenleiste einblenden">${AD.ic('panel-left')}</button>`;
function toggleSide() { if (sideFest()) return AD.navSidebar(!sideOpen); AD.keepPlace(() => { sideOpen = !sideOpen; render(); }); }
const bindSideToggle = root => root.querySelectorAll('[data-side-toggle]').forEach(x => x.onclick = toggleSide);

function renderSide() {
  const page = AD.isPhone();
  if (page && !phoneList) { side.hidden = true; side.classList.remove('page'); return; }
  const show = page || sideOpen;
  side.hidden = !show;
  side.classList.toggle('page', page);
  document.body.classList.toggle('docked', show && !page);
  if (!show) return;
  const gruppen = [...BEREICHE.map(g => [g, [...BEANS.filter(b => b.area === g && !b.draft), ...GEPLANT.filter(b => b.area === g).map(b => ({ ...b, geplant: true }))]]),
    ['Entwurf', BEANS.filter(b => b.draft)]].filter(([, l]) => l.length);   // Beans im Entwurf nach den Bereichen (Designrichtlinie 14)
  const entwuerfe = BEANS.filter(b => b.draft).length;
  AD.setHtml(side, `
    <div class="side-head"><div class="ttl"><h2>AD-Beans</h2><small>${BEANS.length - entwuerfe} AD-Beans · ${GEPLANT.length} geplant${entwuerfe ? ` · ${entwuerfe} im Entwurf` : ''}</small></div>
      <button type="button" class="round" id="sideMore" aria-label="Mehr">${AD.ic('ellipsis')}</button>
      ${page ? '' : `<button type="button" class="round" id="sideHide" aria-label="Seitenleiste ausblenden">${AD.ic('panel-left')}</button>`}
    </div>
    <div class="side-list">${gruppen.map(([g, l]) => `<h3 class="side-sec">${g}</h3>${l.map(b => b.geplant
      ? `<div class="side-row geplant" aria-disabled="true"><span class="bk-sym">${AD.ic('ellipsis')}</span><span class="t"><b>${AD.esc(b.name)}</b><small><code>${b.id}</code> · geplant</small></span></div>`
      : `<button type="button" class="side-row ${b.id === currentId && !page ? 'current' : ''}" data-bean="${b.id}"><span class="bk-sym">${AD.ic(b.icon)}</span>
         <span class="t"><b>${AD.esc(b.name)}</b><small><code>${b.id}</code> · ${b.draft ? 'Entwurf' : `seit ${b.since}`}</small></span>${AD.ic('chevron-right')}</button>`).join('')}`).join('')}</div>
    ${AD.backupTileHtml(0, true)}`);   // Fuß der Seitenleiste mit der Offline-Zeile (R-1.5); der Katalog hat nichts zu sichern
  side.querySelector('#sideMore').onclick = e => AD.openMenu(e.currentTarget, [
    AD.appearanceMenuItem(), 'line', { note: `${APP_NAME} · AppDesign ${AD.AD_VERSION} (v5, neueste Fassung)` }], 'left');
  const hide = side.querySelector('#sideHide'); if (hide) hide.onclick = toggleSide;
  side.querySelectorAll('[data-bean]').forEach(x => x.onclick = () => AD.navPush(() => showBean(x.dataset.bean)));
  document.documentElement.style.setProperty('--side-w', side.offsetWidth + 'px');
}

/* ---------- Anmelden und Start ---------- */

document.getElementById('toTop').innerHTML = AD.ic('arrow-up-to-line');
document.getElementById('toEnd').innerHTML = AD.ic('arrow-down-to-line');
document.getElementById('toTop').onclick = AD.fabTop;
document.getElementById('toEnd').onclick = AD.fabEnd;
AD.navRegister({
  back: {
    shown: () => AD.isPhone() && !phoneList,
    below: an => { if (an) { phoneList = true; renderSide(); phoneList = false; } else if (!phoneList && AD.isPhone()) { side.hidden = true; side.classList.remove('page'); } },
    go: () => { phoneList = true; AD.scrollView.to(0); render(); },
  },
  sidebar: { possible: () => false, fixed: sideFest, shown: () => sideOpen, show: an => { sideOpen = an; renderSide(); }, refresh: () => render() },
});
AD.applyTheme();
render();
let wasPhone = AD.isPhone();
window.addEventListener('resize', () => {
  if (AD.isPhone() !== wasPhone) { wasPhone = AD.isPhone(); render(); return; }
  const bar = document.getElementById('bar'); if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  if (!side.hidden) document.documentElement.style.setProperty('--side-w', side.offsetWidth + 'px');
});
// für tests/katalog.mjs
window.__katalog = { showBean, beans: () => BEANS.map(b => b.id) };
</script>
</body>
</html>
