<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>A-28 Muster</title>
<style>
/* A-28 Umbau B – Muster zum Ausprobieren am iPhone (Sitzung Reiselogbuch 0016). Drei Varianten über ?v=a|b1|b2:
   A  = heute: die Seite rollt, Kopf- und Suchzeile sind position: fixed und folgen visualViewport.offsetTop (--vv-top).
   B1 = Umbau B: Rahmen aus festen Zeilen, nur der Inhalt rollt; der Rahmen ist so hoch wie der sichtbare Bereich (--vv-h).
   B2 = Umbau B: wie B1, der Rahmen bleibt aber immer bildschirmhoch (die Tastatur deckt den unteren Teil ab).
   ‚Zittern‘ in der Suchzeile = größte Abweichung der Kopfzeile auf dem Bildschirm seit dem Öffnen der Suche (in Bildern). */
:root { --bg: #f2f2f7; --card: #fff; --line: #d1d1d6; --txt: #000; --sub: #6e6e73; --blue: #007aff; --mark: #ffe58a; --cur: #ffb340;
  --th: #e9e9ee; --vv-top: 0px; --vv-h: 100dvh; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --line: #38383a; --txt: #fff; --sub: #98989d; --mark: #7a6420;
  --cur: #b36b00; --th: #2c2c2e; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font: 17px -apple-system, system-ui, sans-serif; }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; padding: 0 12px;
  padding-top: env(safe-area-inset-top); background: var(--bg); border-bottom: .5px solid var(--line); }
.bar h1 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; }
.bar h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); }
.bar .r { justify-self: end; display: flex; gap: 8px; }
.cap { display: inline-flex; background: var(--card); border: .5px solid var(--line); border-radius: 18px; padding: 2px; }
.cap button, .fab button { border: 0; background: none; color: var(--blue); font: inherit; min-width: 40px; height: 32px; border-radius: 16px; }
.cap button.on { background: rgba(0,122,255,.15); }
.sbar { display: flex; gap: 8px; align-items: center; padding: 6px 12px 8px; background: var(--bg); }
.sbar[hidden] { display: none; }
.sbar input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 7px 12px; border-radius: 10px; border: .5px solid var(--line);
  background: var(--card); color: var(--txt); outline: none; }
.sbar .meta { color: var(--sub); font-size: 13px; white-space: nowrap; }
.sbar .x { border: 0; background: var(--sub); color: var(--bg); width: 22px; height: 22px; border-radius: 50%; font-size: 14px; line-height: 22px; padding: 0; }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); }
th, td { border-bottom: .5px solid var(--line); border-right: .5px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
th { position: sticky; background: var(--th); font-weight: 600; z-index: 2; }
tr:nth-child(even) td { background: color-mix(in srgb, var(--card) 94%, var(--txt)); }
mark { background: var(--mark); color: inherit; border-radius: 3px; } mark.cur { background: var(--cur); }
.intro { padding: 14px 14px 4px; color: var(--sub); font-size: 15px; line-height: 1.4; } .intro b { color: var(--txt); }
.end { padding: 30px 14px 120px; color: var(--sub); font-size: 15px; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right)); display: flex; flex-direction: column; background: var(--card);
  border: .5px solid var(--line); border-radius: 20px; padding: 2px; z-index: 8; }

/* A: die Seite rollt (heute) */
.va .head { position: fixed; top: var(--vv-top); left: 0; right: 0; z-index: 6; }
.va main { padding-top: var(--head-h, 44px); }
.va th { top: calc(var(--head-h, 44px) + var(--vv-top)); }
.va .fab { bottom: calc(16px + env(safe-area-inset-bottom)); }

/* B: nur der Inhalt rollt – Rahmen aus festen Zeilen, die Seite selbst rollt nie */
.vb1, .vb2 { overflow: hidden; height: 100%; }
.vb1 body, .vb2 body { overflow: hidden; height: 100%; }
.vb1 .frame, .vb2 .frame { position: fixed; left: 0; right: 0; top: var(--vv-top); display: grid; grid-template-rows: auto 1fr; }
.vb1 .frame { height: var(--vv-h); }
.vb2 .frame { height: 100dvh; }
.vb1 main, .vb2 main { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 0; }
.vb1 th, .vb2 th { top: 0; }
.vb1 .fab, .vb2 .fab { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); }
@media print { .vb1, .vb2, .vb1 body, .vb2 body { overflow: visible; height: auto; } .frame { position: static !important; height: auto !important; display: block !important; }
  main { overflow: visible !important; } .head, .fab { display: none; } }
</style></head><body>
<div class="frame">
  <div class="head">
    <div class="bar"><span><span class="cap" id="var"><button data-v="a">A</button><button data-v="b1">B1</button><button data-v="b2">B2</button></span></span>
      <h1>Australien<small id="zittern"></small></h1><span class="r"><span class="cap"><button id="lupe" aria-label="Suchen">🔍</button></span></span></div>
    <div class="sbar" id="sbar" hidden><input id="search" type="search" enterkeyhint="search" autocomplete="off" placeholder="Suchen">
      <span class="meta" id="count"></span><button class="x" id="x" aria-label="Suche löschen">✕</button></div>
  </div>
  <main id="main">
    <div class="intro" id="intro"></div>
    <table><thead><tr><th>Datum</th><th>Programm</th><th>Unterkunft</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="end">Ende der Liste</div>
  </main>
  <div class="fab"><button id="toTop" aria-label="Nach oben">↑</button><button id="toEnd" aria-label="Ans Ende">↓</button></div>
</div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'b1';
document.documentElement.className = 'v' + v;
document.querySelectorAll('#var button').forEach(b => { b.classList.toggle('on', b.dataset.v === v); b.onclick = () => { location.search = '?v=' + b.dataset.v; }; });
document.getElementById('intro').innerHTML = {
  a: '<b>A – heute:</b> die Seite rollt, Kopf- und Suchzeile folgen dem sichtbaren Bereich. Erwartet am iPhone: Zittern nach ⓧ.',
  b1: '<b>B1 – nur der Inhalt rollt</b>, der Rahmen ist so hoch wie der sichtbare Bereich (endet über der Tastatur).',
  b2: '<b>B2 – nur der Inhalt rollt</b>, der Rahmen bleibt bildschirmhoch (die Tastatur deckt den unteren Teil ab).' }[v]
  + ' Ablauf wie bei P-57: in die Mitte rollen, 🔍, „Sydney“ langsam tippen, ⓧ, noch einmal tippen.';
const days = Array.from({ length: 40 }, (_, i) => { const d = new Date(Date.UTC(2026, 7, 24 + i));
  return [d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'UTC' }),
    i === 30 ? 'Fahrt nach Sydney' : i % 7 === 0 ? 'Bus nach Sydney' : 'Programm ' + i + ' – Stadtrundgang, Museum und Abendessen', 'Hotel am Hafen']; });
const main = document.getElementById('main'), rows = document.getElementById('rows'), head = document.querySelector('.head');
const sbar = document.getElementById('sbar'), search = document.getElementById('search');
const isA = v === 'a';
// Rollen: A über das Fenster, B nur im Inhalt
const roll = { get y() { return isA ? scrollY : main.scrollTop; }, to(y, smooth) { (isA ? window : main).scrollTo({ top: y, behavior: smooth ? 'smooth' : 'instant' }); },
  get max() { return isA ? document.documentElement.scrollHeight - innerHeight : main.scrollHeight - main.clientHeight; } };
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
let term = '', hit = 0, jump = null;
function draw() {
  const t = term.trim().toLowerCase();
  rows.innerHTML = days.filter(r => !t || r.some(c => c.toLowerCase().includes(t))).map(r => '<tr>' + r.map(c => {
    let h = esc(c); if (t) h = h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>'); return '<td>' + h + '</td>'; }).join('') + '</tr>').join('');
  const marks = [...rows.querySelectorAll('mark')];
  marks.forEach((m, i) => m.classList.toggle('cur', i === hit));
  document.getElementById('count').textContent = t ? (marks.length ? `${hit + 1} von ${marks.length}` : '0') : '';
  if (isA) document.documentElement.style.setProperty('--head-h', head.offsetHeight + 'px');
}
// Treffer unter die Suchzeile rollen (A: wie Reiselogbuch 3.24.0 scrollUnderBar, mit Abzug von offsetTop)
function showHit() {
  const m = rows.querySelector('mark.cur'); if (!m) return;
  const row = m.closest('tr'), th = document.querySelector('th').offsetHeight;
  if (isA) roll.to(Math.max(0, row.getBoundingClientRect().top + scrollY - head.offsetHeight - th - 12 - (visualViewport?.offsetTop || 0)));
  else roll.to(Math.max(0, row.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - th - 12));
}
// Sichtbarer Bereich: --vv-top (alle) und --vv-h (B1)
function place() { const vv = visualViewport; if (!vv) return;
  document.documentElement.style.setProperty('--vv-top', Math.max(0, vv.offsetTop) + 'px');
  document.documentElement.style.setProperty('--vv-h', vv.height + 'px'); }
visualViewport?.addEventListener('resize', place); visualViewport?.addEventListener('scroll', place);
// Zittern messen: Lage der Kopfzeile auf dem Bildschirm in jedem Bild (Safari misst getBoundingClientRect am sichtbaren Bereich)
let base = null, worst = 0;
(function frame() { const y = head.getBoundingClientRect().top;
  if (!sbar.hidden) { if (base === null) base = y; const d = Math.round(Math.abs(y - base));
    if (d > worst) { worst = d; document.getElementById('zittern').textContent = 'Zittern ' + worst + ' px'; } }
  requestAnimationFrame(frame); })();
document.getElementById('lupe').onclick = () => {
  sbar.hidden = !sbar.hidden; term = ''; hit = 0; search.value = ''; base = null; worst = 0;
  document.getElementById('zittern').textContent = 'Zittern 0 px';
  draw();
  if (!sbar.hidden) { if (!isA) roll.to(0); search.focus(); }   // A-29: Suche öffnen rollt nach oben (nur B – A wie heute)
};
search.oninput = () => { term = search.value; hit = 0; draw(); clearTimeout(jump); jump = setTimeout(showHit, 500); };
search.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const n = rows.querySelectorAll('mark').length; if (hit < n - 1) { hit++; draw(); showHit(); } } };
document.getElementById('x').onclick = () => { term = ''; hit = 0; search.value = ''; draw(); if (!isA) roll.to(0); search.focus(); };   // A-29
document.getElementById('toTop').onclick = () => roll.to(0, true);
document.getElementById('toEnd').onclick = () => roll.to(roll.max, true);
draw(); place();
</script></body></html>
