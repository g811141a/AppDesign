<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A-61 Muster">
<title>A-61 Muster</title>
<style>
/* A-61 Teil 1 ‚Navigation und Gesten‘ – Muster zum Ausprobieren (Sitzung Reiselogbuch 0029). Drei Varianten über ?v=heute|rand|ueberall
   (in der Startliste bzw. Seitenleiste oben umschaltbar). Aufbau wie die App (15.4, 15.17): unter 700 px Breite oder 500 px Höhe
   iPhone-Aufbau (Startliste → Inhalt), sonst iPad-Aufbau (Seitenleiste quer fest, hoch darübergelegt).
   Heute    = wie die App heute: Seitenwechsel ohne Übergang, zurück nur mit dem Knopf, Seitenleiste nur mit dem Knopf.
   Rand     = T-4 Seitenwechsel als Schieben, T-5 Zurückwischen vom linken Rand (24 px), T-6 Seitenleiste am iPad hoch vom linken Rand
              hereinwischen und nach links wegwischen, T-35 Vorrang: Rollen und der Bilderstreifen gewinnen gegen das Wischen.
   Überall  = wie Rand, aber Zurückwischen von überall im Inhalt (iOS 26, interactiveContentPopGestureRecognizer).
   Fertig nach halber Breite oder schnellem Wischen, sonst zurück. ‚Bewegung reduzieren‘: Überblenden statt Schieben. Nur hell (0 Nr. 6). */
:root { --bg: #f2f2f7; --card: #fff; --line: #d1d1d6; --txt: #000; --sub: #6e6e73; --blue: #007aff; --btn: #f9f9f9; --btn-rim: #fff;
  --float: 0 3px 28px rgba(0,0,0,.16); --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); --st: env(safe-area-inset-top);
  --sb: env(safe-area-inset-bottom); --kurve: cubic-bezier(.2, .8, .2, 1); --seite-w: 360px; color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font: 17px -apple-system, system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
.seite { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; background: var(--bg); will-change: transform, opacity; }
.kopf { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-height: 56px;
  padding: calc(6px + var(--st)) max(12px, var(--sr)) 6px max(12px, var(--sl)); }
.kopf h1 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kopf h1.gross { font-size: 20px; font-weight: 700; text-align: left; }
.kopf h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--sub); }
.rund { background: var(--btn); border: .5px solid var(--btn-rim); box-shadow: var(--float); color: var(--blue); }
.knopf { width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
.cap { display: inline-flex; border-radius: 22px; padding: 2px; }
.cap button { border: 0; background: none; color: var(--blue); font: inherit; font-size: 15px; height: 40px; border-radius: 20px; padding: 0 10px; }
.cap button.on { background: rgba(0,122,255,.15); font-weight: 600; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.rolle { overflow-y: auto; min-height: 0; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 max(16px, var(--sr)) calc(24px + var(--sb)) max(16px, var(--sl)); }
.kachel { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 8px 0; }
.kachel div { flex: 1; } .kachel b { display: block; } .kachel small { color: var(--sub); font-size: 14px; }
.kachel .i { color: #c4c4c7; width: 18px; height: 18px; }
.kachel.sel { background: var(--blue); color: #fff; } .kachel.sel small, .kachel.sel .i { color: #e5f0ff; }
.hinweis { color: var(--sub); font-size: 15px; line-height: 1.4; padding: 12px 2px 4px; } .hinweis b { color: var(--txt); }
.box { background: var(--card); border-radius: 12px; margin: 12px 0; padding: 4px 14px; }
.box h2 { font-size: 17px; margin: 10px 0 6px; }
.kv { display: flex; gap: 12px; padding: 7px 0; border-top: .5px solid var(--line); font-size: 15px; line-height: 1.35; }
.kv .k { color: var(--sub); width: 92px; flex: none; font-weight: 600; } .kv .v { flex: 1; }
.streifen { display: flex; gap: 8px; overflow-x: auto; touch-action: pan-x pan-y; overscroll-behavior-x: contain; padding: 4px 0 10px; }
.streifen span { flex: none; width: 120px; height: 80px; border-radius: 12px; display: grid; place-items: center; font-size: 14px; color: #123;
  background: linear-gradient(135deg, #9ecbff, #c8b6ff); }
#schleier { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; will-change: opacity; touch-action: none; }
/* iPhone: die Inhaltsseite liegt über der Startliste; der Schatten zeigt ihre linke Kante beim Schieben */
html.phone #inhalt { box-shadow: -6px 0 24px rgba(0,0,0,.14); }
html.phone #inhalt .seitenknopf, html.phone #inhalt .cap { display: none; }
html:not(.phone) #inhalt .zurueck { display: none; }
/* iPad: Seitenleiste schwebend (15.4); quer fest neben dem Inhalt, hoch darübergelegt */
html.pad #liste { inset: 10px auto 4px 10px; width: var(--seite-w); border-radius: 22px; border: .5px solid var(--btn-rim); box-shadow: var(--float);
  overflow: hidden; z-index: 3; }
html.pad #liste .kopf { padding-top: 6px; padding-left: 12px; }
html.pad #liste .wrap { padding-left: 12px; padding-right: 12px; }
html.pad.quer.mitseite #inhalt { left: calc(var(--seite-w) + 20px); }
html.pad #inhalt { z-index: 1; } html.pad #schleier { z-index: 2; }
html.pad.quer #schleier { display: none; }
html.phone #liste { z-index: 1; } html.phone #schleier { z-index: 2; } html.phone #inhalt { z-index: 3; }
.unsichtbar { visibility: hidden; }
</style></head><body>
<div id="app">
  <section class="seite" id="liste">
    <div class="kopf"><span></span><h1 class="gross">Reiselogbücher<small>6 Reiselogbücher</small></h1><span class="cap rund wahl"></span></div>
    <div class="rolle" id="listeRolle"><div class="wrap" id="kacheln"></div></div>
  </section>
  <div id="schleier"></div>
  <section class="seite" id="inhalt">
    <div class="kopf"><span><button class="knopf rund zurueck" id="zurueck" aria-label="Zurück"></button><button class="knopf rund seitenknopf" id="seitenknopf" aria-label="Seitenleiste"></button></span>
      <h1 id="titel"></h1><span class="cap rund wahl"></span></div>
    <div class="rolle" id="inhaltRolle"><div class="wrap" id="tage"></div></div>
  </section>
</div>
<script>
const ICONS = {
  'chevron-left': '<path d="m15 18-6-6 6-6"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  'panel-left': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const V = ['heute', 'rand', 'ueberall'].includes(Q.get('v')) ? Q.get('v') : 'heute';
const NAMEN = { heute: 'Heute', rand: 'Rand', ueberall: 'Überall' };
const TEXT = {
  heute: '<b>Heute:</b> Die Seite wechselt ohne Übergang. Zurück geht es nur mit dem Knopf, die Seitenleiste kommt nur mit dem Knopf.',
  rand: '<b>Variante Rand:</b> Die Seite schiebt sich herein. <b>Zurück:</b> vom linken Rand nach rechts wischen – die Seite folgt dem Finger. Am iPad hoch holt dasselbe Wischen die Seitenleiste herein, nach links wischen schiebt sie weg. Der Bilderstreifen und das Rollen haben Vorrang.',
  ueberall: '<b>Variante Überall (iOS 26):</b> wie Rand, aber <b>zurück von überall im Inhalt</b> nach rechts wischen – nicht nur vom Rand. Der Bilderstreifen und das Rollen haben Vorrang.'
};
const BEWEGT = V !== 'heute';
const ruhig = matchMedia('(prefers-reduced-motion: reduce)');
// Inhalt
const REISEN = [['Japan 2026', '02.03.–21.03.2026 · geplant'], ['Island 2025', '10.07.–24.07.2025 · erledigt'], ['Portugal 2025', '03.04.–17.04.2025 · erledigt'],
  ['Kanada 2024', '01.09.–28.09.2024 · erledigt'], ['Norwegen 2024', '15.06.–29.06.2024 · erledigt'], ['Sizilien 2023', '05.10.–19.10.2023 · erledigt']];
const ORTE = ['Tokio', 'Hakone', 'Kyoto', 'Nara', 'Osaka', 'Hiroshima', 'Miyajima', 'Kanazawa'];
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
let gewaehlt = -1, aktuell = 0;
function kacheln() {
  $('kacheln').innerHTML = `<p class="hinweis">${TEXT[V]}</p>` + REISEN.map(([t, z], i) =>
    `<div class="kachel${i === gewaehlt ? ' sel' : ''}" data-i="${i}" role="button"><div><b>${t}</b><small>${z}</small></div>${ic('chevron-right')}</div>`).join('');
}
function tage(r) {
  let h = `<p class="hinweis">${TEXT[V]}</p><div class="box"><h2>Bilder</h2><div class="streifen" id="streifen">` +
    Array.from({ length: 10 }, (_, i) => `<span>Bild ${i + 1}</span>`).join('') + '</div></div>';
  for (let i = 0; i < 20; i++) {
    const d = new Date(2026, 2, 2 + i);
    h += `<div class="box"><h2>Tag ${i + 1} · ${WT[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}.03.2026</h2>
      <div class="kv"><span class="k">Ort</span><span class="v">${ORTE[Math.floor(i / 3) % ORTE.length]}</span></div>
      <div class="kv"><span class="k">Programm</span><span class="v">Spaziergang durch die Altstadt, Mittagessen in einer kleinen Nudelküche, am Abend Onsen.</span></div></div>`;
  }
  $('tage').innerHTML = h; $('titel').textContent = REISEN[r][0]; $('inhaltRolle').scrollTop = 0;
}
for (const w of document.querySelectorAll('.wahl')) {
  w.innerHTML = Object.entries(NAMEN).map(([k, n]) => `<button data-v="${k}" class="${k === V ? 'on' : ''}">${n}</button>`).join('');
  w.onclick = e => { const b = e.target.closest('button'); if (b) location.search = '?v=' + b.dataset.v; };
}
$('zurueck').innerHTML = ic('chevron-left'); $('seitenknopf').innerHTML = ic('panel-left');
// Aufbau (15.17): iPhone unter 700 px Breite oder 500 px Höhe
const H = document.documentElement;
const istPhone = () => innerWidth < 700 || innerHeight < 500;
const istHoch = () => innerHeight > innerWidth;
// Zustand: iPhone – Inhalt offen (1) oder Startliste (0); iPad – Seitenleiste sichtbar (1) oder nicht (0). Ein Zustand je Aufbau (R-8.1).
let offen = 0, seite = 1, lauf = null;
// p = 0…1 setzt alle Ebenen; nur transform und opacity (A-59: nichts, was den Aufbau neu berechnet)
function setze(p) {
  const L = $('liste').style, I = $('inhalt').style, S = $('schleier').style;
  if (H.classList.contains('phone')) {
    if (ruhig.matches && BEWEGT) { I.transform = 'none'; I.opacity = p; L.transform = 'none'; S.opacity = 0; }
    else { I.transform = `translate3d(${(1 - p) * 100}%,0,0)`; I.opacity = 1; L.transform = `translate3d(${-30 * p}%,0,0)`; S.opacity = 0.08 * p; }
    $('inhalt').classList.toggle('unsichtbar', p === 0); $('liste').classList.remove('unsichtbar');
  } else {
    I.transform = 'none'; I.opacity = 1;
    if (H.classList.contains('quer')) { L.transform = 'none'; L.opacity = 1; S.opacity = 0; $('liste').classList.toggle('unsichtbar', p === 0); return; }
    const w = $('liste').offsetWidth + 20;
    if (ruhig.matches && BEWEGT) { L.transform = 'none'; L.opacity = p; } else { L.transform = `translate3d(${(p - 1) * w}px,0,0)`; L.opacity = 1; }
    S.opacity = 0.25 * p; S.pointerEvents = p > 0 ? 'auto' : 'none';
    $('liste').classList.toggle('unsichtbar', p === 0);
  }
}
const stand = () => H.classList.contains('phone') ? offen : seite;
// Weich zum Ziel (T-4); Dauer nach dem Rest des Weges, 0,15–0,35 s
function fahre(von, nach, fertig) {
  cancelAnimationFrame(lauf);
  if (!BEWEGT || von === nach) { setze(nach); fertig?.(); return; }
  const dauer = Math.max(150, 350 * Math.abs(nach - von)), t0 = performance.now();
  const kurve = t => 1 - Math.pow(1 - t, 3);
  const schritt = jetzt => {
    const t = Math.min(1, (jetzt - t0) / dauer);
    setze(von + (nach - von) * kurve(t));
    if (t < 1) lauf = requestAnimationFrame(schritt); else { lauf = null; fertig?.(); }
  };
  lauf = requestAnimationFrame(schritt);
}
let jetztP = 0;
function oeffne(i) {
  aktuell = i; tage(i);
  if (H.classList.contains('phone')) { offen = 1; fahre(jetztP, 1); jetztP = 1; }
  else { kacheln(); markiere(); if (!H.classList.contains('quer')) zuSeite(0); }
}
function zurueck() { if (!offen) return; offen = 0; gewaehlt = aktuell; kacheln(); fahre(jetztP, 0); jetztP = 0; }
function zuSeite(z) { seite = z; H.classList.toggle('mitseite', !!z); fahre(jetztP, z); jetztP = z; }
function markiere() { gewaehlt = aktuell; for (const k of document.querySelectorAll('.kachel')) k.classList.toggle('sel', +k.dataset.i === aktuell); }
$('kacheln').addEventListener('click', e => { if (unterdruecke) return; const k = e.target.closest('.kachel'); if (k) oeffne(+k.dataset.i); });
$('zurueck').onclick = () => zurueck();
$('seitenknopf').onclick = () => zuSeite(seite ? 0 : 1);
$('schleier').addEventListener('click', () => { if (!unterdruecke) zuSeite(0); });
function aufbau() {
  const phone = istPhone(), war = H.className;
  H.classList.toggle('phone', phone); H.classList.toggle('pad', !phone);
  H.classList.toggle('quer', !phone && !istHoch()); H.classList.toggle('mitseite', !phone && !!seite);
  if (war !== H.className) { jetztP = stand(); setze(jetztP); }
}
addEventListener('resize', aufbau);
// Gesten mit Vorrang (T-35): eine Stelle entscheidet. Die Rollbereiche haben touch-action: pan-y – senkrecht rollt der Browser selbst
// (dann pointercancel), waagerecht kommt die Bewegung hierher. Der Bilderstreifen (pan-x) rollt immer selbst. Entschieden wird nach
// 10 px: deutlich waagerecht in der richtigen Richtung → Geste, sonst nichts.
const RAND = 24;
let g = null, unterdruecke = false;
const randLinks = () => parseFloat(getComputedStyle(H).getPropertyValue('--sl')) || 0;
function kandidat(e) {
  if (!BEWEGT || e.button > 0 || e.target.closest('.streifen, .cap, button')) return null;
  const amRand = e.clientX < Math.max(RAND, randLinks() + 16);
  if (H.classList.contains('phone')) {
    if (offen && (V === 'ueberall' || amRand) && e.target.closest('#inhalt')) return { art: 'zurueck', richtung: 1, von: 1, nach: 0 };
    return null;
  }
  if (H.classList.contains('quer')) return null;
  if (!seite && amRand) return { art: 'seite-auf', richtung: 1, von: 0, nach: 1 };
  if (seite && e.target.closest('#liste, #schleier')) return { art: 'seite-zu', richtung: -1, von: 1, nach: 0 };
  return null;
}
addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  const k = kandidat(e);
  g = k && { ...k, x0: e.clientX, y0: e.clientY, aktiv: false, id: e.pointerId, spur: [[e.timeStamp, e.clientX]] };
}, true);
addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (!g.aktiv) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.sign(dx) === g.richtung) {
      g.aktiv = true; cancelAnimationFrame(lauf); lauf = null;
      try { e.target.setPointerCapture(e.pointerId); } catch {}
      document.body.classList.add('zieht');
    } else { g = null; return; }
  }
  e.preventDefault();
  g.spur.push([e.timeStamp, e.clientX]); if (g.spur.length > 6) g.spur.shift();
  const breite = H.classList.contains('phone') ? innerWidth : $('liste').offsetWidth + 20;
  const p = Math.max(0, Math.min(1, g.von + (g.nach - g.von) * Math.abs(dx) / breite));
  jetztP = p; setze(p);
}, { capture: true, passive: false });
function loslassen(e, abbruch) {
  if (!g || e.pointerId !== g.id) return;
  const fertigG = g; g = null;
  if (!fertigG.aktiv) return;
  document.body.classList.remove('zieht');
  unterdruecke = true; setTimeout(() => { unterdruecke = false; }, 0);
  // Tempo aus den letzten 100 ms – wer vor dem Loslassen innehält, wischt nicht schnell
  const spur = fertigG.spur.filter(([t]) => t >= e.timeStamp - 100);
  const tempo = spur.length > 1 && spur.at(-1)[0] > spur[0][0]
    ? (spur.at(-1)[1] - spur[0][1]) / (spur.at(-1)[0] - spur[0][0]) * fertigG.richtung : 0;   // px/ms in Wischrichtung
  const weg = Math.abs(jetztP - fertigG.von);
  const geschafft = !abbruch && (weg > 0.5 || (tempo > 0.3 && weg > 0.05));
  const ziel = geschafft ? fertigG.nach : fertigG.von;
  if (fertigG.art === 'zurueck') { if (geschafft) { offen = 0; gewaehlt = aktuell; kacheln(); } fahre(jetztP, ziel); }
  else { seite = ziel; H.classList.toggle('mitseite', !!ziel); fahre(jetztP, ziel); }
  jetztP = ziel;
}
addEventListener('pointerup', e => loslassen(e, false), true);
addEventListener('pointercancel', e => loslassen(e, true), true);
// Start: iPhone in der Startliste, iPad mit dem ersten Eintrag geöffnet und sichtbarer Seitenleiste (15.4, 15.17)
kacheln(); tage(0);
aufbau();
if (!istPhone()) { gewaehlt = 0; markiere(); }
jetztP = stand(); setze(jetztP);
</script>
</body></html>
