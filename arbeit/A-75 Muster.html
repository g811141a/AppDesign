<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A-75 Muster">
<title>A-75 Muster</title>
<link rel="stylesheet" href="../fassung/4.32.2/design.css">
<style>
/* A-75 ‚Auswahl-Kapsel erkennbar wischbar‘ – Muster 2 (Sitzung Reiselogbuch 0041, Vorgabe Nutzer 24.10.2026: bestehendes Verhalten
   verbessern – längerer Verlauf zum Rand, dazu kleine Pfeile, die am jeweiligen Ende verschwinden). Fünf Stände über
   ?v=heute|a|b|c|d (oben umschaltbar). Echte Auswahl-Kapsel aus der Fassung 4.32.2 (15.12, `.cap` > `.scroll`), Inhalt wie im
   Reiselogbuch (Reisemittel, Wetter, Smileys).
   Heute = Verlauf 48 px.
   A–D   = Verlauf 55 / 65 / 80 / 112 px (die äußeren 28 px ganz frei), dazu chevron-left/-right (14 px, grau) in diesem freien Rand; ein Pfeil blendet aus, sobald das Ende auf
           seiner Seite erreicht ist.
   (A 55 und B 65 px auf Wunsch des Nutzers ergänzt, 24.10.2026.)
   Die Pfeile sind nur Anzeige (nicht antippbar, zu klein für 44 pt); Antippen geht an den Eintrag darunter wie heute.
   ‚Bewegung reduzieren‘: Pfeile ohne Überblenden. Nur hell (0 Nr. 6). */
html, body { margin: 0; background: var(--dlg-bg); }
#kopf { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: var(--dlg-bg); }
#kopf h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; }
#wahl button { font-size: 15px; padding: 0 14px; white-space: nowrap; width: auto; }
#blatt { padding: 0 max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.hinweis { color: var(--muted); font-size: 15px; line-height: 1.4; margin: 6px 2px 0; }
.hinweis b { color: var(--ink); }
#wx button { width: 40px; min-width: 40px; }
/* Längerer Verlauf: Länge über --fade (heute 48 px); die äußeren 28 px bleiben ganz frei – dort steht der Pfeil */
html.neu .cap .scroll.fr { -webkit-mask-image: linear-gradient(to left, transparent 28px, #000 var(--fade)); mask-image: linear-gradient(to left, transparent 28px, #000 var(--fade)); }
html.neu .cap .scroll.fl { -webkit-mask-image: linear-gradient(to right, transparent 28px, #000 var(--fade)); mask-image: linear-gradient(to right, transparent 28px, #000 var(--fade)); }
html.neu .cap .scroll.fl.fr { -webkit-mask-image: linear-gradient(to right, transparent 28px, #000 var(--fade), #000 calc(100% - var(--fade)), transparent calc(100% - 28px)); mask-image: linear-gradient(to right, transparent 28px, #000 var(--fade), #000 calc(100% - var(--fade)), transparent calc(100% - 28px)); }
/* Pfeile im verblassten Rand, nur Anzeige */
.cap { position: relative; }
.cap .pf { position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; color: var(--muted); pointer-events: none;
  opacity: 0; transition: opacity .2s; }
.cap .pf.l { left: 9px; } .cap .pf.r { right: 9px; }
.cap .pf.an { opacity: 1; }
.cap .pf svg { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { .cap .pf { transition: none; } }
</style></head><body>
<div id="kopf">
  <h1>A-75 Muster</h1>
  <div class="cap" id="wahl"><div class="scroll">
    <button type="button" data-v="heute">Heute</button><button type="button" data-v="a">55</button><button type="button" data-v="b">65</button>
    <button type="button" data-v="c">80</button><button type="button" data-v="d">112</button></div></div>
</div>
<div id="blatt">
  <p class="hinweis" id="txt"></p>
  <div class="step"><label>Reisemittel</label>
    <div class="chips" id="tr"></div>
  </div>
  <div class="step">
    <div class="step-head"><label><span class="step-num">1</span>Wetter</label></div>
    <div class="emoji-row strip" id="wxrow"></div>
  </div>
  <div class="step">
    <div class="step-head"><label><span class="step-num">2</span>Wie war der Tag?</label></div>
    <div class="emoji-row strip" id="mood"></div>
  </div>
</div>
<script>
const TRANSPORT = [['🚗','PKW'],['🚆','Zug'],['🚲','Fahrrad'],['✈️','Flugzeug'],['🚙','Leihwagen'],['🚢','Schiff'],['🚐','Wohnmobil'],['🚶','Fuß']];
const WEATHER = ['☀️', '🌤', '🌦', '🌧', '☁️', '⛈', '❄️'];
const MOODS = ['🙂', '😊', '😉', '👍', '😋', '😌', '😏', '😳', '🤪', '🥶', '🤷🏻‍♂️', '☹️', '🤮'];
const FADE = { a: 55, b: 65, c: 80, d: 112 };
const TEXT = {
  heute: '<b>Heute:</b> Verlauf 48 px am Rand, wo es weitergeht.',
  a: '<b>A · 55 px:</b> Verlauf 55 px, dazu kleine Pfeile; ein Pfeil verschwindet, sobald das Ende auf seiner Seite erreicht ist.',
  b: '<b>B · 65 px:</b> wie A, Verlauf 65 px.',
  c: '<b>C · 80 px:</b> wie A, Verlauf 80 px.',
  d: '<b>D · 112 px:</b> wie A, Verlauf 112 px.' };
const v = FADE[new URLSearchParams(location.search).get('v')] ? new URLSearchParams(location.search).get('v') : 'heute';
const NEU = v !== 'heute';
document.documentElement.classList.toggle('neu', NEU);
if (NEU) document.documentElement.style.setProperty('--fade', FADE[v] + 'px');
document.documentElement.classList.toggle('phone', innerWidth < 700 || innerHeight < 500);
document.getElementById('txt').innerHTML = TEXT[v] + ' Zum Ausprobieren die Kapseln seitlich wischen.';
document.querySelectorAll('#wahl button').forEach(b => {
  b.setAttribute('aria-pressed', b.dataset.v === v);
  b.onclick = () => { location.search = '?v=' + b.dataset.v; };
});

const PF = { l: '<path d="m15 18-6-6 6-6"/>', r: '<path d="m9 18 6-6-6-6"/>' };
const pfeil = s => NEU ? `<span class="pf ${s}" aria-hidden="true"><svg viewBox="0 0 24 24">${PF[s]}</svg></span>` : '';
const capHtml = (buttons, id = '') => `<div class="cap"><div class="scroll" ${id ? `id="${id}"` : ''}>${buttons}</div>${pfeil('l')}${pfeil('r')}</div>`;
// wie mountCap (ui.js), dazu die Pfeile: sichtbar, solange es auf ihrer Seite weitergeht
function mountCap(root) {
  root.querySelectorAll('.cap .scroll').forEach(strip => {
    const cap = strip.parentElement;
    const fade = () => {
      const l = strip.scrollLeft > 2, r = strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 2;
      strip.classList.toggle('fl', l); strip.classList.toggle('fr', r);
      cap.querySelector('.pf.l')?.classList.toggle('an', l);
      cap.querySelector('.pf.r')?.classList.toggle('an', r);
    };
    strip.addEventListener('scroll', fade, { passive: true });
    strip._fade = fade;
    requestAnimationFrame(fade);
  });
}
document.getElementById('tr').innerHTML = capHtml(TRANSPORT.map(([i, n]) =>
  `<button type="button" aria-pressed="${n === 'Wohnmobil'}">${i} ${n}</button>`).join(''), 'transport');
document.getElementById('wxrow').innerHTML = capHtml(WEATHER.map(w => `<button type="button" aria-pressed="${w === '🌤'}">${w}</button>`).join(''), 'wx');
document.getElementById('mood').innerHTML = capHtml(MOODS.map(m => `<button type="button">${m}</button>`).join(''))
  + '<button type="button" class="reset" aria-label="Standard-Smileys wiederherstellen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>';
document.querySelectorAll('#blatt .cap .scroll button').forEach(b =>
  b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
mountCap(document.getElementById('blatt'));
// Drehen und Fenstergröße: Verlauf und Pfeile neu (passt dann alles, verschwinden beide)
addEventListener('resize', () => {
  document.documentElement.classList.toggle('phone', innerWidth < 700 || innerHeight < 500);
  document.querySelectorAll('#blatt .cap .scroll').forEach(s => s._fade());
});
</script>
</body></html>
