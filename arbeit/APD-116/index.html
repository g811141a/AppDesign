<!doctype html>
<html lang="de" data-ts="l"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APD-116 Dateiname</title>
<link rel="stylesheet" href="../../fassung/4.56.0/design.css">
<style>
/* APD-116 Muster ‚Dateiname in eigener Zeile‘ (Sitzung Reiselogbuch 0102; Fälle 5 und 6 ‚heruntergeladen‘ und ‚Fehler‘ Sitzung 0103). design.css der Fassung 4.56.0; die Kästen bilden das kleine
   Hinweisfenster #msg nach (Breite wie #msg, Kopf ohne Strich, Text zentriert). Neu: der Name als eigener Block (.fname), Umbruch nur an
   Leerzeichen (jedes Wort als inline-block); ein einzelnes Wort länger als die Zeile bricht notfalls in sich. Nur hell. */
html { color-scheme: light; }
body { background: var(--bg); }
.muster { max-width: 820px; margin: 0 auto; padding: 8px 16px 40px; }
.muster > p { color: var(--muted); margin: 0 0 10px; }
.reihe { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0 22px; }
.spalte { flex: 1 1 300px; min-width: 0; }
.spalte h2 { font-size: var(--t-headline); margin: 0 0 6px; }
.mbox { width: min(max(360px, calc(360px * var(--f-body))), 100%); background: var(--dlg-bg); color: var(--ink); border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18); margin: 0 auto; }
.mbox .mkopf { text-align: center; font-weight: 600; font-size: var(--t-headline); padding: 16px 12px 8px; }
.mbox .msg-text { text-align: center; padding: 0 16px 16px; }
.neu .msg-text .fname { display: block; margin-top: 2px; }
/* jedes Wort am Stück (kein Umbruch nach ‚-‘ oder ‚.‘); nur ein Wort, das länger ist als die Zeile, bricht in sich */
.neu .msg-text .fname .fw { display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
.ts { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.ts button { padding: 6px 12px; border-radius: 16px; border: none; background: var(--btn, #e9e9eb); color: inherit; font: inherit; }
.ts button[aria-pressed=true] { background: var(--accent); color: #fff; }
</style></head><body>
<div class="muster">
  <h1 class="nb-title" style="font-size:var(--t-title2);margin:8px 0 4px">APD-116 · Dateiname im Hinweisfenster</h1>
  <p>Links heute, rechts neu: der Dateiname steht allein in einer neuen Zeile und bricht nur nach einem Leerzeichen um.</p>
  <div class="ts" id="ts"><button data-ts="l">Text Standard</button><button data-ts="xxxl">Text groß</button><button data-ts="ax3">Text sehr groß</button></div>
  <div id="faelle"></div>
</div>
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Texte wie SHARE_RESULT in ui.js 4.56.0 (heute) bzw. mit dem Namen als eigenem Block (neu)
const HEUTE = {
  shared: n => `✅ Teilen-Menü abgeschlossen für <b>${esc(n)}</b>.<div class="hint">Wenn du ‚In Dateien sichern‘ gewählt hast, liegt die Datei im gewählten Ordner.</div>`,
  aborted: n => `⚠️ Teilen-Menü abgebrochen – <b>${esc(n)}</b> wurde nicht gespeichert.`,
  print: n => `✅ Drucken-Menü geöffnet für <b>${esc(n)}</b>.<div class="hint">Dort über ‚Teilen‘ → ‚In Dateien sichern‘ als PDF ablegen.</div>`,
  downloaded: n => `✅ <b>${esc(n)}</b> wird geladen.<div class="hint">Du findest die Datei in der Dateien-App unter ‚Downloads‘.</div>`,
  error: n => `⚠️ <b>${esc(n)}</b> konnte nicht übergeben werden.`,
};
const fn = n => `<b class="fname">${n.split(' ').map(w => `<span class="fw">${esc(w)}</span>`).join(' ')}</b>`;
const NEU = {
  shared: n => `✅ Teilen-Menü abgeschlossen für${fn(n)}<div class="hint">Wenn du ‚In Dateien sichern‘ gewählt hast, liegt die Datei im gewählten Ordner.</div>`,
  aborted: n => `⚠️ Teilen-Menü abgebrochen – nicht gespeichert:${fn(n)}`,
  print: n => `✅ Drucken-Menü geöffnet für${fn(n)}<div class="hint">Dort über ‚Teilen‘ → ‚In Dateien sichern‘ als PDF ablegen.</div>`,
  downloaded: n => `✅ Wird geladen:${fn(n)}<div class="hint">Du findest die Datei in der Dateien-App unter ‚Downloads‘.</div>`,
  error: n => `⚠️ Konnte nicht übergeben werden:${fn(n)}`,
};
const FAELLE = [
  ['Backup', 'shared', 'Ω Backup Reiselogbuch 2026.11.08 09.17.json'],
  ['Ausgabe', 'shared', 'Reiselogbuch Australien und Neuseeland 2026 2026.08.24-2026.11.11 V003.html'],
  ['Backup', 'aborted', 'Ω Backup Reiselogbuch 2026.11.08 09.17.json'],
  ['Abgleichbericht', 'print', 'Abgleichbericht 2026.11.08 09.17.pdf'],
  ['Ausgabe (ohne Teilen-Menü)', 'downloaded', 'Reiselogbuch Australien und Neuseeland 2026 2026.08.24-2026.11.11 V003.html'],
  ['Backup (Fehler)', 'error', 'Ω Backup Reiselogbuch 2026.11.08 09.17.json'],
];
const box = (k, titel, html) => `<div class="mbox ${k}"><div class="mkopf">${titel}</div><div class="msg-text">${html}</div></div>`;
document.getElementById('faelle').innerHTML = FAELLE.map(([t, art, n], i) =>
  `<div class="reihe" data-fall="${i}"><div class="spalte"><h2>heute</h2>${box('heute', t, HEUTE[art](n))}</div><div class="spalte"><h2>neu</h2>${box('neu', t, NEU[art](n))}</div></div>`).join('');
const setTs = ts => { document.documentElement.dataset.ts = ts; document.querySelectorAll('#ts button').forEach(b => b.setAttribute('aria-pressed', b.dataset.ts === ts)); };
document.getElementById('ts').onclick = e => { const b = e.target.closest('button'); if (b) setTs(b.dataset.ts); };
setTs('l');
</script>
</body></html>
