<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APD-107 Muster">
<title>APD-107 Muster</title>
<link rel="stylesheet" href="../fassung/4.48.1/design.css">
<style>
/* APD-107 Muster (Sitzung Reiselogbuch 0071, Zusammenarbeit 0 Nr. 6 und 23): sichtbare Rückmeldung beim Berühren eines Leisten-Knopfs.
   Befund P-88/1: Safari berechnet am Knopf Deckkraft 0,35 (Messung APD-106), zu sehen ist am Gerät nichts – Vermutung: der Finger deckt
   das Icon, die Kapsel bleibt weiß. A = heute (Icon 35 %), B = grauer Kreis hinter dem Icon (Apple: ‚illumination‘), C = der Knopf wächst
   als eigene Glasfläche über die Kapsel (Apple Liquid Glass ‚interactive‘: Skalieren). Dazu schon die Korrektur aus APD-107 S-1: nach dem
   Wegziehen löst das Loslassen nichts aus, egal wie lange der Finger noch liegt. Nur hell (Vereinbarung 30.10.2026). */
html { color-scheme: light; }
body { margin: 0; background: var(--bg); font: 17px/1.4 -apple-system, system-ui, sans-serif; color: var(--text, #000); -webkit-user-select: none; user-select: none; }
main { max-width: 640px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
h1 { font-size: 22px; margin: 8px 0 4px; }
.hinweis { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.var { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; border-top: .5px solid var(--line); }
.var b { display: block; } .var small { color: var(--muted); font-size: 14px; }
.var .grp { --k: 1; --fb: 1; }
.meld { min-height: 1.4em; margin-top: 4px; font-size: 14px; color: var(--muted); }
.meld.an { color: #248a3d; } .meld.weg { color: #c93400; }
/* A – heute: Icon und Text 35 % */
.vA button.b { opacity: .35; }
/* B – grauer Kreis hinter dem Icon, Icon bleibt kräftig */
.vB button::after { content: ''; position: absolute; z-index: -1; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%;
  transform: translate(-50%, -50%) scale(.8); background: rgba(0,0,0,.11); opacity: 0; transition: opacity .15s, transform .15s; }
.vB button.b::after { opacity: 1; transform: translate(-50%, -50%) scale(1); transition: none; }
/* C – der Knopf wächst als eigene Glasfläche über die Kapsel */
.vC { overflow: visible; }
.vC button { transition: transform .2s, box-shadow .2s, background-color .2s; }
.vC button.b { transform: scale(1.3); background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.08); z-index: 2;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.25), box-shadow .2s; }
@media (prefers-reduced-motion: reduce) { .vC button.b { transform: none; } }
</style></head><body><main>
<h1>APD-107 Muster – Berühren sichtbar</h1>
<p class="hinweis">Je Variante: 1. den Finger auf ‚…‘ legen und 2 s liegen lassen – siehst du neben dem Finger etwas? 2. loslassen – ‚ausgelöst‘. 3. noch einmal auflegen, gut 1 cm wegziehen, 1 s liegen lassen, loslassen – ‚abgebrochen, nichts ausgelöst‘.</p>
<div id="liste"></div>
</main>
<script>
const SHARE = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>';
const MEHR = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>';
const VAR = [['A', 'heute: Icon blass (35 %)', 'die Kapsel bleibt, nur das Icon wird hell'],
  ['B', 'grauer Kreis hinter dem Icon', 'Kreis so hoch wie die Kapsel, Icon bleibt kräftig'],
  ['C', 'Knopf wächst als Glasfläche', 'hebt sich mit Schatten über die Kapsel, wie iOS 26']];
document.getElementById('liste').innerHTML = VAR.map(([v, t, s]) => `<div class="var"><div><b>${v} – ${t}</b><small>${s}</small>
  <div class="meld" id="m${v}">&nbsp;</div></div><span class="grp v${v}"><button type="button" aria-label="Ausgabe">${SHARE}</button><button type="button" aria-label="Mehr">${MEHR}</button></span></div>`).join('');
// Berühren wie ui.js (R-3.6), dazu die Korrektur APD-107/S-1: nach dem Abbruch ist das eine Loslassen gesperrt – ohne Zeitgrenze
let ber = null, gesperrt = null;
addEventListener('pointerdown', e => {
  gesperrt = null;
  const k = e.target.closest('.grp button'); if (!k || !e.isPrimary) return;
  ber = { k, x0: e.clientX, y0: e.clientY }; k.classList.add('b');
}, true);
addEventListener('pointermove', e => {
  if (ber && Math.hypot(e.clientX - ber.x0, e.clientY - ber.y0) > 10) { ber.k.classList.remove('b'); gesperrt = ber.k; ber = null; }
}, true);
const aus = () => { if (ber) { ber.k.classList.remove('b'); ber = null; } };
addEventListener('pointerup', e => { if (gesperrt) { const k = gesperrt; setTimeout(() => { if (gesperrt === k) gesperrt = null; }, 400); meld(k, 'abgebrochen, nichts ausgelöst', 'weg'); } aus(); }, true);
addEventListener('pointercancel', () => { if (ber) gesperrt = ber.k; aus(); }, true);
addEventListener('click', e => {
  const k = e.target.closest('.grp button'); if (!k) return;
  if (gesperrt && gesperrt.contains(e.target)) { gesperrt = null; e.preventDefault(); return; }
  meld(k, `${k.getAttribute('aria-label')} ausgelöst`, 'an');
}, true);
addEventListener('contextmenu', e => e.preventDefault());
function meld(k, text, art) {
  const m = document.getElementById('m' + k.parentElement.className.match(/v([ABC])/)[1]);
  m.textContent = text; m.className = 'meld ' + art; clearTimeout(m.t); m.t = setTimeout(() => { m.innerHTML = '&nbsp;'; m.className = 'meld'; }, 1500);
}
</script>
</body></html>
