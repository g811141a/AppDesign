<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A-36 Muster">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>A-36 Muster</title>
<style>
/* A-36 Tastatur ohne Springen – Muster mit Messung, 3. Fassung (Sitzung Reiselogbuch 0021, Fall-Liste arbeit/A-36 Fall-Liste.md 6b;
   Zusammenarbeit 0 Nr. 20 seit 2.15.0: vorher im Safari-Modell geprüft – arbeit/A-36 Muster prüfen.mjs –, führt durch den Versuch,
   zeigt am Gerät nur ‚aufgenommen‘; bewertet wird aus den Rohdaten mit arbeit/A-36 auswerten.mjs).
   Varianten (oben umschalten, ?v= wählt die erste; der Versuch nutzt V1):
   Heute = wie AppDesign 4.28.0: Safari verschiebt, das Muster gleicht 2 Bilder später aus (--vv-top), Kapsel und iPhone/iPad nach innerHeight.
   V1 = beim Antippen (Ende der Berührung, vor dem Fokus) rollt der Inhalt nur so weit wie nötig: das Feld endet mindestens 32 px
        (gemessene Grenze 24 + 8 Reserve) über der künftigen Tastatur, nie über dem oberen Rand seines Bereichs; liegt es schon so,
        bewegt sich nichts. Das iPad-Fenster bleibt beim Antippen stehen und gleitet erst mit der Tastatur (0,25 s) in die Mitte des
        sichtbaren Bereichs, beim Schließen zurück; seine Höhe bleibt wie vor dem Antippen. Der Platz unter dem Inhalt bleibt so groß,
        dass nichts zurückrutscht. Kapsel nach der Bildschirmhöhe, iPhone/iPad nach dem Bildschirm (nicht nach innerHeight). */
:root { --bg: #f2f2f7; --card: #fff; --line: #d1d1d6; --txt: #000; --sub: #6e6e73; --blue: #007aff; --ok: #248a3d; --bad: #d70015;
  --vv-top: 0px; --vv-h: 100dvh; --vv-bottom: 0px; --side: 0px; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --line: #38383a; --txt: #fff; --sub: #98989d; --ok: #30d158; --bad: #ff453a; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--txt);
  font: 17px -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
html.ipad { --side: 280px; }
#side { position: fixed; left: 0; top: var(--vv-top); width: var(--side); height: var(--vv-h); background: var(--card); border-right: 1px solid var(--line);
  padding: 12px; overflow: auto; display: none; }
html.ipad #side { display: block; }
#side h2 { font-size: 20px; margin: 4px 0 12px; }
#side div { padding: 10px 8px; border-radius: 10px; }
#side div.sel { background: var(--blue); color: #fff; }
#rahmen { position: fixed; top: var(--vv-top); left: var(--side); right: 0; height: var(--vv-h); display: flex; flex-direction: column; }
.kopf { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; padding: 0 12px; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.kopf b { text-align: center; font-size: 17px; }
.kapsel { display: inline-flex; background: var(--card); border-radius: 999px; padding: 2px; gap: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.kapsel a { padding: 6px 10px; border-radius: 999px; color: var(--blue); text-decoration: none; font-size: 15px; }
.kapsel a.on { background: var(--blue); color: #fff; }
.suche { flex: none; padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line); display: none; }
html.mitsuche .suche { display: block; }
.rolle { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 12px 16px 24px; }
input, textarea { font: inherit; font-size: 17px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--txt); }
textarea { min-height: 96px; resize: none; }
label { display: block; margin: 14px 0 4px; color: var(--sub); font-size: 15px; }
.zeile { background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.zeile small { color: var(--sub); }
button { font: inherit; color: var(--blue); background: var(--card); border: 0; border-radius: 999px; padding: 8px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
/* feste Höhe: ein neues Ergebnis darf den Inhalt (und das Feld mit Fokus) nicht verschieben */
#anleitung { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 15px; line-height: 1.4;
  height: 9.5em; overflow: auto; overscroll-behavior: contain; }
#anleitung p { margin: 2px 0 6px; } #anleitung .ok { color: var(--ok); } #anleitung small { color: var(--sub); }
.dschritt { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--card); font-size: 14px; line-height: 1.35; height: 4.3em; overflow: hidden; }
.knopfe { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.fab { position: fixed; right: 16px; bottom: calc(16px + max(var(--vv-bottom), env(safe-area-inset-bottom))); display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.fab button { width: 44px; height: 44px; padding: 0; font-size: 20px; }
html.mitsuche.quer .fab { display: none; }
#sonde { position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; pointer-events: none; }
dialog { border: 0; padding: 0; background: var(--bg); color: var(--txt); border-radius: 14px; width: min(540px, 100vw - 24px); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
/* V1: das iPad-Fenster gleitet mit der Tastatur (0,25 s) in die Mitte des sichtbaren Bereichs und beim Schließen zurück */
dialog.gleitet { transition: top .25s ease; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { display: flex; flex-direction: column; max-height: var(--dlg-max, calc(100vh - 40px)); margin: 0; }
html.phone dialog { width: 100%; max-width: none; max-height: none; height: var(--dlg-max); border-radius: 0; box-shadow: none; }
html.phone dialog form { height: 100%; }
.dkopf { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dkopf button:last-child { justify-self: end; font-weight: 600; }
.dkörper { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 4px 16px 24px; }
</style></head><body>
<nav id="side"><h2>Reiselogbücher</h2><div class="sel">Australien</div><div>Japan</div><div>Island</div></nav>
<div id="rahmen">
  <div class="kopf" id="kopf"><span></span><b id="titel">A-36</b><span style="justify-self:end" class="kapsel" id="var">
    <a data-v="heute">Heute</a><a data-v="v1">V1</a></span></div>
  <div class="suche" id="suchzeile"><input type="search" id="such" placeholder="Suchen" enterkeyhint="search" autocomplete="off"></div>
  <div class="rolle" id="rolle">
    <div id="anleitung"></div>
    <div class="knopfe"><button type="button" id="fenster">Fenster öffnen</button><button type="button" id="suchknopf">Suche ein/aus</button>
      <button type="button" id="teilen">Messung teilen</button><button type="button" id="vergessen">Höhen vergessen</button>
      <button type="button" id="neu">Messung neu beginnen</button></div>
    <label>Feld oben (über jeder Tastatur)</label><input type="text" id="oben" placeholder="oben">
    <div id="liste"></div>
    <label>Gesamtausgaben (Ziffern)</label><input type="text" id="kosten" inputmode="decimal" placeholder="0,00">
    <div class="zeile">Reisedaten <small>(unter dem Feld wie im Reiselogbuch)</small></div><div class="zeile">Ende</div>
  </div>
</div>
<div class="fab"><button type="button" id="hoch" aria-label="Nach oben">↑</button><button type="button" id="runter" aria-label="Ans Ende">↓</button></div>
<div id="sonde"></div>
<dialog id="dlg"><form method="dialog">
  <div class="dkopf" id="dkopf"><button type="button" id="dlgX">Abbrechen</button><b>Mi., 26.08.2026</b><button type="button" id="dlgOk">Fertig</button></div>
  <div class="dkörper" id="dkoerper">
    <div class="dschritt" id="dschritt"></div>
    <label>Wetter</label><input type="text" id="fWetter" placeholder="☀️">
    <label>Programm</label><textarea id="fProgram" placeholder="Wie ist der Tag verlaufen?"></textarea>
    <label>Unterkunft</label><input type="text" id="fQuarter" placeholder="Hotel">
    <label>Ort</label><input type="text" id="fPlace" placeholder="Ort für Google Maps">
    <label>Notiz (ganz unten)</label><input type="text" id="fNotiz" placeholder="Notiz">
  </div></form></dialog>
<script>
const $ = s => document.querySelector(s), vv = window.visualViewport, root = document.documentElement, R = Math.round;
let V = (location.search.match(/[?&]v=(heute|v1)/) || [, 'v1'])[1];
const vName = v => ({ heute: 'Heute', v1: 'V1' })[v];
const ZIEL = 32;   // Feld endet mindestens so weit über der künftigen Tastatur (gemessen: ab 24 px verschiebt Safari nicht, + 8 Reserve)
// Umschalten ohne Neuladen: die Messung läuft weiter
function variante(v) {
  V = v; document.querySelectorAll('#var a').forEach(a => a.classList.toggle('on', a.dataset.v === V));
  $('#titel').textContent = 'A-36 · ' + vName(V);
  try { history.replaceState(null, '', '?v=' + V); } catch {}
  if (window.a36bereit) { zeile('variante ' + V); zeigeAnleitung(); }
}
document.querySelectorAll('#var a').forEach(a => { a.href = '?v=' + a.dataset.v; a.onclick = e => { e.preventDefault(); document.activeElement?.blur(); variante(a.dataset.v); }; });
$('#liste').innerHTML = Array.from({ length: 14 }, (_, i) => `<div class="zeile">Tag ${i + 1} <small>· Programm ${i + 1}</small></div>`).join('');

// ---------- Gerät, Höhe, Tastaturhöhe ----------
// iPhone/iPad: Heute wie ui.js 4.28.0 (innerHeight < 500 – am iPad mit Tastatur falsch, A-36), V1 fest nach dem Bildschirm
const iphone = () => Math.min(screen.width, screen.height) < 500;
const phone = () => V === 'heute' ? innerWidth < 700 || innerHeight < 500 : iphone();
const quer = () => innerWidth > innerHeight + scrollY;
const hoehe = () => innerHeight + scrollY;   // Bildschirmhöhe der Seite: Safari 26 meldet innerHeight = Höhe − scrollY (Fall-Liste 1)
let H = hoehe();
const lage = () => `${iphone() ? 'iPhone' : 'iPad'} ${quer() ? 'quer' : 'hoch'}`;
const art = f => /^(decimal|numeric)$/.test(f.getAttribute('inputmode') || '') ? 'ziffern' : 'text';
const schluessel = f => `${lage()} ${art(f)}`;
const SCHAETZUNG = { 'iPhone hoch text': 403, 'iPhone hoch ziffern': 403, 'iPhone quer text': 276, 'iPhone quer ziffern': 232,
  'iPad quer text': 428, 'iPad quer ziffern': 428, 'iPad hoch text': 340, 'iPad hoch ziffern': 340 };   // alle am Gerät gemessen (20.10.)
let gemerkt = {}; try { gemerkt = JSON.parse(localStorage.getItem('a36.kb') || '{}'); } catch {}
const tastatur = f => gemerkt[schluessel(f)] ?? SCHAETZUNG[schluessel(f)] ?? R(H * 0.5);
function layout() { root.classList.toggle('phone', phone()); root.classList.toggle('ipad', !phone()); root.classList.toggle('quer', quer()); }
const offen = () => vv.height < hoehe() - 80;

// ---------- Rahmen und Fenster nach dem sichtbaren Bereich (wie placeDialogs) ----------
let fensterHoehe = 0;   // V1: Höhe des iPad-Fensters vor dem Antippen – sie bleibt, auch wenn Platz unter dem Inhalt dazukommt
function place() {
  const top = Math.max(0, vv.offsetTop), h = vv.height, dlg = $('#dlg');
  root.style.setProperty('--vv-top', R(top) + 'px');
  root.style.setProperty('--vv-h', R(h) + 'px');
  // Kapsel: Heute wie 4.28.0 (innerHeight − top − h), V1 Bildschirmhöhe − top − h
  root.style.setProperty('--vv-bottom', Math.max(0, R((V === 'heute' ? innerHeight : hoehe()) - top - h)) + 'px');
  const max = phone() ? h : h - 20;
  root.style.setProperty('--dlg-max', Math.max(200, V === 'v1' && !phone() && fensterHoehe ? Math.min(max, fensterHoehe) : max) + 'px');
  layout();
  if (!dlg.open) return;
  if (phone()) { dlg.style.margin = '0'; dlg.style.top = R(top) + 'px'; dlg.style.bottom = 'auto'; return; }
  dlg.style.margin = '0 auto'; dlg.style.bottom = 'auto';
  const jetzt = parseFloat(dlg.style.top), ganz = jetzt >= top + 10 - 1 && jetzt + dlg.offsetHeight <= top + h - 10 + 1;
  if (V === 'v1' && offen() && ganz) return;   // ganz sichtbar über der Tastatur: nicht bewegen
  dlg.style.top = R(top + Math.max(10, (h - dlg.offsetHeight) / 2)) + 'px';
}
const behaelter = f => f.closest('.dkörper, .rolle');
// Feld 16 px über die Tastatur rollen (R-4.5) – im Rollbereich bzw. im Fenster
function insBild(f, unten) {
  const c = behaelter(f); if (!c) return;
  const r = f.getBoundingClientRect(), b = c.getBoundingClientRect(), grenze = Math.min(unten, b.bottom) - 16;
  if (r.bottom > grenze) c.scrollTop += r.bottom - grenze; else if (r.top < b.top) c.scrollTop -= b.top - r.top + 16;
}
// Platz unter dem Inhalt: beim Antippen reichlich, danach immer genau so viel, dass der Rollstand bleibt
const basis = c => { if (!c.dataset.basis) c.dataset.basis = parseFloat(getComputedStyle(c).paddingBottom) || 0; return +c.dataset.basis; };
const platz = (c, px) => { c.style.paddingBottom = (basis(c) + px) + 'px'; };
function knapp(c) {
  const y = c.scrollTop, pad = parseFloat(getComputedStyle(c).paddingBottom) || 0, natur = c.scrollHeight - pad;
  c.style.paddingBottom = Math.max(basis(c), Math.ceil(y + c.clientHeight - natur)) + 'px'; c.scrollTop = y;
}

// ---------- Messung (vor allen anderen Hörern: Lage vor dem Ausgleich) ----------
// bleibt über Neuladen erhalten (sessionStorage); am Gerät wird nichts bewertet – nur aufgenommen
let alt = null; try { alt = JSON.parse(sessionStorage.getItem('a36.messung3') || 'null'); } catch {}
const zeilen = alt?.zeilen || [], start = alt?.start || Date.now();
const fortschritt = alt?.fortschritt || {};   // je Lage: Anzahl erledigter Schritte
if (alt) zeilen.push(`${Date.now() - start} # neu geladen`);
const sichere = () => { try { sessionStorage.setItem('a36.messung3', JSON.stringify({ zeilen: zeilen.slice(-20000), start, fortschritt })); } catch {} };
addEventListener('pagehide', sichere);
let oeffnet = false;   // showModal setzt den Fokus, bevor das Fenster steht – diese Lage nicht aufzeichnen (Messartefakt der 2. Fassung)
const sicht = s => { const e = $(s); return e && e.getClientRects().length ? e.getBoundingClientRect() : null; };
function werte() {
  const d = $('#dlg').open && !oeffnet ? sicht('#dkopf') : null, k = sicht('.fab'), so = $('#sonde').getBoundingClientRect(), a = document.activeElement;
  const fr = a?.matches?.('input, textarea') ? a.getBoundingClientRect() : null;
  return { vh: R(vv.height), vt: R(vv.offsetTop), sy: R(scrollY), ih: innerHeight, ch: root.clientHeight, kopf: R(sicht('#kopf').top),
    side: sicht('#side') ? R(sicht('#side').top) : '-', dkopf: d ? R(d.top) : '-', dlinks: d ? R($('#dlg').getBoundingClientRect().left) : '-',
    kapsel: k ? R(k.bottom) : '-', sonde: R(so.bottom), fokus: a && a !== document.body ? a.id || a.tagName.toLowerCase() : '-',
    ft: fr ? R(fr.top) : '-', fb: fr ? R(fr.bottom) : '-', v: V };
}
function zeile(ereignis = '') {
  const w = werte(), t = Date.now() - start, s = Object.values(w).join(' ');
  if (!ereignis && s === zeile.zuletzt) return w;
  zeile.zuletzt = s; if (zeilen.length < 30000) zeilen.push(`${t} ${s}${ereignis ? ' ! ' + ereignis : ''}`);
  return w;
}
(function bild() { zeile(); requestAnimationFrame(bild); })();
['resize', 'scroll'].forEach(e => vv.addEventListener(e, () => { zeile('vv ' + e); bald(); }));
document.addEventListener('focusin', e => { zeile('focus ' + (e.target.id || e.target.tagName)); bald(); }, true);
document.addEventListener('focusout', e => { zeile('blur ' + (e.target.id || e.target.tagName)); bald(); }, true);
document.addEventListener('click', e => { const b = e.target.closest('button, input, textarea'); if (b) zeile('tippen ' + (b.id || b.tagName)); bald(); }, true);

// ---------- Geführter Versuch (Fall-Liste 6b): je Lage 9 Schritte, erledigt wird erst, wenn 800 ms lang Ruhe ist ----------
const aktiv = () => document.activeElement;
const SCHRITTE = [
  { text: 'Tippe „Fenster öffnen“.', ok: () => $('#dlg').open },
  { text: 'Tippe im Fenster ins Feld „Ort“.', ok: () => $('#dlg').open && aktiv()?.id === 'fPlace' && offen() },
  { text: 'Tippe ins Feld „Notiz (ganz unten)“ – die Tastatur bleibt offen.', ok: () => $('#dlg').open && aktiv()?.id === 'fNotiz' && offen() },
  { text: 'Schließe nur die Tastatur, das Fenster bleibt offen (iPhone: „Fertig“ bzw. ✓ über der Tastatur; iPad: Tastatur-Taste unten rechts).',
    ok: () => $('#dlg').open && !offen() && !aktiv()?.matches?.('input, textarea') },
  { text: 'Tippe oben im Fenster auf „Fertig“.', ok: () => !$('#dlg').open },
  { text: 'Tippe unten rechts auf ↓ und dann ins Feld „Gesamtausgaben“.', ok: () => aktiv()?.id === 'kosten' && offen() },
  { text: 'Schließe die Tastatur (iPhone: „Fertig“ bzw. ✓ über der Tastatur; iPad: Tastatur-Taste unten rechts).',
    ok: () => !offen() && !aktiv()?.matches?.('input, textarea') },
  { text: 'Tippe auf ↑, dann „Suche ein/aus“ und ins Suchfeld oben.', ok: () => aktiv()?.id === 'such' && offen() },
  { text: 'Schließe die Tastatur und tippe wieder „Suche ein/aus“.', ok: () => !offen() && !root.classList.contains('mitsuche') },
];
const LAGEN = () => iphone() ? ['iPhone hoch', 'iPhone quer'] : ['iPad hoch', 'iPad quer'];
const fehlt = () => LAGEN().reduce((n, l) => n + SCHRITTE.length - (fortschritt[l] || 0), 0);
let ruhe = null;
function bald() { clearTimeout(ruhe); ruhe = setTimeout(pruefe, 800); }
function pruefe() {
  const l = lage(), n = fortschritt[l] || 0;
  if (V === 'v1' && n < SCHRITTE.length && SCHRITTE[n].ok()) {
    fortschritt[l] = n + 1; zeile(`erledigt ${l} S${n + 1}`); sichere();
    if (n + 1 < SCHRITTE.length && SCHRITTE[n + 1].ok()) return bald();
  }
  zeigeAnleitung();
}
function zeigeAnleitung() {
  const l = lage(), n = fortschritt[l] || 0, rest = fehlt(), andere = LAGEN().find(x => x !== l);
  let kopf, text;
  if (V !== 'v1') { kopf = 'Variante Heute (nur zum Vergleich)'; text = 'Der Versuch läuft mit V1 – oben rechts auf „V1“ tippen.'; }
  else if (n < SCHRITTE.length) { kopf = `${l} · Schritt ${n + 1} von ${SCHRITTE.length}`; text = SCHRITTE[n].text; }
  else if (rest) { kopf = `${l} · alle Schritte aufgenommen ✓`; text = `Drehe das Gerät (${andere}) und mach dort dieselben Schritte.`; }
  else { kopf = 'Alle Schritte aufgenommen ✓'; text = 'Tippe „Messung teilen“ und leg die Datei im Chat ab.'; }
  const erledigt = n ? `<small class="ok">${Array.from({ length: n }, (_, i) => `S${i + 1} ✓`).join(' ')} aufgenommen</small>` : '';
  $('#anleitung').innerHTML = `<p><b>${kopf}</b></p><p>${text}</p>${erledigt}`;
  $('#dschritt').innerHTML = `<b>${kopf}:</b> ${text}`;
  $('#teilen').textContent = rest ? `Messung teilen (noch ${rest} Schritte)` : 'Messung teilen';
}

// ---------- Ausgleich bei jeder Meldung und Tastaturhöhe merken ----------
function gemeldet() {
  const vorH = $('#rolle').scrollTop, vorD = $('#dkoerper').scrollTop, d = $('#dlg'), ipadFenster = d.open && !phone() && V === 'v1';
  // V1: das iPad-Fenster gleitet mit der Tastatur in die Mitte des sichtbaren Bereichs bzw. zurück
  if (ipadFenster) { d.classList.add('gleitet'); clearTimeout(gemeldet.t); gemeldet.t = setTimeout(() => d.classList.remove('gleitet'), 300); }
  // vor dem Wachsen des Rahmens Platz geben, sonst kürzt der Browser den Rollstand und der Inhalt rutscht zurück
  for (const c of [$('#rolle'), $('#dkoerper')]) if (c.style.paddingBottom) platz(c, 2000);
  place();
  $('#rolle').scrollTop = vorH; $('#dkoerper').scrollTop = vorD;
  for (const c of [$('#rolle'), $('#dkoerper')]) if (c.style.paddingBottom) knapp(c);
  if (ipadFenster) place();   // Fenster nach dem knappen Platz neu mitteln
  const f = document.activeElement;
  if (offen() && f?.matches('input, textarea')) {
    gemerkt[schluessel(f)] = R(hoehe() - vv.height); try { localStorage.setItem('a36.kb', JSON.stringify(gemerkt)); } catch {}
    insBild(f, vv.height);
  }
  if (!offen()) H = hoehe();
}
vv.addEventListener('resize', () => requestAnimationFrame(gemeldet));
vv.addEventListener('scroll', () => requestAnimationFrame(gemeldet));
addEventListener('resize', () => { if (!offen()) H = hoehe(); place(); zeile('lage ' + lage()); bald(); });

// ---------- V1: Antippen eines Felds abfangen (Ende der Berührung, vor dem Fokus) ----------
let beruehrung = null;
document.addEventListener('touchstart', e => { const t = e.touches[0]; beruehrung = { x: t.clientX, y: t.clientY, z: performance.now() }; }, { passive: true, capture: true });
document.addEventListener('touchend', e => {
  const b = beruehrung, f = e.target; beruehrung = null;
  if (V !== 'v1' || !b || !f.matches?.('input, textarea') || f === document.activeElement) return;
  const t = e.changedTouches[0];
  if (Math.hypot(t.clientX - b.x, t.clientY - b.y) > 10 || performance.now() - b.z > 600) return;   // gewischt bzw. lange gedrückt
  e.preventDefault();
  vorbereiten(f);
  f.focus({ preventScroll: true });
  try { const n = f.value.length; f.setSelectionRange(n, n); } catch {}
}, { passive: false, capture: true });
// V1: nur so weit rollen wie nötig – das Feld endet mindestens ZIEL px über der künftigen Tastatur, nie über dem oberen Rand seines
// Bereichs (+8 px). Das iPad-Fenster bleibt dabei stehen (es gleitet erst mit der Tastatur).
