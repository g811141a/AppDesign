   bewertet wird aus den Rohdaten mit arbeit/A-36 auswerten.mjs). Die Anleitung steht nur im Chat.

        der Nutzer nicht selbst wischt (höchstens 1,5 s). Ohne Rückstellung (Muster 7) nur als Gegenprobe (v3o).
        Platz unter dem Inhalt (6m): nach dem Schließen der Tastatur schrumpft er beim Rollen wieder (Muster 8 ließ ihn stehen – beim
        2. Mal ↓ verschwand der Inhalt oben).

<script>
const $ = s => document.querySelector(s), vv = window.visualViewport, root = document.documentElement, R = Math.round;
let V = 'v3';   // immer V3 – auch wenn das Symbol auf dem Home-Bildschirm noch eine alte Adresse (?v=heute) hat
// nur für die Gegenprobe im Modell (G-2), nicht am Gerät
function variante(v) { V = v; $('#titel').textContent = 'A-36 · 9' + (V === 'v3' ? '' : ' · ' + V); if (window.a36bereit) zeile('variante ' + V); }

const hoehe = () => innerHeight + scrollY;   // Bildschirmhöhe der Seite: Safari 26 meldet innerHeight = Höhe − scrollY (Fall-Liste 1)
let H = hoehe();
const lage = () => `${iphone() ? 'iPhone' : 'iPad'} ${quer() ? 'quer' : 'hoch'}`;
const art = f => /^(decimal|numeric)$/.test(f.getAttribute('inputmode') || '') ? 'ziffern' : 'text';
const schluessel = f => `${lage()} ${art(f)}`;

  'iPad quer text': 428, 'iPad quer ziffern': 428, 'iPad hoch text': 340, 'iPad hoch ziffern': 340 };   // alle am Gerät gemessen (20.10.; Ziffern hoch 376: Versuch 4)

let fensterHoehe = 0;   // V1: Höhe des iPad-Fensters vor dem Antippen – sie bleibt, auch wenn Platz unter dem Inhalt dazukommt
function place() {

  root.style.setProperty('--vv-bottom', Math.max(0, R((V === 'heute' ? innerHeight : hoehe()) - top - h)) + 'px');

  if (!dlg.open) return;
  if (phone()) { dlg.style.margin = '0'; dlg.style.top = R(top) + 'px'; dlg.style.bottom = 'auto'; return; }
  dlg.style.margin = '0 auto'; dlg.style.bottom = 'auto';
  const jetzt = parseFloat(dlg.style.top), ganz = jetzt >= top + 10 - 1 && jetzt + dlg.offsetHeight <= top + h - 10 + 1;
  // V1: ganz sichtbar über der Tastatur nicht bewegen – auch nach der Tastatur-Taste, solange ein Feld im Fenster den Fokus hat, damit
  // es beim erneuten Antippen in der oberen Hälfte bleibt (6c 4)
  if (V !== 'heute' && (offen() || dlg.contains(document.activeElement) && document.activeElement.matches('input, textarea')) && ganz) return;
  dlg.style.top = R(top + Math.max(10, (h - dlg.offsetHeight) / 2)) + 'px';
}
const behaelter = f => f.closest('.dkörper, .rolle');
// Feld 16 px über die Tastatur rollen (R-4.5) – im Rollbereich bzw. im Fenster

}

const zeilen = alt?.zeilen || [], start = alt?.start || Date.now();

const sichere = () => { try { sessionStorage.setItem('a36.messung9', JSON.stringify({ zeilen: zeilen.slice(-20000), start })); } catch {} };

  const d = $('#dlg').open && !oeffnet ? sicht('#dkopf') : null, k = sicht('.fab'), so = $('#sonde').getBoundingClientRect(), a = document.activeElement;
  const fr = a?.matches?.('input, textarea') ? a.getBoundingClientRect() : null;

document.addEventListener('click', e => { const b = e.target.closest('button, input, textarea'); if (b) zeile('tippen ' + (b.id || b.tagName)); bald(); }, true);

const aufgenommen = () => zeilen.filter(z => / ! focus (f[A-Z]\w*|kosten|such|oben)$/.test(z)).length;
function bald() { clearTimeout(bald.t); bald.t = setTimeout(() => { $('#zaehler').textContent = `${aufgenommen()} aufgenommen`; sichere(); }, 300); }

  for (const c of [$('#rolle'), $('#dkoerper')]) if (c.style.paddingBottom) knapp(c);

  if (V !== 'heute' && gemeldet.offen && !offen() && f?.matches('input, textarea')) f.blur();

}
vv.addEventListener('resize', () => requestAnimationFrame(gemeldet));
vv.addEventListener('scroll', () => requestAnimationFrame(gemeldet));
addEventListener('resize', () => { if (!offen()) H = hoehe(); place(); zeile('lage ' + lage()); bald(); });

// ---------- V2: sobald ein Feld den Fokus hat, sofort in die obere Hälfte rollen (die Berührung bleibt bei Safari) ----------
// Die Mitte des Felds höchstens 24 px über der Mitte des künftig sichtbaren Bereichs, nie über dem oberen Rand seines Bereichs

  const c = behaelter(f); if (!c) return 0;
  const kb = offen() ? R(hoehe() - vv.height) : tastatur(f), sichtbar = offen() ? vv.height : H - kb;
  const r = f.getBoundingClientRect(), b = c.getBoundingClientRect();

  if (n > 0) { vorbereiten(f, n); gerollt = { f, t: performance.now() }; if (V === 'v3') halten = { f, c: behaelter(f), y: behaelter(f).scrollTop, bis: performance.now() + 1500 }; }
  // V3: Fokus neu setzen, damit Safari die Lage nach dem Rollen liest – nur nach dem Rollen, nie bei offener Tastatur (dort hat V2 am
  // Gerät nichts verschoben, und ein neuer Fokus ließe die Tastatur flackern); v3b (Gegenprobe, Muster 6): readonly-Felder immer

  if (lesend === f) neuFokus(f, 'b');
  else if (n > 0 && !offen()) neuFokus(f, 'a');
}, true);
// Rückstellung (6k): springt der Rollbereich nach dem Rollen beim Fokus zurück, sofort wieder hin (scroll-Ereignis, vor dem nächsten Bild)
let halten = null;
document.addEventListener('scroll', e => {
  const h = halten;
  if (!h || e.target !== h.c) return;
  if (performance.now() > h.bis || document.activeElement !== h.f) { halten = null; return; }
  if (h.c.scrollTop < h.y - 20) { const alt = R(h.c.scrollTop); h.c.scrollTop = h.y; zeile(`zurückgestellt ${h.f.id} ${alt} → ${R(h.c.scrollTop)}`); }
