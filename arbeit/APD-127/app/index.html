  });
  // Von und Bis gleichen sich an, damit das Ende nie vor dem Beginn liegt.
  const dateChanged = () => { checks.dates.touched = true; fitDate(fStart); fitDate(fEnd); validate(); };
  fStart.oninput = () => { if (fStart.value && fEnd.value < fStart.value) fEnd.value = fStart.value; dateChanged(); };
  fEnd.oninput = () => { if (fEnd.value && fStart.value > fEnd.value) fStart.value = fEnd.value; dateChanged(); };
  fTitle.oninput = () => { if (fTitle.value.trim()) hadTitle = true; else if (hadTitle) checks.title.touched = true; validate(); };
  fTitle.onblur = () => { checks.title.touched = true; validate(); };
  let hadPeople = Boolean(fPeople.value.trim());
  fPeople.oninput = () => { if (fPeople.value.trim()) hadPeople = true; else if (hadPeople) checks.people.touched = true; validate(); };
  fPeople.onblur = () => { checks.people.touched = true; validate(); };
  validate();

  // Quartierliste nur mit sichtbarer Spalte Quartier.
  const fQuarterCol = dlg.querySelector('#fQuarterCol');
  const fQuarterList = dlg.querySelector('#fQuarterList');
  const syncQuarterList = () => {
    fQuarterList.disabled = !fQuarterCol.checked;
    dlg.querySelector('#fPriceOn').disabled = !fQuarterCol.checked;   // seit 3.42.0 (RLB-111)
    fQuarterList.closest('.step').classList.toggle('off', !fQuarterCol.checked);
  };
  fQuarterCol.onchange = syncQuarterList;
  syncQuarterList();

  // Geändert: Vergleich mit dem Stand beim Öffnen.
  const state = () => JSON.stringify([fTitle.value, fPeople.value, fStart.value, fEnd.value, [...transport].sort(),
    ...['#fMood', '#fKm', '#fFood', '#fQuarterCol', '#fQuarterList', '#fPriceOn'].map(id => dlg.querySelector(id).checked)]);   // seit 3.42.1 mit Preis (RLB-112)
  const initial = state();
  dlgDirty = () => state() !== initial;

  // x schließt; das Häkchen legt ein neues Reiselogbuch an bzw. übernimmt die Änderungen (Fenster ‚Reiselogbuch einstellen‘).
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok' || !validate()) return render();
    const target = trip || { id: uid(), days: {}, fazit: '', kosten: null, outputCounter: 0 };
    target.title = fTitle.value.trim();
    target.participants = dlg.querySelector('#fPeople').value.trim();
    target.start = fStart.value;
    target.end = fEnd.value;
    target.transport = TRANSPORT.map(x => x.id).filter(id => transport.has(id));
    target.quarterList = dlg.querySelector('#fQuarterList').checked;
    target.foodColumn = dlg.querySelector('#fFood').checked;
    target.moodColumn = dlg.querySelector('#fMood').checked;
    target.kmColumn = dlg.querySelector('#fKm').checked;
    target.priceOn = dlg.querySelector('#fPriceOn').checked;
    target.quarterColumn = fQuarterCol.checked;
    if (isNew) db.trips.push(target);
    save();
    if (isNew) return showTrip(target.id);
    render();
  };
}

// Einen Tag in 2 bis 6 Schritten erfassen (je nach sichtbaren Spalten); speichert automatisch alle 10 Sekunden.
function openDayDialog(trip, iso) {
  setOpener(`#app [data-day="${iso}"]`); // Zeile bzw. Kasten; auch beim Blättern zum nächsten Tag
  const days = tripDays(trip);
  const idx = days.indexOf(iso);
  const isFirst = idx <= 0;
  const original = trip.days[iso] ? { ...trip.days[iso] } : null;
  const stamps = syncStamps(trip);
  const e = original || {};
  const weather = new Set(graphemes(e.weather));
  const knownQuarters = [...new Set(days.map(d => quarterOf(trip, d).name).filter(Boolean))];
  const prev = isFirst ? { name: '', place: '' } : quarterOf(trip, days[idx - 1]);
  const same = Boolean(e.sameQuarter) && !isFirst;
  const c = cols(trip);
  let stepNo = 2;
  const nextNo = () => ++stepNo;

  openDialog(`
    <form method="dialog">
      ${dlgHead(isPhone() ? `${WEEKDAYS[parseISO(iso).getUTCDay()]}, ${fullDate(iso)}` : longDayLabel(iso), { right: `<span class="grp">
        <button type="button" data-nav="-1" ${isFirst ? 'disabled' : ''} aria-label="Vortag">${ic('chevron-left')}</button>
        <button type="button" data-nav="1" ${idx >= days.length - 1 ? 'disabled' : ''} aria-label="Folgetag">${ic('chevron-right')}</button></span>` })}
      <div class="dlg-body">
        <div class="step">
          <div class="step-head"><label><span class="step-num">1</span>Wetter</label></div>
          <div class="emoji-row strip">
            ${capHtml(WEATHER.map(w => `<button type="button" aria-pressed="${weather.has(w)}" data-w="${w}">${w}</button>`).join(''), 'wx')}
          </div>
        </div>
        <div class="step">
          <div class="step-head"><label for="fProgram"><span class="step-num">2</span>Verlauf</label></div>
          <textarea id="fProgram" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Wie ist der Tag verlaufen? Eine Zeile pro Punkt.">${esc(e.program || '')}</textarea>
          <div class="chips" id="suggest">
            ${PROGRAM_SUGGESTIONS.map((s, i) => `<button type="button" data-s="${i}">${esc(s.label)}</button>`).join('')}
          </div>
        </div>
        <div class="step" ${c.mood ? '' : 'hidden'}>
          <div class="step-head"><label for="fComment"><span class="step-num">${c.mood ? nextNo() : ''}</span>Wie war was?</label></div>
          <div class="emoji-row" id="moods"></div>
          <textarea id="fComment" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Smiley antippen, dann ein paar Worte dazu.">${esc(e.comment || '')}</textarea>
          <div class="hint">${MOOD_HINT}</div>
        </div>
        ${c.km ? `<div class="step">
          <div class="step-head"><label for="fKmDay"><span class="step-num">${nextNo()}</span>Gegangene Kilometer</label></div>
          <div class="zahl-einheit"><input type="text" id="fKmDay" class="zahl-schmal" style="--ziffern:3.5" inputmode="decimal" autocomplete="off" value="${e.km != null ? fmtKm(e.km) : ''}"><span>km</span></div>
        </div>` : ''}
        ${trip.foodColumn ? `<div class="step">
          <div class="step-head"><label for="fFoodText"><span class="step-num">${nextNo()}</span>Essen und Trinken</label><span class="head-checks"><label class="check chip head-check"><input type="checkbox" id="noLink"> keinen Google-Maps Link</label></span></div>
          <div class="emoji-row" id="foodMoods"></div>
          <textarea id="fFoodText" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Eine Zeile pro Lokal: Smileys, Name – Kommentar">${esc(e.food || '')}</textarea>
          <div class="hint">Format: ‚🕛😋 Hard Rock Café – Steak war super‘. Der Name wird zum Link in Google Maps (mit dem Ort des Quartiers). ‚keinen Google-Maps Link‘ gilt für die Zeile, in der du gerade schreibst (markiert mit ⊘).</div>
        </div>` : ''}
        <div class="step" ${c.quarter ? '' : 'hidden'}>
          <div class="step-head"><label for="fQuarter"><span class="step-num">${c.quarter ? nextNo() : ''}</span>Quartier</label><span class="head-checks">${isFirst ? '' : `<label class="check chip head-check"><input type="checkbox" id="fSame" ${same ? 'checked' : ''}> Quartier wie Vortag</label>`}<label class="check chip head-check"><input type="checkbox" id="fNoMap" ${e.noMap && !same ? 'checked' : ''}> keinen Google-Maps Link</label></span></div>
          <div class="qrow"><input type="text" id="fQuarter" autocapitalize="sentences" autocorrect="on" spellcheck="true" list="quarterList" placeholder="z. B. Oaks Townsville Hotel">
          <datalist id="quarterList">${knownQuarters.map(q => `<option value="${esc(q)}">`).join('')}</datalist>
          <input type="text" id="fPlace" aria-label="Ort für Google Maps" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Ort für Google Maps, z. B. Cairns, Australien"></div>
          <div class="hint" id="qHint"></div>
          <div class="kosten qprice" id="qPrice"><label for="fPrice">Preis</label><input type="text" id="fPrice" inputmode="decimal" placeholder="0,00" autocomplete="off"><span>€</span></div>
        </div>
        ${micHint()}
      </div>
    </form>`, true);

  const fProgram = dlg.querySelector('#fProgram');
  const fComment = dlg.querySelector('#fComment');
  const fQuarter = dlg.querySelector('#fQuarter');
  const fPlace = dlg.querySelector('#fPlace');
  const fSame = dlg.querySelector('#fSame');
  const qHint = dlg.querySelector('#qHint');
  const savedInfo = dlg.querySelector('#dlgSub');
  let own = { name: same ? '' : (e.quarter || ''), place: same ? '' : (e.place || ''), price: same ? null : (e.price ?? null) };
  const fPrice = dlg.querySelector('#fPrice');
  const fKmDay = dlg.querySelector('#fKmDay');
  const fFood = dlg.querySelector('#fFoodText');
  let lastComment = e.comment || '';
  let lastFood = e.food || '';
  let lastSnapshot = JSON.stringify(original);

  // Schritt 1: Wetter
  dlg.querySelectorAll('#wx button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? weather.add(b.dataset.w) : weather.delete(b.dataset.w);
  });

  // Schritt 2: Vorschläge als neue Zeile einfügen
  dlg.querySelectorAll('#suggest button').forEach(b => b.onclick = () => {
    const sg = PROGRAM_SUGGESTIONS[b.dataset.s];
    if (sg.top) return insertLineTop(fProgram);
    insertAtCursor(fProgram, sg.text, true);
    capNext(fProgram); // nach ‚Weiterfahrt nach …‘ beginnt der Ort groß
  });

  // Schritt 3: Smiley-Schnellauswahl
  mountMoodRow(dlg.querySelector('#moods'), fComment, () => { lastComment = fComment.value.trim(); });
  if (fFood) mountMoodRow(dlg.querySelector('#foodMoods'), fFood, () => { lastFood = fFood.value.trim(); }, 'food');
  if (fFood) {
    const noLink = dlg.querySelector('#noLink');
    const syncNoLink = () => {
      const v = fFood.value;
      const pos = fFood.selectionStart ?? v.length;
      noLink.checked = v.slice(v.lastIndexOf('\n', pos - 1) + 1).startsWith(NO_LINK);
    };
    ['keyup', 'click', 'input', 'focus', 'select'].forEach(ev => fFood.addEventListener(ev, syncNoLink));
    noLink.onchange = () => { toggleNoLink(fFood); syncNoLink(); };
    syncNoLink();
  }

  // Gegangene Kilometer (seit 3.41.0, RLB-110, AppDesign APD-93; seit 3.42.0, RLB-111, mit einer Nachkommastelle): höchstens zwei Ziffern,
  // Komma (Punkt wird Komma) und eine Stelle danach; beim Verlassen ‚6‘ → ‚6,0‘
  if (fKmDay) {
    fKmDay.oninput = () => { const m = fKmDay.value.replace(/\./g, ',').match(/^0*(\d{0,2})(,\d?)?/), v = m ? m[1] + (m[1] ? m[2] || '' : '') : ''; if (v !== fKmDay.value) fKmDay.value = v; };
    fKmDay.addEventListener('blur', () => { const n = Number(fKmDay.value.replace(',', '.')); fKmDay.value = n > 0 ? fmtKm(n) : ''; });
  }

  // Schritt Quartier – seit 3.41.0 (RLB-109) mit Preis des Aufenthalts unter ‚Ort‘, nicht bei ‚Quartier wie Vortag‘
  const fNoMap = dlg.querySelector('#fNoMap');
  bindMoney(fPrice, () => own.price, v => { own.price = v; });
  let ownNoMap = fNoMap.checked;
  const updateQuarter = () => {
    const useSame = Boolean(fSame?.checked);
    fQuarter.disabled = fPlace.disabled = fNoMap.disabled = useSame;
    const q = useSame ? prev : { ...own, noMap: ownNoMap };
    fQuarter.value = q.name;
    fPlace.value = q.place;
    dlg.querySelector('#qPrice').hidden = useSame || !trip.priceOn;   // seit 3.42.0 (RLB-111): nur auf Wunsch
    if (document.activeElement !== fPrice) { fPrice.value = useSame || own.price == null ? '' : money(own.price); fitMoney(fPrice); }
    fNoMap.checked = Boolean(q.noMap);
    if (useSame && !prev.name) qHint.textContent = 'Am Vortag ist noch kein Quartier eingetragen.';
    else qHint.innerHTML = q.name && !q.noMap ? `<a href="${mapsUrl(q)}" target="_blank" rel="noopener" style="text-decoration:none">📍 In Google Maps prüfen</a>` : '';
  };
  fNoMap.onchange = () => { ownNoMap = fNoMap.checked; updateQuarter(); };
  fQuarter.oninput = () => { own.name = fQuarter.value; updateQuarter(); };
  fPlace.oninput = () => { own.place = fPlace.value; updateQuarter(); };
  if (fSame) fSame.onchange = updateQuarter;
  updateQuarter();


  const collect = () => {
    const useSame = Boolean(fSame?.checked);
    const next = {
      weather: WEATHER.filter(w => weather.has(w)).join(''),
      program: fProgram.value.trim(),
      comment: fComment.value.trim(),
      sameQuarter: useSame,
      quarter: useSame ? '' : own.name.trim(),
      place: useSame ? '' : own.place.trim(),
      noMap: useSame ? false : ownNoMap,
      // Bei ausgeblendeter Essen-Spalte bleiben vorhandene Einträge erhalten.
      food: fFood ? fFood.value.trim() : (e.food || ''),
    };
    // seit 3.41.0: Preis und Kilometer nur, wenn eingetragen (sonst bleibt ein alter Tag unverändert); bei ausgeblendeter Spalte bleiben sie
    const price = useSame ? null : c.quarter ? own.price : (e.price ?? null);
    const km = fKmDay ? (Math.round(Number(fKmDay.value.replace(',', '.')) * 10) / 10 || null) : (e.km ?? null);
    if (price != null) next.price = price;
    if (km != null) next.km = km;
    return (next.weather || next.program || next.comment || next.sameQuarter || next.quarter || next.place || next.food || next.price != null || next.km) ? next : null;
  };

  const persist = () => {
    const next = collect();
    const snapshot = JSON.stringify(next);
    if (snapshot === lastSnapshot) return;
    countMoods(lastComment, next?.comment || '');
    lastComment = next?.comment || '';
    countMoods(lastFood, next?.food || '', 'food');
    lastFood = next?.food || '';
    if (next) trip.days[iso] = next; else delete trip.days[iso];
    if (save()) {
      lastSnapshot = snapshot;
      savedInfo.textContent = `Automatisch gespeichert um ${nowStamp().time}`;
    }
  };

  const restore = () => {
    countMoods(lastComment, original?.comment || '');
    countMoods(lastFood, original?.food || '', 'food');
    if (original) trip.days[iso] = original; else delete trip.days[iso];
    restoreStamps(trip, stamps);
  };

  autosaveTimer = setInterval(persist, AUTOSAVE_MS);
  const initialDay = JSON.stringify(collect());
  dlgDirty = () => JSON.stringify(collect()) !== initialDay;

  dlg.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    persist();
    render();
    openDayDialog(trip, days[idx + Number(b.dataset.nav)]);
  });
  dlg.onclose = () => {
    clearInterval(autosaveTimer);
    if (dlg.returnValue === 'ok') persist(); else restore();
    render();
  };
}

  const ta = dlg.querySelector('#fFazit');

  mountMoodRow(dlg.querySelector('#moods'), ta, () => { lastSaved = ta.value.trim(); });

  };
}

// "Reiselogbuch <Titel> JJJJ.MM.TT-JJJJ.MM.TT V001", nie zwei Leerzeichen hintereinander.
function outputName(trip, version) {
  const title = trip.title.replace(/[\\/:*?"<>|]/g, '-');
  const range = `${trip.start.replace(/-/g, '.')}-${trip.end.replace(/-/g, '.')}`;
  return `Reiselogbuch ${title} ${range} V${pad(version, 3)}`.replace(/\s+/g, ' ').trim();
}

// Alle Regeln gelten nur innerhalb von .rt, damit sie beim Drucken nicht in die App durchschlagen.
// Schrift und Tabellen aus der Mustertabelle der Ausgabe in AppDesign (outputCss, R-6.2); hier nur, was dazukommt.
const OUTPUT_CSS = outputCss('.rt') + `
  body { font: 11pt/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #000; background: #fff; margin: 24px; }
  .rt .ln { display: flex; gap: .35em; }
  .rt .ln + .ln { margin-top: 2px; }
  .rt .ln .m { flex: none; }
  .rt .ln .t { min-width: 0; overflow-wrap: anywhere; }
  .rt .stats td { border: none; padding: 1px 16px 1px 0; }
  .rt .avg { display: inline-flex; flex-wrap: wrap; } .rt .avg > span { white-space: nowrap; }
  .rt a { color: #1a5fb4; }
  .rt a.m { text-decoration: none; }
  .rt p { white-space: pre-line; }
  @media print { body { margin: 0; } }
`;

// Zelle der Statistik (App und Ausgabe): Wert und Ø als zwei Teile, die je in einer Zeile bleiben; passen beide nicht in die Zeile, steht
// der Ø linksbündig unter dem Wert (seit 3.42.1, RLB-112 – ein Trennpunkt im Text bricht in Safari nach geschützten Leerzeichen nicht um)
function statHtml(v) {
  const m = v.match(/^(.*?\u00a0{5})(\(Ø.*)$/);
  return m ? `<span class="avg"><span>${esc(m[1])}</span><span>${esc(m[2])}</span></span>` : esc(v);
}

function tripStats(trip) {
  const days = tripDays(trip);
  const rec = days.filter(d => isRecorded(trip, d));
  const quarters = new Set(rec.map(d => quarterOf(trip, d).name).filter(Boolean));
  // Varianten mit/ohne Emoji-Darstellungszeichen (z. B. ☹️ und ☹) zählen gemeinsam.
  const count = (list) => {
    const c = new Map();
    list.forEach(x => {
      const key = x.replace(/\uFE0F/g, '');
      const hit = c.get(key) || { shown: x, n: 0 };
      if (x.includes('\uFE0F')) hit.shown = x;
      hit.n++;
      c.set(key, hit);
    });
    return [...c.values()].sort((a, b) => b.n - a.n).map(h => [h.shown, h.n]);
  };
  const weather = count(rec.flatMap(d => graphemes(rawEntry(trip, d).weather)));
  const c = cols(trip);
  const moods = count([...(c.mood ? rec.map(d => rawEntry(trip, d).comment) : []), trip.fazit].flatMap(emojisIn));
  const fmt = list => list.map(([e, n]) => `${n}×${e}`).join(' · ') || '–';
  // seit 3.41.0 (RLB-110): Summe und Ø der gegangenen Kilometer (nur Tage mit Kilometern); seit 3.42.0 (RLB-111) mit einer Nachkommastelle,
  // Ø in Klammern hinter dem Wert: 5 geschützte Leerzeichen davor, seit 3.42.1 (RLB-112) 1 nach ‚Ø‘; passt es nicht, bricht die Zeile vor der
  // Klammer um, der Ø steht dann linksbündig unter dem Wert (statHtml)
  const kms = c.km ? days.map(d => rawEntry(trip, d).km).filter(Boolean) : [];
  const kmSum = kms.reduce((a, x) => a + x, 0);
  // seit 3.41.0 (RLB-109): Quartierkosten und Ø je Nacht – nur Aufenthalte mit Preis; seit 3.42.0 (RLB-111) nur mit ‚Preis der Quartiere
  // erfassen‘, Ø in Klammern wie bei den Kilometern
  const stays = c.quarter ? quarterStays(trip) : [], priced = trip.priceOn ? stays.filter(st => st.price != null) : [];
  const cost = priced.reduce((a, st) => a + st.price, 0), costNights = priced.reduce((a, st) => a + st.nights, 0);
  const avg = (v, d, unit) => `${v}\u00a0${unit}${'\u00a0'.repeat(5)}(Ø\u00a0${d}\u00a0${unit})`;
  return [
    ['Reisetage', `${days.length}, davon erfasst ${rec.length}`],
    ...(kms.length ? [['Gegangene Kilometer', avg(fmtKm(kmSum), fmtKm(kmSum / kms.length), 'km')]] : []),
    ...(c.quarter ? [['Quartiere', String(quarters.size)], ['Nächte', String(stays.reduce((n, st) => n + st.nights, 0))]] : []),
    ...(priced.length ? [['Quartierkosten', avg(money(cost), money(cost / costNights), '€')]] : []),
    ['Wetter', fmt(weather)],
    ['Smileys', fmt(moods)],
  ];
}

// Aufeinanderfolgende Nächte im selben Quartier werden zu einem Aufenthalt zusammengefasst. Preis (seit 3.41.0, RLB-109): Summe der
// Preise der Tage, an denen das Quartier eingetragen ist (meist nur der erste Tag); ohne Preis null.
function quarterStays(trip) {
  const stays = [];
  for (const d of tripDays(trip)) {
    const q = quarterOf(trip, d);
    if (!q.name) continue;
    const last = stays[stays.length - 1];
    if (last && last.q.name === q.name && last.lastNight === addDays(d, -1)) {
      last.lastNight = d;
      last.nights++;
      if (!last.srcs.has(q.src)) { last.srcs.add(q.src); if (q.price != null) last.price = (last.price ?? 0) + q.price; }
    } else {
      stays.push({ q, firstNight: d, lastNight: d, nights: 1, srcs: new Set([q.src]), price: q.price });
    }
  }
  return stays;
}

// Inhalt der Ausgabe: nur erfasste Tage, ohne Wetter-Platzhalter.
function outputBody(trip, version, stamp) {
  const c = cols(trip);
  const rows = tripDays(trip).filter(iso => isRecorded(trip, iso)).map(iso => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    return `<tr>
      <td class="nw">${dayLabel(iso)}${e.weather ? `<br>${esc(e.weather)}` : ''}</td>
      <td>${linesHtml(programItems(e.program))}</td>
      ${c.mood ? `<td>${linesHtml(commentItems(e.comment))}</td>` : ''}
      ${c.km ? `<td class="num">${e.km != null ? fmtKm(e.km) : ''}</td>` : ''}
      ${c.food ? `<td>${foodHtml(foodItems(e.food, q.place))}</td>` : ''}
      ${c.quarter ? `<td>${withPrice(trip, iso, q, quarterHtml(q))}</td>` : ''}
    </tr>`;
  }).join('');
  const transport = transportText(trip);
  const stays = trip.quarterList && c.quarter ? quarterStays(trip) : [];
  return `<div class="rt">
    <h1>Reiselogbuch – ${esc(trip.title)}</h1>
    <table class="meta">
      <tr><td><b>Reiseteilnehmer:</b></td><td>${esc(trip.participants)}</td></tr>
      <tr><td><b>Reisezeitraum:</b></td><td>${fullDate(trip.start)} - ${fullDate(trip.end)}</td></tr>
      ${transport ? `<tr><td><b>Reisemittel:</b></td><td>${transportHtml(trip)}</td></tr>` : ''}
    </table>
    <table class="grid">
      ${outCols(trip)}
      <thead><tr>${headCells(trip)}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${colCount(trip)}">Noch keine Tage erfasst.</td></tr>`}</tbody>
    </table>
    <h2>Fazit</h2>
    <div>${linesHtml(commentItems(trip.fazit))}</div>
    <h2>Gesamtausgaben</h2>
    <p>${formatEuro(trip.kosten)}</p>
    ${stays.length ? `
      <h2>Quartierliste</h2>
      <table class="grid fit">
        <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th>${trip.priceOn ? '<th class="num">Preis</th>' : ''}</tr></thead>
        <tbody>${stays.map(s => `<tr>
          <td>${quarterHtml(s.q)}</td>
          <td class="nw">${shortDate(s.firstNight)} - ${fullDate(addDays(s.lastNight, 1))}</td>
          <td class="num">${s.nights}</td>
          ${trip.priceOn ? `<td class="num">${s.price == null ? '' : formatEuro(s.price)}</td>` : ''}
        </tr>`).join('')}</tbody>
      </table>` : ''}
    <h2>Statistik</h2>
    <table class="stats">
      ${tripStats(trip).map(([k, v]) => `<tr><td><b>${k}:</b></td><td>${statHtml(v)}</td></tr>`).join('')}
    </table>
    <p class="created">Ausgabe V${pad(version, 3)} erstellt am ${stamp.date} um ${stamp.time}</p>
  </div>`;
}

/* ---------- Speichern über das Teilen-Menü ---------- */


function outputDocument(trip, version, stamp) {
  return `<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(outputName(trip, version))}</title>
<style>${OUTPUT_CSS}</style></head>
<body>${outputBody(trip, version, stamp)}</body></html>`;
}

function backupFile() { return backupFileOf('Reiselogbuch', db); }

// Vorschau der Ausgabe in der App, immer hell; zeigt die Nummer der nächsten Datei, ohne den Zähler zu erhöhen.
function openPreview(trip) {
  const version = (trip.outputCounter || 0) + 1;
  openDialog(`
    <form method="dialog">
      ${dlgHead('Vorschau', { sub: esc(outputName(trip, version)), check: false,
        right: `<span class="grp"><button type="button" class="txt" id="prvPdf">${ic('file-text')}PDF</button><button type="button" class="fill" id="prvShare" aria-label="Teilen">${ic('share')}</button></span>` })}
      <div class="dlg-body preview">
        <style>${OUTPUT_CSS.replace(/\bbody\b/g, '.dlg-body.preview')}.dlg-body.preview { margin: 0; padding: 24px; }</style>
        ${outputBody(trip, version, nowStamp())}
      </div>
    </form>`, true);
  dlg.querySelectorAll('.preview a[href]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  dlg.querySelector('#prvShare').onclick = () => exportHtml(trip);
  dlg.querySelector('#prvPdf').onclick = () => exportPdf(trip);
}

function nextOutput(trip) {
  trip.outputCounter = (trip.outputCounter || 0) + 1;
  save();
  return { version: trip.outputCounter, stamp: nowStamp() };
}

// Muss direkt aus dem Antippen heraus aufgerufen werden, sonst blockiert Safari das Teilen-Menü.
async function exportHtml(trip) {
  const { version, stamp } = nextOutput(trip);
  const file = { name: `${outputName(trip, version)}.html`, type: 'html', content: outputDocument(trip, version, stamp) };
  if (dlg.open) dlg.close();
  const result = await shareFiles([file]);
  dlgOpener = '#shareBtn';
  showOutputResult(`Ausgabe V${pad(version, 3)}`, file.name, result);
}

// PDF über das Drucken-Menü; der Seitentitel wird als Dateiname vorgeschlagen.
function exportPdf(trip) {
  const { version, stamp } = nextOutput(trip);
  const name = outputName(trip, version);
  dlgOpener = '#shareBtn';
  showOutputResult(`Ausgabe V${pad(version, 3)}`, name + '.pdf', 'print');
  const oldTitle = document.title;
  printout.innerHTML = `<style>${OUTPUT_CSS.replace(/\bbody\b/g, '#printout')}</style>${outputBody(trip, version, stamp)}`;
  document.title = name;
  const restore = () => { document.title = oldTitle; window.removeEventListener('afterprint', restore); };
  dlg.addEventListener('close', () => { printout.innerHTML = ''; }, { once: true });
  window.addEventListener('afterprint', restore);
  dlg.addEventListener('close', restore, { once: true });
  setTimeout(() => window.print(), 50);
}

function showOutputResult(title, name, result) {
  const remind = !backedUpToday() && result !== 'aborted' && result !== 'error';
  openDialog(`
    <form method="dialog">
      ${dlgHead(esc(title), { check: false })}
      <div class="dlg-body">
        <div class="step">${shareResultText(result, name)}</div>
        ${remind ? backupReminderHtml() : ''}
      </div>
    </form>`);
  bindBackupReminder();
}

function backupReminderHtml() {
  return `<div class="step" id="reminder">
      <strong>💾 Denk daran, auch ein Backup zu erstellen.</strong>
      <div class="hint">${lastBackupText()}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="primary" id="backupNow">${ic('save')}Backup erstellen</button>
      </div>
    </div>`;
}

function bindBackupReminder() {
  const btn = dlg.querySelector('#backupNow');
  if (!btn) return;
  btn.onclick = async () => {
    const name = await saveBackup();
    const box = dlg.querySelector('#reminder');
    if (box && name) box.innerHTML = name;
  };
}

// Erstellt das Backup über das Teilen-Menü; der Zeitpunkt zählt nur, wenn das Menü abgeschlossen wurde.
// anchor: Schaltfläche, von der es kommt – sie bleibt bis zum Schließen der Meldung blau.
async function saveBackup(anchor) {
  hold(anchor);
  const file = backupFile();
  const result = await shareFiles([file]);
  if (result === 'shared' || result === 'downloaded') {
    db.settings.lastBackup = Date.now();
    save();
    if (isPhone()) render(); else renderSide();
  }
  const text = shareResultText(result, file.name);
  if (!dlg.querySelector('#reminder')) await inform('Backup', text);
  release(anchor);
  // RLB-105: nach dem Backup ist die Kachel weg – der Fokus geht auf ‚Mehr‘ statt ins Leere
  if (anchor && !document.querySelector(anchor)) side.querySelector('#sideMore')?.focus({ preventScroll: true });
  return text;
}



/* ---------- Backup ---------- */


importFile.addEventListener('cancel', () => release(importAnchor));
importFile.onchange = async () => {
  const file = importFile.files[0];
  importFile.value = '';
  if (!file) return release(importAnchor);
  try {
    const { data, savedAt, savedOn } = await readBackup(file, 'trips');
    normalize(data);
    // Abfrage (R-9.2): Zeitpunkt und Gerät des Backups, neuer oder älter – Abgleichen · Ersetzen · Abbrechen.
    const choice = await sync.ask(document.querySelector(importAnchor), db, data, savedAt, savedOn);
    if (!choice) return release(importAnchor);
    // Das letzte Backup und das zuletzt verwendete Reiselogbuch gelten je Gerät: die Werte aus der Datei werden nicht übernommen.
    // Glas (seit 3.52.0, AppDesign APD-120): gilt je Gerät – der Wert aus der Datei nur, wenn hier noch nicht gewählt (Neuinstallation)
    const { lastBackup, lastTrip, glas } = db.settings;
    let stats = null;
    if (choice === 'merge') ({ data: db, stats } = mergeData(db, data));
    else db = data;
    db = normalize(db);
    db.settings.lastBackup = lastBackup;
    if (lastTrip) db.settings.lastTrip = lastTrip; else delete db.settings.lastTrip;
    glasAusBackup(glas);
    lastSnap = snapshot(db);   // übernommene Änderungen behalten Zeitpunkt und Gerät von drüben
    save();
    applyTheme();
    if (dlg.open) dlg.close();
    // Abgleichen bleibt in der aktuellen Ansicht; Ersetzen beginnt wie beim Start.
    if (choice === 'merge' && getTrip(currentTripId)) render(); else showTrip(pickStartTrip()?.id);
    // R-9.4: Ergebnis mit Tabelle der Änderungen auf diesem Gerät (breites Fenster).
    if (stats) await sync.showResult(stats, savedAt, savedOn);
    release(importAnchor);
  } catch (e) {
    await inform('Backup laden', '⚠️ Die Datei konnte nicht gelesen werden. ' + esc(e.message));
    release(importAnchor);
  }
};

/* ---------- Start ---------- */

applyTheme();
// Beim Start immer am Anfang beginnen (der Sprung zum ersten offenen Tag kommt von der App, nicht von Safari).
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
// Dauerhaften Speicher anfordern (einmalig, ohne Rückfrage); das Ergebnis steht im Menü der Seitenleiste.
if (navigator.storage?.persist) {
  navigator.storage.persisted()
    .then(p => p || navigator.storage.persist())
    .then(p => { storagePersistent = Boolean(p); })
    .catch(() => {});
}
// Beim Start ist die Seitenleiste immer eingeblendet (im Hochformat über den Inhalt gelegt).
sideOpen = true;
// R-7.2 (seit 3.15.0, RLB-84): Im iPhone-Aufbau (auch iPad im schmalen Fenster) beginnt jedes Neuladen in der Startliste,
// ohne blauen Eintrag; der iPad-Aufbau öffnet wie bisher die laufende (sonst zuletzt beendete, sonst nächste) Reise.
// Die Startreise bleibt gewählt, damit ein breiteres Fenster sie mit der Seitenleiste zeigt.
showTrip(pickStartTrip()?.id);
if (isPhone()) { phoneList = true; startList = true; rolle.to(0); render(); }
// Wechsel quer/hoch: Seitenleiste fest oder darübergelegt; sonst nur Höhen und Breiten nachführen.
let wasWide = isWide();
let wasPhone = isPhone(), wasAx = isAx();
window.addEventListener('resize', () => {
  placeDialogs();
  // R-8.1: Ist ein Menü oder eine Abfrage aus der Seitenleiste offen, bleibt sie in jedem Fall sichtbar.
  if (document.querySelector('#side .on') && document.querySelector('.menu, .pop')) sideOpen = true;
  // Wechsel fest ↔ darübergelegt bzw. iPad- ↔ iPhone-Aufbau: neu aufbauen; der Zustand sideOpen bleibt (R-8.1).
  // seit 3.35.0 (RLB-101, AppDesign APD-43 W1): ebenso beim Wechsel der Textgröße über AX1 (Tabelle ↔ Kästen, oberster Tag bleibt – ui.js)
  // seit 3.43.0 (AppDesign APD-97, R-6.6): ebenso, wenn der Inhalt die Grenze 700 px überschreitet (Tabelle ↔ Kästen)
  if (isPhone() !== wasPhone || isWide() !== wasWide || isAx() !== wasAx || (!isPhone() && inhaltSchmal(app) !== wasSchmal)) {
    wasPhone = isPhone(); wasWide = isWide(); wasAx = isAx(); render(); return;
  }
  const bar = document.getElementById('bar');
  if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  if (!side.hidden) document.documentElement.style.setProperty('--side-w', side.offsetWidth + 'px');
});
// Beim Scrollen bekommt die Kopfzeile eine Haarlinie, auf dem iPhone wandert der große Titel in die Leiste (ui.js, updateBar).

if (false) {   // APD-127 Muster: kein Service Worker
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
