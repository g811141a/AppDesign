<!doctype html>
<html lang="de">
<head>

<title>APD-127 Muster</title>
<link rel="stylesheet" href="../../../fassung/4.56.0/design.css">
<style>/* APD-127 R-1.12 (0101): iPad-Fenster mit der Tastatur – hoch Feder aus Notizen (0,5 s), runter ease-in-out 0,25 s */
.muster-a dialog.gleitet { transition: top .5s linear(0.0000, 0.0368, 0.1215, 0.2269, 0.3366, 0.4414, 0.5364, 0.6197, 0.6910, 0.7510, 0.8007, 0.8414, 0.8745, 0.9011, 0.9225, 0.9395, 0.9530, 0.9636, 0.9720, 0.9785, 0.9836, 0.9876, 0.9908, 0.9932, 0.9950, 0.9965, 0.9976, 0.9984, 0.9991, 0.9996, 1.0000); }
.muster-a dialog.gleitet.runter { transition: top .25s cubic-bezier(.42,0,.58,1); }
@media (prefers-reduced-motion: reduce) { .muster-a dialog.gleitet { transition: none; } }</style>
<style>
  /* Reiselogbuch: nur, was zur App gehört – die gemeinsamen Bausteine kommen aus AppDesign (design.css) */
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 4px 0 6px; }
  .meta dt { font-weight: 600; }
  .meta dd { margin: 0; }
  .avg { display: inline-flex; flex-wrap: wrap; } .avg > span { white-space: nowrap; }   /* RLB-112: Ø unter dem Wert, statHtml */
  .progress { font-size: calc(14px * var(--f-subhead)); color: var(--muted); margin: 0 0 12px; }

  /* Tabelle */
  .table-wrap { background: var(--card); border-radius: 12px; overflow: clip; box-shadow: var(--table-shadow); }
  table.days { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.days th, table.days td { border-bottom: 1px solid var(--line); padding: 10px 12px; vertical-align: top; text-align: left; }
  table.days td + td { border-left: 1px solid var(--line); }
  table.days th { position: sticky; top: 0; background: var(--th-bg); border-bottom-color: var(--th-line); font-size: var(--t-headline); font-weight: 600; z-index: 2; }
  table.days th + th { border-left: 1px solid var(--th-line); }
  table.days tbody tr:last-child td { border-bottom: none; }
  table.days tbody tr { cursor: pointer; }
  table.days tbody tr.alt { background: var(--zebra); }
  @media (hover: hover) { table.days tbody tr:hover { background: var(--row-hover); } }
  table.days tbody tr.gap { background: var(--focus); }
  table.days tbody tr.on { background: var(--sel-bg); }
  td.day { white-space: nowrap; width: 1%; }
  td.day .wx { display: block; font-size: calc(18px * var(--f-body)); }
  td.day .wx.empty { opacity: .25; }
  .tag { display: inline-block; font-size: var(--t-caption1); border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
  .tag.today { background: var(--accent-fill); color: var(--accent-ink); }
  .tag.miss { color: var(--warn); border: 1px solid var(--warn); }
  td.quarter a { text-decoration: none; }

  /* Hängender Einzug: Folgezeilen beginnen unter dem Text, nicht unter dem Zeichen */
  .ln { display: flex; gap: .35em; }
  .ln + .ln { margin-top: 2px; }
  .ln .m { flex: none; }
  .ln .t { min-width: 0; overflow-wrap: anywhere; }
  /* In der Tagestabelle zwischen ganzen Wörtern umbrechen (die Spalte wird so breit wie das längste Wort);
     ein zu langes Wort, das nicht in die Spalte passt, bricht im Wort um (R-6.3). */
  table.days .ln .t { overflow-wrap: break-word; }
  /* Spaltenköpfe (Smileys) bleiben in einer Zeile – die Spalte wird mindestens so breit. */
  table.days th { white-space: nowrap; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.cur { background: var(--mark-cur); color: var(--mark-cur-ink); }

  .fazit-box { display: inline-block; width: auto; max-width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; border-radius: 14px; background: var(--card); }
  .kosten { display: flex; align-items: center; gap: 10px; }
  /* seit 3.42.0 (AppDesign APD-95, R-5.8): ‚€‘ normal und in Textgröße wie das Feld */
  /* RLB-101 (AppDesign APD-43 B5): Betragsfeld in Zeichenbreite (‚4.850,00 €‘ plus Luft) statt fest 130 px – wächst mit der Textgröße */
  #kosten, #fPrice { text-align: right; width: calc(11.5ch + 24px); flex: none; }
  /* seit 3.41.0 (RLB-109): Preis des Quartiers unter ‚Ort‘ – Bezeichnung, Betragsfeld, € (R-5.1) */
  .qprice { margin-top: 12px; }
  .qprice[hidden] { display: none; }
  .qprice label { margin: 0; }
  .table-wrap.fit { display: inline-block; max-width: 100%; }
  .table-wrap.fit table { width: auto; }
  table.days.static tbody tr { cursor: default; }
  table.days td.num, table.days th.num { text-align: right; }
  table.days td.nw { white-space: nowrap; }
  table.days.static td.quarter a, table.days.static a { text-decoration: none; }
  td a { text-decoration: none; }
  /* Maps-Links: Antippfläche unsichtbar auf 44 px Höhe vergrößert (Innenabstand eines Inline-Links ändert das Layout nicht) */
  .ln.q a, #qHint a { padding: 12px 0; position: relative; }
  /* R-3.1 (seit 3.12.0, Fund APD-5): kurze Quartiernamen (‚Hotel‘) gaben eine Antippfläche unter 44 px. Wie iOS wird die Fläche
     unsichtbar auf mindestens 44 px verbreitert – Schrift und Abstände bleiben gleich. */
  .ln.q a::after, #qHint a::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: max(100%, 44px); transform: translateX(-50%); }

  /* iPhone: Tage als Kästen (AppDesign .box) – Kopf mit Datum, Hinweisen und Wetter */
  .box.day { cursor: pointer; }
  .box.day .h { display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .box.day .h .wx { margin-left: auto; font-size: calc(18px * var(--f-body)); font-weight: 400; }
  .box.day .wx.empty { opacity: .25; }
  .box.day.gap { background: var(--focus); }
  .box.day.on { background: var(--sel-bg); }
  .box.day a { text-decoration: none; }
  /* iPhone: Bezeichnung mit Doppelpunkt, darunter der Wert; Reisemittel in einer Zeile, seitlich wischen – seit 3.38.0 (AppDesign APD-86)
     als Wischzeile mit Verlauf und Pfeilen am Rand (R-5.4); am iPad umbrochen wie bisher */
  html.phone .meta.trip { display: block; margin-top: 8px; }
  html.phone .meta.trip dd { margin: 0 0 6px; }
  html:not(.phone) .meta.trip #reisemittel { white-space: normal; }
  html.phone .fazit-box { width: 100%; }
  /* Wetter auf dem iPhone 40 px breit, damit alle sieben ohne Wischen nebeneinander passen (bewusste Abweichung) – seit 3.35.0
     (RLB-101, AppDesign APD-43 B6) nur bei Standard; bei größerer Schrift wachsen die Knöpfe, passt es nicht, wischt die Kapsel seitlich */
  html.phone #wx button { width: max(40px, calc(48px * var(--f-body) - 8px)); min-width: max(40px, calc(48px * var(--f-body) - 8px)); }
  /* RLB-101 (AppDesign APD-43 U1): bei großer Schrift (html.ts-um) Reisedaten und Statistik untereinander, Wetter unter dem Datum */
  html.ts-um .meta { display: block; }
  html.ts-um .meta dd { margin: 0 0 6px; }
  html.ts-um .box.day .h { flex-wrap: wrap; }
  html.ts-um .box.day .h .wx { flex: 1 0 100%; margin-left: 0; overflow-wrap: anywhere; }
  html.ts-um .meta.trip #reisemittel { white-space: normal; }
  /* Zeichen vor der Zeile (🕛☕📍 …) dürfen bei großer Schrift umbrechen, statt hinauszuragen (R-6.3) */
  html.ts-um .ln .m { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }

  .qrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .dlg-body.preview { margin: 0; padding: 24px; background: #fff; color: #000; color-scheme: light; }
  /* Vorschau in voller Seitenbreite (wie die Ausgabe) – ist das Fenster schmaler (iPad hoch, iPhone),
     wischt man seitlich, statt dass Wörter zerreißen oder Inhalte über die Tabelle hinausragen */
  .dlg-body.preview { overflow: auto; }
  .dlg-body.preview .rt { min-width: 960px; }
  html.phone .dlg-body.preview { padding: 16px; }

  #printout { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    html, body, body.docked { background: #fff !important; color: #000; padding: 0 !important; margin: 0; }
    #app, #side, .side-shade, dialog, .fab { display: none !important; }
    #printout { display: block; }
  }
/* seit 3.54.0 (AppDesign APD-115/E-6, Variante A): ‚Verlauf‘ direkt über dem Feld, die Vorschläge darunter */
#suggest { margin: 10px 0 0; }
</style>
</head>

<script>
// APD-127 Muster: Variante aus der Adresse (?v=a bzw. ohne Angabe neu nach R-1.12, ?v=b heute)
const MUSTER_V = /[?&]v=b/.test(location.search) ? 'b' : 'a';
document.documentElement.classList.add('muster-' + MUSTER_V);
</script>
<script src="ui.js"></script>
<script>
'use strict';


// Version und Erstellungszeitpunkt, werden bei jeder neuen Version angepasst.
// Versionsnummer Hauptversion.Nebenversion.Korrektur (siehe CHANGELOG.md).
const APP_VERSION = '3.54.0';
const APP_BUILT = '08.11.2026 um 01:52';
// R-10.3: benötigte AppDesign-Fassung (seit 3.13.0 feste Fassung: Pfad ../AppDesign/fassung/<AD_NEEDED>/ oben und in sw.js). Ist eine andere geladen
// (z. B. GitHub Pages noch nicht fertig oder alter Zwischenspeicher), erscheint gleich beim Start ein Hinweis.
const AD_NEEDED = '4.56.0';
const adLoaded = () => ({ js: typeof AD_VERSION === 'string' ? AD_VERSION : 'älter',
  css: getComputedStyle(document.documentElement).getPropertyValue('--ad-version').trim().replace(/"/g, '') || 'älter' });
setTimeout(() => {
  const { js, css } = adLoaded();
  if (js !== AD_NEEDED || css !== AD_NEEDED) inform('Neue Version wird geladen',
    `⚠️ Reiselogbuch ${APP_VERSION} braucht AppDesign ${AD_NEEDED}, geladen ist ${js === css ? js : `${js} / ${css}`}.<br><br>` +
    'Bitte die App ganz schließen (vom unteren Rand nach oben wischen und wegschieben) und nach ein paar Minuten neu öffnen.');
});

const app = document.getElementById('app');
const side = document.getElementById('side');
const fab = document.getElementById('fab');
const printout = document.getElementById('printout');
const importFile = document.getElementById('importFile');

const STORAGE_KEY = 'reiselogbuch.muster-apd127';   // APD-127 Muster: eigener Speicher
const OLD_STORAGE_KEY = 'reiselogbuch.muster-apd127'; // Name vor der Umbenennung, wird beim ersten Start übernommen
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WEEKDAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const WEATHER = ['☀️', '🌤', '🌦', '🌧', '☁️', '⛈', '❄️'];
const TRANSPORT = [
  { id: 'pkw', icon: '🚗', name: 'PKW' },
  { id: 'zug', icon: '🚆', name: 'Zug' },
  { id: 'rad', icon: '🚲', name: 'Fahrrad' },
  { id: 'flug', icon: '✈️', name: 'Flugzeug' },
  { id: 'leihwagen', icon: '🚙', name: 'Leihwagen' },
  { id: 'schiff', icon: '🚢', name: 'Schiff' },
  { id: 'wohnmobil', icon: '🚐', name: 'Wohnmobil' },
  { id: 'fuss', icon: '🚶', name: 'Fuß' },
];
const DEFAULT_MOODS = ['🙂', '😊', '😉', '👍', '😋', '😌', '😏', '😳', '🤪', '🥶', '🤷🏻‍♂️', '☹️', '🤮'];
const DEFAULT_FOOD = ['🕗', '🕙', '🕛', '🕒', '🕕', '😋', '👌', '👍', '😕', '🤮', '👎', '⭐️', '🍕', '🍔', '🥩', '🍷', '🍺', '☕️'];
// Zwei getrennte Schnellauswahl-Leisten: Stimmung (Wie war was?/Fazit) und Essen.
const EMOJI_SETS = {
  mood: { defaults: DEFAULT_MOODS, usage: 'moodUsage', hidden: 'hiddenMoods' },
  food: { defaults: DEFAULT_FOOD, usage: 'foodUsage', hidden: 'hiddenFood' },
};
const PROGRAM_SUGGESTIONS = [
  { label: 'Weiterfahrt nach …', text: 'Weiterfahrt nach ' },
  { label: 'Rundgang durch …', text: 'Rundgang durch ' },
  { label: 'Besichtigung …', text: 'Besichtigung ' },
  { label: 'Freetour …', text: 'Freetour ' },
  { label: 'Tour …', text: 'Tour ' },
  // RLB-94 (seit 3.22.0): keine Vorlage – nur eine leere erste Zeile, der Cursor steht darin
  { label: 'Sonstiges …', top: true },
];
const AUTOSAVE_MS = 10000;

// Gemeinsame Bausteine (Icons, Menüs, Sprechblasen, Fenster, Darstellung …) kommen aus AppDesign (ui.js).
// Haken für ui.js: beim Öffnen eines Fensters das automatische Speichern des vorigen beenden.
function onDialogOpen() { clearInterval(autosaveTimer); }

/* ---------- Speicher ---------- */

// Abgleich zwischen iPad und iPhone (RLB-3, Regeln R-9.2 bis R-9.4): gemeinsamer Baustein createSync aus AppDesign (ui.js).
// Je Feld Zeitpunkt und Gerät – Kopfdaten (metaAt) und Tage (dayAt); gelöschte Reiselogbücher in db.deleted.
const sync = createSync({ list: 'trips', sub: 'days', subAt: 'dayAt', maxFields: ['outputCounter'],
  nouns: ['Reiselogbuch', 'Reiselogbücher', 'Reiselogbüchern'], app: 'Reiselogbuch',
  // Namen der Felder für die Tabelle der Änderungen nach dem Abgleich (R-9.4) – wie im Fenster (R-10.1).
  labels: { title: 'Reisetitel', participants: 'Reiseteilnehmer', start: 'Beginn', end: 'Ende', transport: 'Reisemittel',
    quarterList: 'Quartierliste', foodColumn: 'Spalte Essen', moodColumn: 'Spalte Wie war was?', quarterColumn: 'Spalte Quartier',
    kmColumn: 'Spalte Gegangene Kilometer', km: 'Gegangene Kilometer', price: 'Preis', priceOn: 'Preis der Quartiere erfassen',
    fazit: 'Fazit', kosten: 'Gesamtausgaben', weather: 'Wetter', program: 'Verlauf', comment: 'Wie war was?', food: 'Essen und Trinken',
    sameQuarter: 'Quartier wie Vortag', quarter: 'Quartier', place: 'Ort', noMap: 'Google-Maps-Link' },
  // Seit 3.11.6: Werte wie in der App – Reisemittel mit Symbol und Namen statt der gespeicherten Kürzel (R-10.1).
  values: { transport: ids => TRANSPORT.filter(x => ids.includes(x.id)).map(x => `${x.icon} ${x.name}`).join(', '),
    price: formatEuro, km: n => `${n} km` } });
const snapshot = sync.snapshot, latestChange = sync.latest, mergeData = sync.merge;
function stampChanges() { lastSnap = sync.stamp(db, lastSnap); }
// Seit 3.50.1 (RLB-118): ‚Änderungen verwerfen‘ nach dem automatischen Sichern stellt auch die Zeitstempel des Abgleichs von vor dem
// Öffnen wieder her – sonst gilt der alte Text beim Abgleich als neuer und überschreibt eine echte Änderung am anderen Gerät.
const SYNC_STAMPS = ['dayAt', 'metaAt', 'changedAt', 'changedOn'];
const syncStamps = trip => structuredClone(Object.fromEntries(SYNC_STAMPS.map(k => [k, trip[k]])));
function restoreStamps(trip, stamps) {
  save();   // stempelt das Zurückschreiben, lastSnap = Stand beim Öffnen
  for (const k of SYNC_STAMPS) if (stamps[k] === undefined) delete trip[k]; else trip[k] = structuredClone(stamps[k]);
  save();   // Inhalt unverändert → nichts Neues gestempelt, die alten Zeitstempel sind gespeichert
}

function normalize(data) {
  data.trips ||= [];
  data.moodUsage ||= {};
  data.hiddenMoods ||= [];
  data.foodUsage ||= {};
  data.hiddenFood ||= [];
  data.deleted ||= [];
  // Darstellung: 'auto' folgt dem iPad (Voreinstellung), 'light'/'dark' übersteuern. Das alte Feld 'theme' entfällt.
  data.settings = { appearance: 'auto', hideEmpty: false, ...(data.settings || {}) };
  delete data.settings.theme;
  if (!['auto', 'light', 'dark'].includes(data.settings.appearance)) data.settings.appearance = 'auto';
  if (typeof data.settings.lastTrip !== 'string') delete data.settings.lastTrip;
  for (const t of data.trips) {
    t.days ||= {};
    t.transport ||= [];
    t.quarterList ??= false;
    t.foodColumn ??= false;
    t.moodColumn ??= true;
    t.quarterColumn ??= true;
    t.kmColumn ??= false;   // seit 3.41.0 (RLB-110): Spalte ‚Gegangene Kilometer‘, Voreinstellung aus
    t.priceOn ??= false;    // seit 3.42.0 (RLB-111): Preis der Quartiere nur auf Wunsch, Voreinstellung aus
    t.outputCounter ||= 0;
    t.dayAt ||= {};
    // seit 3.41.0: Preis des Quartiers (RLB-109, Euro, am ersten Tag des Aufenthalts) und gegangene Kilometer (RLB-110; seit 3.42.0,
    // RLB-111, mit einer Nachkommastelle 0,1–99,9) – alte Backups haben beides nicht; Unbrauchbares fällt weg
    for (const e of Object.values(t.days)) {
      if (e && 'price' in e && !(Number.isFinite(e.price) && e.price >= 0)) delete e.price;
      if (e && 'km' in e) { if (Number.isFinite(e.km) && e.km >= 0.05 && e.km < 99.95) e.km = Math.round(e.km * 10) / 10; else delete e.km; }
    }
  }
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) ?? localStorage.getItem(OLD_STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* leer starten */ }
  return normalize({});
}

function save() {
  stampChanges();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    inform('Speichern fehlgeschlagen', 'Der Speicher ist voll oder nicht verfügbar. Bitte ein Backup erstellen.');
    return false;
  }
}

let db = load();
if (!db.trips.length) {
  const days = {}, verlauf = ['Frühstück im Hotel', 'Spaziergang zum Hafen', 'Fähre nach Manly', 'Mittagessen am Strand', 'Rückfahrt mit der Fähre'];
  for (let i = 0; i < 30; i++) days[new Date(Date.UTC(2026, 7, 10 + i)).toISOString().slice(0, 10)] = { weather: '☀️', program: verlauf.slice(0, 2 + i % 4).join('\n'),
    comment: i % 2 ? '😊 schöner Tag' : '', quarter: 'Oaks Hotel ' + (1 + (i >> 2)), place: 'Sydney, Australien' };
  db.trips.push({ id: 'muster', title: 'Muster', participants: 'Anna, Ben', start: '2026-08-10', end: '2026-09-08', transport: ['flug'], days, foodColumn: true });
  for (let j = 1; j <= 6; j++) db.trips.push({ id: 'muster' + j, title: 'Reise ' + j, participants: 'Anna', start: `202${j % 6}-0${1 + j}-01`, end: `202${j % 6}-0${1 + j}-05`, transport: ['auto'], days: {} });
  db.settings.lastTrip = 'muster'; db.settings.lastBackup = Date.now();
}
// Titel folgt der Variante der Adresse
for (const t of db.trips) if (t.id === 'muster') t.title = MUSTER_V === 'a' ? 'Muster A – neu (R-1.12)' : 'Muster B – heute (4.56.0)';
let lastSnap = snapshot(db);
let currentTripId = null;
let searchTerm = '';
let searchIndex = 0;
let autosaveTimer = null;
let searchOpen = false;
// RLB-92 (AppDesign APD-19, R-2.3): Suche in der Startliste bzw. Seitenleiste – seit 3.41.0 (AppDesign APD-91) über ‚Suchen‘ im
// Mehr-Menü, ein Begriff für beide Suchen.
let listOpen = false;
let listTerm = '';
let searchJump = null;     // Zeitgeber für den Sprung zum ersten Treffer    // Suchzeile unter der Kopfzeile eingeblendet
// R-8.1 (seit 3.11.0): ein einziger Zustand für quer und hoch – sichtbar bleibt beim Drehen sichtbar (quer fest links,
// hoch über den Inhalt gelegt), ausgeblendet bleibt ausgeblendet. Nur Tippen ändert ihn, nie das Drehen.
let sideOpen = true;
let wasSchmal = false;   // R-6.6: Breite des Inhalts beim letzten Aufbau (render)
let emptyPrompted = false; // Ohne Reiselogbuch öffnet sich "Neues Reiselogbuch" einmal von selbst
let storagePersistent = false; // Safari löscht dauerhaften Speicher nicht von selbst (z. B. bei knappem Speicher)

/* ---------- Datum ---------- */

// Datumsangaben immer als 'YYYY-MM-DD', gerechnet in UTC, damit die Sommerzeit nicht stört.
function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function toISO(date) { return date.toISOString().slice(0, 10); }
function todayISO() {
  const n = new Date();
  return toISO(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())));
}
function addDays(iso, n) {
  const d = parseISO(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return toISO(d);
}
const pad = (n, len = 2) => String(n).padStart(len, '0');
function dayLabel(iso) {
  const d = parseISO(iso);
  return `${WEEKDAYS[d.getUTCDay()]}, ${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.`;
}
// Seit 3.28.0 (AppDesign APD-37): Marke für den Schnellroll-Griff – ‚Tag 19 · Fr 20.03.‘ (Nummer im ganzen Reisezeitraum)
const dayNumbers = days => new Map(days.map((iso, i) => [iso, i + 1]));
const dayMark = (iso, nr) => `Tag ${nr.get(iso)} · ${dayLabel(iso).replace(',', '')}`;
function longDayLabel(iso) {
  return `${WEEKDAYS_LONG[parseISO(iso).getUTCDay()]}, ${fullDate(iso)}`;
}
function fullDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function shortDate(iso) {
  const [, m, d] = iso.split('-');
  return `${d}.${m}.`;
}
function tripDays(trip) {
  const days = [];
  if (!trip.start || !trip.end || trip.end < trip.start) return days;
  for (let d = trip.start; d <= trip.end; d = addDays(d, 1)) days.push(d);
  return days;
}
function nowStamp() {
  const n = new Date();
  return {
    date: `${pad(n.getDate())}.${pad(n.getMonth() + 1)}.${n.getFullYear()}`,
    time: `${pad(n.getHours())}:${pad(n.getMinutes())}`,
    file: `${n.getFullYear()}.${pad(n.getMonth() + 1)}.${pad(n.getDate())} ${pad(n.getHours())}.${pad(n.getMinutes())}`,
  };
}

/* ---------- Reisen ---------- */

const getTrip = id => db.trips.find(t => t.id === id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Startreise: die Reise, in die heute fällt; sonst die zuletzt beendete; sonst die nächste geplante.
// RLB-88 (seit 3.17.0): zuerst das zuletzt verwendete Reiselogbuch dieses Geräts, sonst nach Datum.
function pickStartTrip() {
  const last = getTrip(db.settings.lastTrip);
  if (last) return last;
  const today = todayISO();
  const current = db.trips.find(t => t.start <= today && today <= t.end);
  if (current) return current;
  const ended = db.trips.filter(t => t.end < today).sort((a, b) => b.end.localeCompare(a.end));
  if (ended.length) return ended[0];
  const planned = db.trips.filter(t => t.start > today).sort((a, b) => a.start.localeCompare(b.start));
  return planned[0] || null;
}

function overlappingTrip(start, end, ignoreId) {
  return db.trips.find(t => t.id !== ignoreId && start <= t.end && t.start <= end);
}

function transportText(trip) {
  return TRANSPORT.filter(t => trip.transport.includes(t.id)).map(t => `${t.icon} ${t.name}`).join(', ');
}
// Seit 3.40.0 (AppDesign APD-90, R-10.5): je Reisemittel Icon und Name zusammen – die Zeile bricht nur nach dem Komma um.
function transportHtml(trip) {
  return TRANSPORT.filter(t => trip.transport.includes(t.id)).map(t => iconText(t.icon, t.name)).join(', ');
}

/* ---------- Tage ---------- */

function rawEntry(trip, iso) { return trip.days[iso] || {}; }

// Quartier (Name + Ort) eines Tages; mit Häkchen "wie Vortag" wird es vom Vortag übernommen, auch über mehrere Tage.
function quarterOf(trip, iso) {
  for (let d = iso, i = 0; i < 1000; d = addDays(d, -1), i++) {
    const e = rawEntry(trip, d);
    if (!e.sameQuarter) return { name: e.quarter || '', place: e.place || '', noMap: Boolean(e.noMap), price: e.price ?? null, src: d };
    if (d <= trip.start) break;
  }
  return { name: '', place: '', noMap: false, price: null, src: null };
}

// Sichtbare Tabellenspalten; "Tag" und "Verlauf" werden immer angezeigt. Seit 3.41.0 (RLB-110) ‚Gegangene Kilometer‘ nach ‚Wie war was?‘.
const cols = trip => ({ mood: trip.moodColumn !== false, km: Boolean(trip.kmColumn), food: Boolean(trip.foodColumn), quarter: trip.quarterColumn !== false });
const colCount = trip => { const c = cols(trip); return 2 + c.mood + c.km + c.food + c.quarter; };
// Seit 3.11.6: Spalten der Ausgabe mit festen Anteilen (Verlauf und ‚Wie war was?‘ je 28, km 8, Essen und Quartier je 22) – die Breite
// hängt nicht von der Textmenge ab, die letzten beiden Spalten sind gleich breit; ‚Tag‘ ist so schmal wie das Datum.
// Fehlt eine Spalte, teilen sich die übrigen den Platz im selben Verhältnis.
const outCols = trip => { const c = cols(trip), w = [28, c.mood && 28, c.km && 8, c.food && 22, c.quarter && 22].filter(Boolean), sum = w.reduce((a, x) => a + x, 0);
  return `<colgroup><col>${w.map(x => `<col style="width:${(x / sum * 100).toFixed(2)}%">`).join('')}</colgroup>`; };
const headCells = trip => { const c = cols(trip);
  return `<th>Tag</th><th>Verlauf</th>${c.mood ? '<th>🙂☹️😉</th>' : ''}${c.km ? '<th class="num">🚶🏽‍♂️km</th>' : ''}${c.food ? '<th>🍽️🍷☕️</th>' : ''}${c.quarter ? '<th>😴💤</th>' : ''}`; };

// Erfasst: Wetter, Verlauf oder eine sichtbare Spalte (Essen und Kilometer zählen nicht); ausgeblendete Spalten zählen nicht.
function isRecorded(trip, iso) {
  const e = rawEntry(trip, iso);
  const c = cols(trip);
  return Boolean(e.weather || e.program || (c.mood && e.comment) || (c.quarter && quarterOf(trip, iso).name));
}

function firstGap(trip) {
  return tripDays(trip).find(d => !isRecorded(trip, d)) || null;
}

// RLB-98 (seit 3.30.0, AppDesign APD-69, R-7.4): Startposition beim Öffnen. Die erste Lücke bis heute steht gelb oben (top = mark);
// läuft die Reise und ist bis heute alles erfasst, steht heute oben, ohne Gelb; sonst (Reise in der Zukunft, vergangen und
// vollständig) ganz oben. Künftige Tage sind nie gelb.
function startDay(trip, today = todayISO()) {
  const gap = firstGap(trip);
  if (gap && gap <= today) return { top: gap, mark: gap };
  if (trip.start <= today && today <= trip.end) return { top: today, mark: null };
  return { top: null, mark: null };
}

// Durchsuchte Felder eines Tages (nur die eingeschalteten Spalten).
function dayText(trip, iso) {
  const e = rawEntry(trip, iso);
  const q = quarterOf(trip, iso);
  const c = cols(trip);
  return [e.program, c.mood && e.comment, c.food && e.food, c.quarter && q.name, c.quarter && q.place].filter(Boolean).join('\n');
}
// RLB-93 / AppDesign APD-21 (seit 3.23.0): mehrere Wörter (und „…“) – ein Reiselogbuch passt, wenn jedes Wort irgendwo darin
// vorkommt (Entscheidung des Nutzers 18.10.2026: Einheit = Reiselogbuch); gezeigt werden dann die Tage mit mindestens einem Wort.
const tripFinds = (trip, term) => findsAll(tripDays(trip).map(iso => dayText(trip, iso)).join('\n'), searchWords(term));
function matchesSearch(trip, iso, term, whole = tripFinds(trip, term)) {
  return whole && findsAny(dayText(trip, iso), searchWords(term));
}

// RLB-92: Treffer eines Reiselogbuchs je Fundstelle – gezählt wie ‚1 von N‘ im Reiselogbuch: jede Markierung in denselben
// Feldern (Verlauf, ‚Wie war was?‘, Essen, Quartier), nur in den eingeschalteten Spalten.
function hitCount(trip, term) {
  const c = cols(trip);
  if (!tripFinds(trip, term)) return 0;
  let html = '';
  for (const iso of tripDays(trip)) {
    if (!matchesSearch(trip, iso, term, true)) continue;
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    html += linesHtml(programItems(e.program), term) + (c.mood ? linesHtml(commentItems(e.comment), term) : '')
      + (c.food ? foodHtml(foodItems(e.food, q.place), term) : '') + (c.quarter ? quarterHtml(q, term) : '');
  }
  return (html.match(/<mark>/g) || []).length;
}

/* ---------- Text-Formatierung mit hängendem Einzug ---------- */

const segmenter = new Intl.Segmenter();
const EMOJI_RE = /\p{Extended_Pictographic}/u;
const graphemes = text => Array.from(segmenter.segment(text || ''), s => s.segment);

function emojisIn(text) {
  return graphemes(text).filter(s => EMOJI_RE.test(s));
}

function splitLines(text) {
  return (text || '').split('\n').map(l => l.trim()).filter(Boolean);
}

// Verlauf: bei mehreren Zeilen jede mit ▫️, bei einer Zeile ohne Zeichen.
function programItems(text) {
  const lines = splitLines(text).map(l => l.replace(/^(▫️|▫|-|•)\s*/u, ''));
  return lines.map(t => ({ m: lines.length > 1 ? '▫️' : '', t, deko: true }));
}

// Führende Smileys (auch mehrere) einer Zeile abtrennen: "🕛 😋 Text" → { m: "🕛😋", t: "Text" }.
// Höchstens drei werden zum Zeichen; eine längere Reihe ist Inhalt: die ganze Zeile ist dann Text und bricht
// am Rand der Zelle um (R-6.3).
const MAX_MARKS = 3;
function splitLeadingEmojis(line) {
  const g = graphemes(line);
  const marks = [];
  let i = 0;
  while (i < g.length && (EMOJI_RE.test(g[i]) || /^\s+$/.test(g[i]))) {
    if (EMOJI_RE.test(g[i])) marks.push(g[i]);
    i++;
  }
  const rest = g.slice(i).join('').trim();
  return marks.length && marks.length <= MAX_MARKS && rest ? { m: marks.join(''), t: rest } : { m: '', t: line };
}

// Kommentar: führende Smileys werden zum Zeichen, der Text rückt daneben ein.
function commentItems(text) {
  return splitLines(text).map(splitLeadingEmojis);
}

// Trennt den Namen vom Rest: am ersten " - " (bzw. – —), optional auch am ersten Komma.
// "Santai Resort - Kingscliff" → ["Santai Resort", " - Kingscliff"]
// RLB-86 (seit 3.18.0): der Name (Maps-Link) endet am ersten ‚ – ‘, Komma, Doppelpunkt oder an einer öffnenden Klammer –
// gleich für Essen und Quartier; Bindestrich ohne Leerzeichen, Punkt, Uhrzeit (8:30) und Betrag (4,50) gehören zum Namen.
function splitName(text) {
  const m = text.match(/\s+[–—-]\s+|\s*[,:](?!\d)|\s*\(/);
  if (!m || m.index === 0) return [text, ''];
  return [text.slice(0, m.index), text.slice(m.index)];
}

const linkAttrs = inApp => inApp ? ' target="_blank" rel="noopener" onclick="event.stopPropagation()"' : '';

// Quartier: 📍 als Zeichen, nur der Hotelname ist der Link; Ort danach ist normaler Text.
// Gesucht wird mit dem ganzen Eintrag. Mit "Kein Maps-Link" weder 📍 noch Link.
// Kilometer mit einer Nachkommastelle (seit 3.42.0, RLB-111): 6 → ‚6,0‘, 12.5 → ‚12,5‘
const fmtKm = n => money(Math.round(n * 10) / 10).slice(0, -1);
// Preis in Klammern hinter dem Quartier (seit 3.42.0, RLB-111) – nur mit ‚Preis der Quartiere erfassen‘ und nur am Tag, an dem er
// eingetragen ist; die Klammer mit dem Betrag bricht nie um
const withPrice = (trip, iso, q, html) => trip.priceOn && q.src === iso && q.price != null && html
  ? html.replace(/<\/span><\/div>$/, ` <span style="white-space:nowrap">(${money(q.price)}\u00a0€)</span></span></div>`) : html;
function quarterHtml(q, term = '', inApp = false) {
  if (!q.name) return '';
  // Ein eingetragener Ort steht nach einem Komma hinter dem Namen; Teile, die dort schon vorkommen, entfallen.
  const lower = q.name.toLocaleLowerCase('de');
  const parts = (q.place || '').split(',').map(x => x.trim()).filter(x => x && !lower.includes(x.toLocaleLowerCase('de')));
  const tail = parts.length ? ', ' + parts.join(', ') : '';
  if (q.noMap) return `<div class="ln"><span class="t">${highlight(q.name + tail, term)}</span></div>`;
  const [name, rest] = splitName(q.name);
  return `<div class="ln q"><span class="m">📍</span><span class="t"><a href="${mapsUrl(q)}"${linkAttrs(inApp)}>${highlight(name, term)}</a>${highlight(rest + tail, term)}</span></div>`;
}

// Essen: "Smileys Name – Kommentar" (auch Komma, Doppelpunkt, Klammer); 📍 als Zeichen, nur der Name ist der Link (Suche: Name + Ort des Quartiers).
// Ein "⊘" am Zeilenanfang schaltet den Maps-Link für dieses Lokal aus.
const NO_LINK = '⊘';
function foodItems(text, place) {
  return splitLines(text).map(line => {
    const noLink = line.startsWith(NO_LINK);
    const { m, t } = splitLeadingEmojis(noLink ? line.slice(NO_LINK.length).trim() : line);
    const [name, rest] = splitName(t);
    return { m, name, rest, maps: !noLink && name.trim() ? mapsUrl({ name, place }) : '' };
  });
}

function foodHtml(items, term = '', inApp = false) {
  return items.map(({ m, name, rest, maps }) =>
    // Smileys und 📍 bilden gemeinsam die linke Spalte, damit Folgezeilen unter dem Namen beginnen.
    `<div class="ln">${m || maps ? `<span class="m">${markLead(m, term)}${maps ? '📍' : ''}</span>` : ''}<span class="t">${maps
      ? `<a href="${maps}"${linkAttrs(inApp)}>${highlight(name, term)}</a>${highlight(rest, term)}`
      : highlight(name + rest, term)}</span></div>`).join('');
}

// "⊘" am Anfang der Zeile mit dem Cursor setzen oder wieder entfernen.
function toggleNoLink(ta) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  const line = v.slice(start);
  const on = line.startsWith(NO_LINK);
  const cut = on ? NO_LINK.length + (line[NO_LINK.length] === ' ' ? 1 : 0) : 0;
  const ins = on ? '' : NO_LINK + ' ';
  ta.value = v.slice(0, start) + ins + v.slice(start + cut);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = Math.max(start, pos + ins.length - cut);
}

// Optional werden Suchtreffer im (bereits maskierten) Text gelb markiert – alle Wörter der Suche (AppDesign markWords, R-2.3).
function highlight(text, term) {
  const safe = esc(breakable(text)); // zu lange Wörter dürfen im Wort umbrechen (R-6.3)
  return term ? markWords(safe, searchWords(term)) : safe;
}

// RLB-119 (seit 3.53.0, AppDesign APD-122, Designrichtlinie 15.2 ‚Smileys (Emoji)‘): die Smileys am Zeilenanfang (eigene Spalte) werden
// wie Wörter markiert und gezählt – nicht das ▫️ des Verlaufs (Zeichen der App, kein Inhalt).
const markLead = (m, term) => term ? markWords(esc(m), searchWords(term)) : esc(m);
function linesHtml(items, term = '') {
  return items.map(({ m, t, deko }) =>
    `<div class="ln">${m ? `<span class="m">${deko ? esc(m) : markLead(m, term)}</span>` : ''}<span class="t">${highlight(t, term)}</span></div>`).join('');
}

/* ---------- Smileys ---------- */

// Nach Häufigkeit sortiert, noch nie benutzte in Standardreihenfolge dahinter; entfernte ausgeblendet.
function quickMoods(kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const hidden = new Set(db[set.hidden]);
  const order = m => { const i = set.defaults.indexOf(m); return i < 0 ? 999 : i; };
  const all = [...new Set([...Object.keys(usage), ...set.defaults])].filter(m => !hidden.has(m));
  return all
    .filter(m => set.defaults.includes(m) || usage[m] > 0)
    .sort((a, b) => (usage[b] || 0) - (usage[a] || 0) || order(a) - order(b));
}

// Zähler an die Änderung eines Kommentars anpassen; wieder verwendete Smileys kommen zurück.
function countMoods(before, after, kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const diff = {};
  emojisIn(after).forEach(m => diff[m] = (diff[m] || 0) + 1);
  emojisIn(before).forEach(m => diff[m] = (diff[m] || 0) - 1);
  for (const [m, n] of Object.entries(diff)) {
    if (!n) continue;
    usage[m] = Math.max(0, (usage[m] || 0) + n);
    if (!usage[m]) delete usage[m];
    if (n > 0) db[set.hidden] = db[set.hidden].filter(h => h !== m);
  }
}

/* ---------- Hilfen ---------- */

function mapsUrl({ name, place }) {
  const query = [name, place].map(s => (s || '').trim()).filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function insertAtCursor(ta, text, ownLine) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const before = v.slice(0, pos);
  const prefix = ownLine && before && !before.endsWith('\n') ? '\n' : '';
  const ins = prefix + text;
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
  autoGrow(ta);
}
// RLB-94: leere Zeile am Anfang des Felds, Cursor dorthin – ist die erste Zeile schon leer, keine zweite.
function insertLineTop(ta) {
  if (ta.value && !ta.value.startsWith('\n')) ta.value = '\n' + ta.value;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = 0;
  autoGrow(ta);
  ta.scrollTop = 0;
  // seit 3.54.0 (Variante A, AppDesign APD-115/E-6): die Vorschläge stehen unter dem Feld – liegt die erste Zeile über dem Fensterinhalt, rollt er
  // so weit, dass sie mit Platz für Umrandung und Schatten zu sehen ist (RLB-94 V10)
  const c = ta.closest('.dlg-body'), d = c ? ta.getBoundingClientRect().top - c.getBoundingClientRect().top - 30 : 0;
  if (d < 0) c.scrollTop += d;
}


// Datumsfeld so breit wie das Datum, mit kurzem Abstand zum eigenen Kalender-Icon (auf allen Geräten gleich).
const dateBox = (id, value, label) => `<span class="datebox"><input type="date" id="${id}" value="${value}" aria-label="${label}">${ic('calendar')}</span>`;
function fitDate(inp) {
  const cs = getComputedStyle(inp);
  const ctx = (fitDate.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  // Das Datum wird in der Sprache des Geräts angezeigt; gemessen wird die breitere Schreibweise.
  const d = inp.value ? new Date(inp.value + 'T12:00') : new Date(2000, 11, 28);
  const w = Math.max(...[fullDate(inp.value || '2000-12-28'), d.toLocaleDateString(), d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' })]
    .map(t => ctx.measureText(t).width));
  inp.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 14) + 'px';
}

// Betragsfeld mindestens so breit wie "100.000,00", bei längeren Beträgen wächst es mit.
function fitMoney(inp) {
  const cs = getComputedStyle(inp);
  const ctx = (fitMoney.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const w = Math.max(ctx.measureText('100.000,00').width, ctx.measureText(inp.value).width);
  inp.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 6) + 'px';
}

function insertEmoji(ta, emoji) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
  const head = v.slice(lineStart, pos);
  const onlyEmojis = graphemes(head).every(g => EMOJI_RE.test(g) || /^\s+$/.test(g));
  let before, ins;
  if (onlyEmojis) {
    before = v.slice(0, lineStart) + head.trimEnd();
    ins = emoji + ' ';
  } else {
    before = v.slice(0, pos);
    ins = '\n' + emoji + ' ';
  }
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = before.length + ins.length;
  autoGrow(ta);
}



/* ---------- Hauptansicht ---------- */

function render({ scrollToGap = false, kaesten = false } = {}) {
  if (isPhone()) return renderPhone({ scrollToGap });
  const trip = getTrip(currentTripId);
  if (!trip) return renderEmpty();
  emptyPrompted = false;
  renderSide();
  const today = todayISO();
  const days = tripDays(trip);
  const { top: startTop, mark: gap } = startDay(trip, today);
  const term = searchTerm.trim().toLocaleLowerCase('de');
  const nr = dayNumbers(days);

  const whole = Boolean(term) && tripFinds(trip, term);
  const visible = days.filter(iso => {
    if (term) return matchesSearch(trip, iso, term, whole);
    return !db.settings.hideEmpty || isRecorded(trip, iso);
  });

  const c = cols(trip);
  // Zebrastreifen nach sichtbaren Zeilen, damit das Muster auch bei Filter und Suche abwechselt.
  const rows = visible.map((iso, i) => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    const rec = isRecorded(trip, iso);
    const tags = (iso === today ? '<span class="tag today">heute</span>' : '')
      + (!rec && iso < today ? '<span class="tag miss">fehlt</span>' : '');
    const wx = e.weather
      ? `<span class="wx">${esc(e.weather)}</span>`
      : `<span class="wx empty">☀️🌤🌦🌧</span>`;
    const link = withPrice(trip, iso, q, quarterHtml(q, term, true));
    const cls = [i % 2 ? 'alt' : '', iso === gap ? 'gap' : ''].join(' ').trim();
    return `<tr data-day="${iso}" data-marke="${dayMark(iso, nr)}" class="${cls}">
      <td class="day">${dayLabel(iso)}${tags}${wx}</td>
      <td>${linesHtml(programItems(e.program), term)}</td>
      ${c.mood ? `<td>${linesHtml(commentItems(e.comment), term)}</td>` : ''}
      ${c.km ? `<td class="num">${e.km != null ? fmtKm(e.km) : ''}</td>` : ''}
      ${c.food ? `<td>${foodHtml(foodItems(e.food, q.place), term, true)}</td>` : ''}
      ${c.quarter ? `<td class="quarter">${link}</td>` : ''}
    </tr>`;
  }).join('');

  const progress = progressText(trip);
  // Kästen ab AX1 – und schon vorher, wenn die Tabelle bei großer Schrift nicht in ihren Platz passt (render mit kaesten: true)
  const ax = isAx() || kaesten;

  const transport = transportText(trip);
  const stays = c.quarter ? quarterStays(trip) : [];

  setHtml(app, `
    <div class="nb" id="bar">
      <div class="nb1">
        <span>${sideToggleHtml()}</span>
        <span class="nb-title">${esc(trip.title)}</span>
        <span class="r"><span class="grp">
          <button type="button" id="shareBtn" aria-label="Ausgabe">${ic('share')}</button>
          <button type="button" id="mainMore" aria-label="Mehr">${ic('ellipsis')}</button>
        </span></span>
      </div>
      ${searchOpen ? searchRowHtml(term) : ''}
    </div>
    <div class="rolle" id="rolle">
    <dl class="meta trip">
      <dt>Reiseteilnehmer:</dt><dd>${esc(trip.participants)}</dd>
      <dt>Reisezeitraum:</dt><dd>${fullDate(trip.start)} - ${fullDate(trip.end)}</dd>
      ${transport ? `<dt>Reisemittel:</dt><dd>${transportHtml(trip)}</dd>` : ''}
    </dl>
    <p class="progress">${progress}</p>
    ${ax ? `<div id="pdays">${dayBoxesHtml(trip, visible, { today, gap, term, nr }) || leerTage()}</div>` : `
    <div class="table-wrap">
      <table class="days">
        <thead><tr>${headCells(trip)}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${visible.length ? '' : leerTage()}
    </div>`}

    ${fazitHtml(trip)}

    ${ax ? phoneStaysHtml(trip) : stays.length ? `
      <h2 data-marke="Quartierliste">Quartierliste</h2>
      <div class="table-wrap fit">
        <table class="days static">
          <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th>${trip.priceOn ? '<th class="num">Preis</th>' : ''}</tr></thead>
          <tbody>${stays.map((st, i) => `<tr class="${i % 2 ? 'alt' : ''}">
            <td>${quarterHtml(st.q, '', true)}</td>
            <td class="nw">${shortDate(st.firstNight)} - ${fullDate(addDays(st.lastNight, 1))}</td>
            <td class="num">${st.nights}</td>
            ${trip.priceOn ? `<td class="num">${st.price == null ? '' : formatEuro(st.price)}</td>` : ''}
          </tr>`).join('')}</tbody>
        </table>
      </div>` : ''}

    <h2 data-marke="Statistik">Statistik</h2>
    <dl class="meta">${tripStats(trip).map(([k, v]) => `<dt>${k}:</dt><dd>${statHtml(v)}</dd>`).join('')}</dl>
    </div>`);

  const tabelle = app.querySelector('table.days:not(.static)');
  // R-6.6 (seit 3.43.0, AppDesign APD-97): schmaler Inhalt (z. B. iPad hoch neben der Seitenleiste) zeigt die Tage als Kästen
  wasSchmal = inhaltSchmal(app);
  if (!ax && tabelle && wasSchmal) return render({ scrollToGap, kaesten: true });
  if (!ax && tabelle && (tabelle.offsetWidth > tabelle.parentElement.clientWidth + 1 || [...tabelle.querySelectorAll('td')].some(td => td.scrollWidth > td.clientWidth + 1)))
    return render({ scrollToGap, kaesten: true });
  fab.hidden = false;
  const bar = app.querySelector('#bar');
  updateBar();
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  bindSideToggle(app);

  app.querySelector('#shareBtn').onclick = e => openShareMenu(e.currentTarget, trip);
  app.querySelector('#mainMore').onclick = e => openMainMenu(e.currentTarget, trip);
  bindSearch(term);
  markOpener();
  app.querySelectorAll('tbody tr, #pdays [data-day]').forEach(tr => tr.onclick = () => openDayDialog(trip, tr.dataset.day));
  bindTripEnd(trip);

  // R-7.4 (seit 3.20.0, RLB-89; seit 3.30.0 RLB-98): beim Öffnen steht der Starttag direkt unter dem Tabellenkopf; sonst ganz oben.
  if (scrollToGap) openAt(startTop && app.querySelector(`tr[data-day="${startTop}"], #pdays [data-day="${startTop}"]`));
}

function progressText(trip) {
  const today = todayISO();
  const days = tripDays(trip);
  const recorded = days.filter(d => isRecorded(trip, d)).length;
  let progress;
  if (today < trip.start) progress = `Reise beginnt in ${Math.round((parseISO(trip.start) - parseISO(today)) / 864e5)} Tagen`;
  else if (today > trip.end) progress = `Reise beendet · ${days.length} Tage`;
  else progress = `Tag ${days.indexOf(today) + 1} von ${days.length}`;
  return progress + ` · ${recorded} erfasst`;
}

// Suche (iPad und iPhone gleich): Suchzeile unter der Kopfzeile mit Trefferanzeige ‚3 von 57‘, ⓧ und ⌃ ⌄, rechts x ‚Suche beenden‘
// (seit 3.41.0, AppDesign APD-91); gezeigt werden nur passende Tage, die Treffer sind gelb, der aktuelle hellorange.
const searchRowHtml = term => `<div class="nb2">
    <span class="searchbox active">${ic('search')}<input type="search" id="search" placeholder="Suchen" value="${esc(searchTerm)}" autocomplete="off" autocapitalize="off" enterkeyhint="search">${term ? `
      <span class="smeta"><span class="scount" id="scount"></span><button type="button" class="sclear" id="sclear" aria-label="Suche löschen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M15 9l-6 6M9 9l6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></span>` : ''}</span>
    <span class="navgrp"><button type="button" id="sprev" aria-label="Voriger Treffer" ${term ? '' : 'disabled'}>${ic('chevron-up')}</button><button type="button" id="snext" aria-label="Nächster Treffer" ${term ? '' : 'disabled'}>${ic('chevron-down')}</button></span>
    ${sucheBeendenHtml('sclose')}
  </div>`;

// Seit 3.41.0 (AppDesign APD-91, R-2.3): ‚Suchen‘ im Mehr-Menü bzw. ⌘F öffnet die Suche im Reiselogbuch; ist sie offen, kommt nur der
// Cursor ins Feld. APD-29 (seit 3.25.0): Suche öffnen rollt den Inhalt ganz nach oben.
function openTripSearch() {
  if (!searchOpen) { searchOpen = true; render(); rolle.to(0); }
  app.querySelector('#search')?.focus();
}
// x ‚Suche beenden‘: Suchzeile zu, Filter und Markierung weg, der Inhalt steht ganz oben; der Fokus geht auf ‚Mehr‘ (R-4.7).
function closeTripSearch() {
  clearTimeout(searchJump);
  searchOpen = false; searchTerm = ''; searchIndex = 0;
  render(); rolle.to(0);
  fokus(app.querySelector('#mainMore'));
}

function bindSearch(term) {
  const close = app.querySelector('#sclose'); if (close) close.onclick = closeTripSearch;
  const search = app.querySelector('#search');
  const refocus = () => {
    const s = app.querySelector('#search');
    s.focus();
    s.selectionStart = s.selectionEnd = s.value.length;
  };
  if (search) {
    // Markiert wird sofort; zum ersten Treffer gesprungen wird erst nach einer kurzen Tipp-Pause.
    search.oninput = () => {
      searchTerm = search.value;
      searchIndex = 0;
      if (listOpen) listTerm = searchTerm;   // RLB-92: ein Begriff für beide Suchen
      render();
      refocus();
      clearTimeout(searchJump);
      searchJump = setTimeout(() => showHit(true), 500);
      ansageTreffer();
    };
    // Eingabetaste springt zum nächsten Treffer (wie in Safari).
    search.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); stepHit(1); } };
  }
  if (term) {
    // APD-29: ⓧ leert die Suche und rollt den Inhalt ganz nach oben; der Fokus bleibt im Feld.
    app.querySelector('#sclear').onclick = () => { clearTimeout(searchJump); searchTerm = ''; searchIndex = 0; if (listOpen) listTerm = ''; render(); rolle.to(0); refocus(); };
    app.querySelector('#sprev').onclick = () => stepHit(-1);
    app.querySelector('#snext').onclick = () => stepHit(1);
    showHit(false);
  }
}

// Fazit und Gesamtausgaben (iPad und iPhone).
// Seit 3.48.0 (AppDesign APD-30, R-7.7, 15.23): leerer Zustand im Reiselogbuch – Suche ohne Treffer (S-5) bzw. ‚Nur erfasste Tage‘ ohne
// erfassten Tag (S-4) mit ‚Alle Tage zeigen‘ (wie Menü ‚Alle Tage‘)
const leerTage = () => searchTerm.trim() ? leerSuche(searchTerm.trim())
  : leerHtml({ icon: 'calendar', titel: 'Noch keine Tage erfasst', satz: 'Es werden nur erfasste Tage gezeigt.', aktion: { id: 'leerAlle', label: 'Alle Tage zeigen' } });
function bindTripEnd(trip) {
  const alle = app.querySelector('#leerAlle'); if (alle) alle.onclick = () => { db.settings.hideEmpty = false; save(); render(); };
  app.querySelector('#fazit').onclick = () => { setOpener('#fazit'); openFazitDialog(trip); };
  bindMoney(app.querySelector('#kosten'), () => trip.kosten, v => { trip.kosten = v; save(); });
}
// Betragsfeld (R-5.1; Gesamtausgaben, seit 3.41.0 auch der Preis des Quartiers): Tausenderpunkt beim Tippen, Komma für Cent (höchstens
// zwei Stellen); beim Verlassen wird ",00" ergänzt.
function bindMoney(inp, get, set) {
  inp.oninput = () => {
    const raw = inp.value.replace(/[^\d,]/g, '');
    const [i, ...rest] = raw.split(',');
    const int = i.replace(/^0+(?=\d)/, '').slice(0, 9);
    const dec = rest.join('').slice(0, 2);
    const hasComma = raw.includes(',');
    set(int || dec ? Number(`${int || 0}.${dec || 0}`) : null);
    inp.value = int || hasComma ? `${int ? thousands(int) : '0'}${hasComma ? ',' + dec : ''}` : '';
    fitMoney(inp);
  };
  inp.onblur = () => { inp.value = get() == null ? '' : money(get()); fitMoney(inp); };
  fitMoney(inp);
}

const fazitHtml = trip => `<h2 data-marke="Fazit">Fazit</h2>
    <button type="button" class="fazit-box" id="fazit">${trip.fazit
      ? linesHtml(commentItems(trip.fazit))
      : `<span class="muted" style="display:inline-flex;gap:6px;align-items:center">${ic('pencil')}Antippen, um das Fazit zu schreiben.</span>`}</button>
    <h2>Gesamtausgaben</h2>
    <div class="kosten">
      <input type="text" id="kosten" inputmode="decimal" placeholder="0,00" aria-label="Gesamtausgaben" value="${trip.kosten == null ? '' : money(trip.kosten)}">
      <span>€</span>
    </div>`;

/* ---------- iPhone ---------- */

// Wie Apple (Notizen, iOS 26): Startliste ‚Reiselogbücher‘ als eigene Seite; ein Reiselogbuch zeigt die Tage als Kästen,
// die Suche steht unten. Fenster sind bildschirmfüllend (AppDesign, html.phone).
let phoneList = false;   // iPhone: Startliste statt eines Reiselogbuchs
let startList = false;   // R-7.2: Startliste nach dem Neuladen – noch nichts geöffnet, daher kein Eintrag blau

function renderPhone({ scrollToGap = false } = {}) {
  const trip = getTrip(currentTripId);
  // Seit 3.19.0 (AppDesign APD-15, R-3.2): ‚Nach oben / Ans Ende‘ auch auf dem iPhone – im Reiselogbuch, nicht in der Startliste.
  fab.hidden = phoneList || !trip;
  // Startliste = Seitenleiste als ganze Seite (derselbe Baustein wie am iPad, R-1.1)
  if (phoneList || !trip) {
    searchOpen = false;
    app.innerHTML = '';
    renderSide();
    if (!db.trips.length && !emptyPrompted && !dlg.open) { emptyPrompted = true; openTripDialog(null); }
    return;
  }
  side.hidden = true;
  side.classList.remove('page');
  emptyPrompted = false;
  const today = todayISO();
  const { top: startTop, mark: gap } = startDay(trip, today);
  const term = searchTerm.trim().toLocaleLowerCase('de');
  const c = cols(trip);
  const whole = Boolean(term) && tripFinds(trip, term);
  const all = tripDays(trip), nr = dayNumbers(all);
  const visible = all.filter(iso => term ? matchesSearch(trip, iso, term, whole) : !db.settings.hideEmpty || isRecorded(trip, iso));
  const transport = transportText(trip);
  const boxes = dayBoxesHtml(trip, visible, { today, gap, term, nr });
  setHtml(app, `
    <div class="pnav" id="bar">
      <span><button type="button" class="round" id="back" aria-label="Reiselogbücher">${ic('chevron-left')}</button></span>
      <span class="pnav-title">${esc(trip.title)}</span>
      <span class="r"><span class="grp">
        <button type="button" id="shareBtn" aria-label="Ausgabe">${ic('share')}</button>
        <button type="button" id="mainMore" aria-label="Mehr">${ic('ellipsis')}</button>
      </span></span>
      ${searchOpen ? searchRowHtml(term) : ''}
    </div>
    <div class="rolle" id="rolle">
    <dl class="meta trip">
      <dt>Reiseteilnehmer:</dt><dd>${esc(trip.participants)}</dd>
      <dt>Reisezeitraum:</dt><dd>${fullDate(trip.start)} - ${fullDate(trip.end)}</dd>
      ${transport ? `<dt>Reisemittel:</dt><dd>${wischHtml(esc(transport), 'reisemittel')}</dd>` : ''}
    </dl>
    <p class="progress">${progressText(trip)}</p>
    <div id="pdays">${boxes || leerTage()}</div>
    ${fazitHtml(trip)}
    ${phoneStaysHtml(trip)}
    <h2 data-marke="Statistik">Statistik</h2>
    <dl class="meta">${tripStats(trip).map(([k, v]) => `<dt>${k}:</dt><dd>${statHtml(v)}</dd>`).join('')}</dl>
    </div>`);
  mountCap(app);   // seit 3.38.0 (AppDesign APD-86): Verlauf und Pfeile der Zeile Reisemittel
  app.querySelector('#back').onclick = navZurueck;   // seit 3.28.0 (AppDesign APD-61): der Inhalt schiebt sich hinaus
  app.querySelector('#shareBtn').onclick = e => openShareMenu(e.currentTarget, trip);
  app.querySelector('#mainMore').onclick = e => openMainMenu(e.currentTarget, trip);
  bindSearch(term);
  bindTripEnd(trip);
  app.querySelectorAll('#pdays [data-day]').forEach(b => b.onclick = () => openDayDialog(trip, b.dataset.day));
  markOpener();
  if (scrollToGap) openAt(startTop && app.querySelector(`#pdays [data-day="${startTop}"]`));   // R-7.4, RLB-98: direkt unter der Leiste, sonst ganz oben
  updateBar();
}

// Tage als Kästen (AppDesign .box) – auf dem iPhone immer, am iPad ab AX1 (seit 3.35.0, RLB-101, AppDesign APD-43 U3/U4): dieselbe
// Umsetzung auf beiden Geräten (R-1.1). Felder eines Tages; ‚Verlauf‘ als Wort in normaler Schrift, die anderen mit den Spalten-Emojis.
function dayBoxesHtml(trip, visible, { today, gap, term, nr }) {
  const c = cols(trip);
  // seit 3.42.1 (AppDesign APD-98, R-6.5): Bezeichnung in .l, Buchstaben neben einem Emoji in .w – normal, mittig zur ersten Zeile des Werts
  const line = (k, v, word) => v ? `<div class="kv"><span class="k ${word ? 'word' : ''}"><span class="l">${word ? k : k.replace(/\p{L}+/gu, w => `<span class="w">${w}</span>`)}</span></span><span class="v">${v}</span></div>` : '';
  return visible.map(iso => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    const tags = (iso === today ? '<span class="tag today">heute</span>' : '')
      + (!isRecorded(trip, iso) && iso < today ? '<span class="tag miss">fehlt</span>' : '');
    return `<div class="box day ${iso === gap && !term ? 'gap' : ''}" data-day="${iso}" data-marke="${dayMark(iso, nr)}" role="button" tabindex="0">
      <div class="h">${dayLabel(iso)}${tags}${e.weather ? `<span class="wx">${esc(e.weather)}</span>` : '<span class="wx empty">☀️🌤🌦🌧</span>'}</div>
      ${line('Verlauf', e.program ? linesHtml(programItems(e.program), term) : '', true)}
      ${c.mood ? line('🙂☹️😉', e.comment ? linesHtml(commentItems(e.comment), term) : '') : ''}
      ${c.km ? line('🚶🏽‍♂️km', e.km ? fmtKm(e.km) : '') : ''}
      ${c.food ? line('🍽️🍷☕️', e.food ? foodHtml(foodItems(e.food, q.place), term, true) : '') : ''}
      ${c.quarter ? line('😴💤', withPrice(trip, iso, q, quarterHtml(q, term, true))) : ''}
    </div>`;
  }).join('');
}
// Ab AX1 (html.ts-ax, ui.js textStufe) zeigt auch das iPad die Tage als Kästen und die Quartierliste als Liste (R-1.10)
function isAx() { return document.documentElement.classList.contains('ts-ax'); }

// Quartierliste als Liste: Quartier mit Maps-Link, darunter Zeitraum und Nächte.
function phoneStaysHtml(trip) {
  const stays = cols(trip).quarter ? quarterStays(trip) : [];
  return stays.length ? `<h2 data-marke="Quartierliste">Quartierliste</h2><div class="ilist">${stays.map(st => `<div class="irow"><span class="t">${quarterHtml(st.q, '', true)}
    <small>${shortDate(st.firstNight)} - ${fullDate(addDays(st.lastNight, 1))} · ${st.nights} ${st.nights === 1 ? 'Nacht' : 'Nächte'}${!trip.priceOn || st.price == null ? '' : ` · ${formatEuro(st.price)}`}</small></span></div>`).join('')}</div>` : '';
}


// Treffer-Navigation der Suche: jeder markierte Begriff in der Tabelle ist ein Treffer; der aktuelle ist hellorange.
const hitMarks = () => [...app.querySelectorAll('table.days:not(.static) mark, #pdays mark')];
function showHit(scroll) {
  const marks = hitMarks();
  const n = marks.length;
  if (searchIndex >= n) searchIndex = Math.max(0, n - 1);
  marks.forEach((m, i) => m.classList.toggle('cur', i === searchIndex));
  const count = app.querySelector('#scount');
  if (!count) return;
  count.textContent = n ? `${searchIndex + 1} von ${n}` : '0';
  const input = app.querySelector('#search');
  input.style.paddingRight = (app.querySelector('.smeta').offsetWidth + 14) + 'px';
  app.querySelector('#sprev').disabled = !n || searchIndex <= 0;
  app.querySelector('#snext').disabled = !n || searchIndex >= n - 1;
  if (scroll && n) scrollUnderBar(marks[searchIndex]);
}

// Treffer direkt unter die Suchzeile (und den Tabellenkopf) rollen, mit einer halben Zeile Abstand.
// Seit 3.25.0 (AppDesign APD-28): nur der Rollbereich rollt – gemessen ab seiner Oberkante (= Unterkante der Leiste), ohne offsetTop.
function scrollUnderBar(el) {
  const row = el.closest('tr, .kv') || el;
  const head = app.querySelector('table.days:not(.static) thead');
  const box = rolle.el?.getBoundingClientRect().top ?? document.getElementById('bar')?.getBoundingClientRect().bottom ?? 0;
  rolle.to(rolle.y + row.getBoundingClientRect().top - box - (head?.offsetHeight || 0) - 12);
}

function stepHit(dir) {
  const n = hitMarks().length;
  const next = searchIndex + dir;
  if (next < 0 || next >= n) return;
  searchIndex = next;
  showHit(true);
  ansagen(`Treffer ${searchIndex + 1} von ${n}`);   // RLB-100 (R-1.8, V9)
}
// RLB-100 (AppDesign R-1.8, V9): nach einer Tipp-Pause von 0,7 s die Zahl der Treffer ansagen (höflich, VoiceOver)
const ansageTreffer = () => { if (!searchTerm.trim()) return; const n = hitMarks().length; ansagen(n ? `${n} Treffer` : 'Keine Treffer', { warten: 700 }); };

// Ohne Reiselogbuch: leere Seite mit dem leeren Zustand (seit 3.48.0 AppDesign APD-30, R-7.7, S-1); "Neues Reiselogbuch" öffnet sich einmal von selbst.
const leerKeinBuch = id => leerHtml({ icon: 'book-open', titel: 'Noch kein Reiselogbuch', satz: 'Ein neues mit ‚plus‘ in der Seitenleiste anlegen.',
  aktion: { id, label: 'Neues Reiselogbuch' } });
const bindLeerNeu = (wo, id) => { const b = wo.querySelector('#' + id); if (b) b.onclick = () => { setOpener('#' + id); openTripDialog(null); }; };
function renderEmpty() {
  fab.hidden = true;
  searchOpen = false;
  renderSide();
  app.innerHTML = `
    <div class="nb" id="bar"><div class="nb1"><span>${sideToggleHtml()}</span><span></span><span></span></div></div>
    <div class="rolle" id="rolle">${leerKeinBuch('leerNeu')}</div>`;
  bindSideToggle(app);
  bindLeerNeu(app, 'leerNeu');
  if (!emptyPrompted && !dlg.open) { emptyPrompted = true; openTripDialog(null); }
}

function showTrip(id, term = '') {
  currentTripId = id;
  // RLB-88: zuletzt verwendetes Reiselogbuch merken (je Gerät, wie lastBackup) – beim nächsten Start öffnet es (iPad-Aufbau).
  if (id && db.settings.lastTrip !== id) { db.settings.lastTrip = id; save(); }
  phoneList = false;
  startList = false;
  // Beim Öffnen eines Reiselogbuchs (und beim Start) immer alle Tage zeigen.
  db.settings.hideEmpty = false;
  // RLB-92: aus der gefilterten Liste geöffnet – Suche gefüllt, erster Treffer unter der Suchzeile.
  searchTerm = term;
  searchIndex = 0;
  searchOpen = Boolean(term);
  render({ scrollToGap: !term });
  if (term) showHit(true);
}

/* ---------- Seitenleiste ---------- */

// Seit 3.43.0 (AppDesign APD-97): am iPad steht die Seitenleiste quer und hoch fest links neben dem Inhalt (Apple ‚tile‘) und lässt sich
// mit panel-left aus- und einblenden; keine Abdunkelung, die Auswahl lässt sie stehen. Ist der Inhalt daneben schmaler als 700 px,
// zeigt er die Tage als Kästen (render, inhaltSchmal aus ui.js, R-6.6).
const isWide = () => !isPhone();
const sideOver = () => !isPhone() && !isWide() && Boolean(getTrip(currentTripId));   // seit 3.43.0 (APD-97) nie: hoch steht sie fest wie quer
const sideFest = () => !isPhone() && isWide() && Boolean(getTrip(currentTripId));    // iPad quer: fest links
const sideVisible = () => sideOpen;
const sideToggleHtml = () => sideVisible() && isWide() ? ''
  : `<button type="button" class="round" data-side-toggle aria-label="Seitenleiste einblenden">${ic('panel-left')}</button>`;

// R-8.1 (seit 3.20.0, RLB-90): beim Ein- und Ausblenden bleibt oben derselbe Tag stehen.
// Seit 3.28.0 (AppDesign APD-61): am iPad hoch gleitet die darübergelegte Seitenleiste herein und hinaus (navSeite);
// seit 3.29.0 (AppDesign APD-68) auch quer – der Inhalt rückt mit und wird beim Einrasten schmaler.
function toggleSide() {
  if (sideOver() || sideFest()) return navSeite(!sideOpen);
  keepPlace(() => { sideOpen = !sideOpen; render(); });
}
const bindSideToggle = root => root.querySelectorAll('[data-side-toggle]').forEach(b => b.onclick = toggleSide);

// Anzahl unter dem Titel der Seitenleiste bzw. Startliste: ‚3 Reiselogbücher‘.
const tripCount = n => n ? `${n} Reiselogb${n === 1 ? 'uch' : 'ücher'}` : '';
// RLB-92: während der Suche ‚2 von 5 Reiselogbüchern‘.
const hitTripCount = (n, all) => `${n} von ${all} Reiselogb${all === 1 ? 'uch' : 'üchern'}`;
const hitText = n => `${n} Treffer`;

function tripState(t, today) {
  return t.start <= today && today <= t.end ? 'läuft gerade' : t.end < today ? 'beendet' : 'geplant';
}

// Backup: einmal am Tag erstellen; Datum und Uhrzeit des letzten Backups.
function backedUpToday() { return backupToday(db.settings.lastBackup); }
function lastBackupText() { return backupLastText(db.settings.lastBackup); }
// RLB-105 (AppDesign APD-74): um 0:00 und bei der Rückkehr am nächsten Tag die Liste neu zeichnen – die Backup-Kachel kommt wieder.
onNeuerTag(() => { if (isPhone()) render(); else renderSide(); });

function renderSide() {
  // iPhone: die Seitenleiste ist die Startliste und füllt den Bildschirm (.page); im Reiselogbuch ist sie aus.
  const page = isPhone();
  if (page && !(phoneList || !getTrip(currentTripId))) { side.hidden = true; side.classList.remove('page'); return; }
  const show = page || sideVisible();
  const wide = isWide();
  side.hidden = !show;
  side.classList.toggle('page', page);
  side.classList.toggle('over', show && !wide && !page);
  document.body.classList.toggle('docked', show && wide && !page);
  document.querySelector('.side-shade')?.remove();
  if (!show) return;
  if (!wide && !page) {
    const shade = document.createElement('div');
    shade.className = 'side-shade';
    shade.onclick = () => navSeite(false);
    side.before(shade);
  }
  const today = todayISO();
  const all = [...db.trips].sort((a, b) => b.start.localeCompare(a.start));

      : term ? leerSuche(listTerm.trim(), !isPhone()) : isPhone() ? leerKeinBuch('leerNeuListe') : leerHtml({ icon: 'book-open', titel: 'Noch kein Reiselogbuch', klein: true })}</div>
    ${backupTileHtml(db.settings.lastBackup, !all.length)}`);
  side.querySelector('#newTrip').onclick = () => { setOpener('#newTrip'); openTripDialog(null); };

  side.querySelector('#sideMore').onclick = e => openMenu(e.currentTarget, backupMenuItems('#sideMore'), 'left');

  const hb = side.querySelector('#hintBackup'); if (hb) hb.onclick = () => saveBackup('#hintBackup');   // onclick: setHtml behält das Element (APD-24)
  held.forEach(sel => side.querySelector(sel)?.classList.add('on'));

  // Kurz tippen öffnet; lange drücken zeigt das Kontextmenü (Reiselogbuch einstellen · Reiselogbuch löschen); die Köpfe (.side-sec) tun nichts.
  side.querySelectorAll('[data-id]').forEach(b => onLongPress(b,

}

// RLB-92 (AppDesign APD-19): Suchzeile der Liste wie 15.2, ohne Pfeile – die Kacheln zeigen die Treffer; rechts x ‚Suche beenden‘ (APD-91).

// Seit 3.41.0 (AppDesign APD-91): ‚Suchen‘ im Mehr-Menü der Seitenleiste bzw. Startliste (oder ⌘F ohne offenes Reiselogbuch) öffnet die
// Suche in allen; ist sie offen, kommt nur der Cursor ins Feld. x ‚Suche beenden‘ schließt sie, die Liste steht wieder ganz oben.
function openListSearch() {
  if (!listOpen) { listOpen = true; listTerm = ''; sideScroll = 0; renderSide(); }
  side.querySelector('#lsearch')?.focus();
}
function closeListSearch() {
  listOpen = false; listTerm = ''; sideScroll = 0;
  renderSide();
  fokus(side.querySelector('#sideMore'));
}

function bindListSearch() {
  const close = side.querySelector('#lsclose'); if (close) close.onclick = closeListSearch;
  const input = side.querySelector('#lsearch');
  if (!input) return;
  const refocus = () => {
    const s = side.querySelector('#lsearch');
    s.focus();
    s.selectionStart = s.selectionEnd = s.value.length;
  };
  // Ist im offenen Reiselogbuch die Suche zu, bleibt es, wie es ist (RLB-92, Frage 1); ist sie offen, wird der Begriff
  // 1:1 übernommen (RLB-92, Zusatz 17.10.2026) – Markierung sofort, Sprung zum ersten Treffer nach der Tipp-Pause.
  const both = () => searchOpen && !isPhone() && getTrip(currentTripId);
  const update = () => {
    sideScroll = 0;
    if (both()) {
      searchTerm = listTerm; searchIndex = 0; render();
      clearTimeout(searchJump);
      searchJump = setTimeout(() => showHit(true), 500);
    } else renderSide();
    refocus();
    // RLB-100 (R-1.8, V9): ‚2 von 5 Reiselogbüchern‘ bzw. ‚Keine Treffer‘ nach der Tipp-Pause
    if (listTerm.trim()) ansagen(side.querySelector('.side-row') ? side.querySelector('.side-head small').textContent : 'Keine Treffer', { warten: 700 });
  };
  input.oninput = () => { listTerm = input.value; update(); };
  // Eingabetaste ‚Suchen‘ schließt nur die Tastatur (R-5.5).
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } };
  const lc = side.querySelector('#lsclear'); if (lc) lc.onclick = () => { listTerm = ''; update(); };
}

// Die Liste der Seitenleiste (iPhone: Startliste) behält beim Neuaufbau ihre Position; der gewählte Eintrag
// bleibt sichtbar – auch wenn er erst durch Wischen sichtbar wurde (nicht unter Kopf oder Backup-Kachel).
let sideScroll = 0;
function keepSideScroll() {
  const list = side.querySelector('.side-list');
  if (!list) return;
  list.scrollTop = sideScroll;
  const cur = list.querySelector('.side-row.current');
  if (cur) {
    const lr = list.getBoundingClientRect(), r = cur.getBoundingClientRect();
    const tile = side.querySelector('.side-foot .bhint')?.getBoundingClientRect();
    const bottom = Math.min(lr.bottom, tile ? tile.top : lr.bottom);
    // seit 3.35.0 (RLB-101): ist die Kachel bei großer Schrift höher als der Platz, genügt ihr Anfang – steht er im Bild, bleibt die Liste
    if (r.height > bottom - lr.top - 12) { if (r.top < lr.top + 6 || r.top > bottom - 40) list.scrollTop += r.top - lr.top - 6; }
    else if (r.top < lr.top + 6) list.scrollTop += r.top - lr.top - 6;
    else if (r.bottom > bottom - 6) list.scrollTop += r.bottom - bottom + 6;
  }
  sideScroll = list.scrollTop;
  list.onscroll = () => { sideScroll = list.scrollTop; };
}

async function deleteTrip(trip, anchor = app.querySelector('#mainMore')) {
  const yes = await confirmPop(anchor,
    `‚${esc(trip.title)}‘ mit allen Einträgen löschen? Das kann nicht rückgängig gemacht werden. Tipp: Vorher ein Backup erstellen.`,
    { label: 'Reiselogbuch löschen', icon: 'trash' });
  if (!yes) return;
  db.trips = db.trips.filter(x => x.id !== trip.id);
  save();
  showTrip(pickStartTrip()?.id);
  // iPhone: nach dem Löschen zurück zur Startliste.
  if (isPhone()) { phoneList = true; render(); }
}

}

function mountMoodRow(row, ta, onReset, kind = 'mood') {

  row.classList.add('strip');

      + `<button type="button" class="reset" aria-label="Standard-Smileys wiederherstellen">${ic('rotate-ccw')}</button>`;
    const strip = row.querySelector('.scroll');
    strip.scrollLeft = keep;
    mountCap(row);
    row.querySelectorAll('[data-m]').forEach(b => onLongPress(b,
      async () => {
        if (!await confirmPop(b, `${b.dataset.m} aus der Schnellauswahl entfernen?`, { label: 'Entfernen', icon: 'trash' })) return;
        db[set.hidden].push(b.dataset.m);
        delete db[set.usage][b.dataset.m];
        save();
        draw();
      },
      () => insertEmoji(ta, b.dataset.m), { entfernen: true }));   // R-3.5 (seit 3.46.1, APD-106): Entfernen erst nach 1 s
    row.querySelector('.reset').onclick = async e => {
      if (!await confirmPop(e.currentTarget, 'Standard-Smileys wiederherstellen und alle Zähler auf null setzen?', { label: 'Zurücksetzen', icon: 'rotate-ccw' })) return;

          </div>

        </div>
        <div class="step">
          <div class="swlist" style="margin:0"><label class="check sw"><input type="checkbox" switch role="switch" id="fQuarterList" ${t.quarterList ? 'checked' : ''}> Quartierliste in der Ausgabe</label><label class="check sw"><input type="checkbox" switch role="switch" id="fPriceOn" ${t.priceOn ? 'checked' : ''}> Preis der Quartiere erfassen</label></div>
          <div class="hint">Quartierliste am Ende der Ausgabe: alle Quartiere mit Zeitraum, Anzahl Nächte und Maps-Link. Preis: Feld beim Quartier, Spalte ‚Preis‘ in der Quartierliste und Quartierkosten in der Statistik. Nur mit Spalte Quartier.</div>
        </div>
      </div>
    </form>`);

  const fTitle = dlg.querySelector('#fTitle');
  const fStart = dlg.querySelector('#fStart');
  const fEnd = dlg.querySelector('#fEnd');
  const warn = dlg.querySelector('#tripWarn');
  const ok = dlg.querySelector('#dlgOk');
  fitDate(fStart);

  // Pflichtfelder: Reisetitel, Reiseteilnehmer, Reisezeitraum, Reisemittel – ohne eigene Kennzeichnung.
  // Fehlermeldungen stehen in Rot unter dem jeweiligen Feld (Feld mit rotem Rahmen), aber erst nach einer Eingabe:

  // Titel eingegeben wurde; Reisemittel, wenn das letzte abgewählt wurde. Ein Tippen auf das Häkchen zeigt alle

  const fPeople = dlg.querySelector('#fPeople');
