<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neue App">
<meta name="theme-color" content="#f2f2f7">
<title>Neue App</title>
<!-- Vorlage für eine neue App (AppDesign 4.32.1). Im App-Repo liegt AppDesign daneben: ../AppDesign/fassung/X.Y.Z/…
     R-10.3: ui.js und design.css aus der festen Fassung einbinden (auch in sw.js), AD_NEEDED = X.Y.Z. -->
<link rel="stylesheet" href="../fassung/4.32.1/design.css">
<style>
  /* Nur, was zur App gehört – alles Gemeinsame kommt aus design.css */
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>
<dialog id="msg"></dialog>

<script src="../fassung/4.32.1/ui.js"></script>
<script>
'use strict';

const APP_VERSION = '0.1.0';
// R-10.3: benötigte AppDesign-Fassung; ist eine andere geladen, erscheint beim Start ein Hinweis.
const AD_NEEDED = '4.32.1';
const adLoaded = () => ({ js: typeof AD_VERSION === 'string' ? AD_VERSION : 'älter',
  css: getComputedStyle(document.documentElement).getPropertyValue('--ad-version').trim().replace(/"/g, '') || 'älter' });
setTimeout(() => {
  const { js, css } = adLoaded();
  if (js !== AD_NEEDED || css !== AD_NEEDED) inform('Neue Version wird geladen',
    `⚠️ Die App braucht AppDesign ${AD_NEEDED}, geladen ist ${js === css ? js : `${js} / ${css}`}.<br><br>` +
    'Bitte die App ganz schließen und nach ein paar Minuten neu öffnen.');
});
const STORAGE_KEY = 'neueapp.v1';
const app = document.getElementById('app');

// Daten: settings.appearance wird von ui.js für die Darstellung verwendet ('auto' | 'light' | 'dark').
function load() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { /* leer starten */ }
  return normalize({});
}
function normalize(data) {
  data.settings = { appearance: 'auto', ...(data.settings || {}) };
  data.items ||= [];
  return data;
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return true; }
  catch (e) { inform('Speichern fehlgeschlagen', 'Der Speicher ist voll oder nicht verfügbar.'); return false; }
}
let db = load();

// Kopfzeile mit Kapsel [ellipsis], darunter der Inhalt im Rollbereich .rolle (die Seite rollt nie, nur der Inhalt – R-2.1, A-28).
// Seite immer mit setHtml aufbauen (Feld mit Fokus und Rollstand bleiben, R-2.3); rollen nur über rolle (nie window.scrollTo).
function render() {
  setHtml(app, `
    <div class="nb" id="bar"><div class="nb1"><span></span><div class="nb-title">Neue App</div>
      <div class="r"><span class="grp"><button type="button" id="mainMore" aria-label="Mehr">${ic('ellipsis')}</button></span></div></div></div>
    <div class="rolle" id="rolle">
    <h1>Neue App</h1>
    <div class="step"><div class="step-head"><label>Erster Kasten</label></div>
      <p class="hint">Hier beginnt die App. Komponenten und Regeln: README - Designrichtlinie allgemein.md</p>
      <button type="button" id="openDlg">${ic('pencil')}Fenster öffnen</button></div>
    </div>`);
  app.querySelector('#mainMore').onclick = e => openMenu(e.currentTarget, [
    { icon: 'sun-moon', label: 'Darstellung', value: APPEARANCES[db.settings.appearance],
      submenu: Object.entries(APPEARANCES).map(([k, l]) => ({ tick: db.settings.appearance === k, label: l, act: () => setAppearance(k) })) },
    'line',
    { note: `Neue App · Version ${APP_VERSION} · AppDesign ${adLoaded().js}` },
  ]);
  app.querySelector('#openDlg').onclick = () => {
    setOpener('#openDlg');
    openDialog(`<form method="dialog">${dlgHead('Beispiel')}
      <div class="dlg-body"><div class="step"><label for="fText">Text</label><textarea id="fText" placeholder="Etwas eingeben"></textarea></div></div></form>`);
    const start = dlg.querySelector('#fText').value;
    dlgDirty = () => dlg.querySelector('#fText').value !== start;
  };
  markOpener();
}

applyTheme();
render();
</script>
</body>
</html>
