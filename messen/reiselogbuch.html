<!doctype html>
<html lang="de">
<head>
<!-- Erzeugt von messen/erzeuge-reiselogbuch.mjs aus Reiselogbuch 3.20.1 – Messung A-18, speichert nicht. Nicht von Hand ändern. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reiselogbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="../../ReiseLogBuch/icon-180.png">
<title>Messung Reiselogbuch</title>
<link rel="stylesheet" href="../fassung/4.21.1/design.css">
<style>
  /* Reiselogbuch: nur, was zur App gehört – die gemeinsamen Bausteine kommen aus AppDesign (design.css) */
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 4px 0 6px; }
  .meta dt { font-weight: 600; }
  .meta dd { margin: 0; }
  .progress { font-size: 14px; color: var(--muted); margin: 0 0 12px; }

  /* Tabelle */
  .table-wrap { background: var(--card); border-radius: 12px; overflow: clip; box-shadow: var(--table-shadow); }
  table.days { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.days th, table.days td { border-bottom: 1px solid var(--line); padding: 10px 12px; vertical-align: top; text-align: left; }
  table.days td + td { border-left: 1px solid var(--line); }
  table.days th { position: sticky; top: calc(var(--bar-h) + var(--vv-top)); background: var(--th-bg); border-bottom-color: var(--th-line); font-size: 17px; font-weight: 600; z-index: 2; }
  table.days th + th { border-left: 1px solid var(--th-line); }
  table.days tbody tr:last-child td { border-bottom: none; }
  table.days tbody tr { cursor: pointer; }
  table.days tbody tr.alt { background: var(--zebra); }
  @media (hover: hover) { table.days tbody tr:hover { background: var(--row-hover); } }
  table.days tbody tr.gap { background: var(--focus); }
  table.days tbody tr.on { background: var(--sel-bg); }
  td.day { white-space: nowrap; width: 1%; }
  td.day .wx { display: block; font-size: 18px; }
  td.day .wx.empty { opacity: .25; }
  .tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
  .tag.today { background: var(--accent); color: var(--accent-ink); }
  .tag.miss { color: var(--warn); border: 1px solid var(--warn); }
  td.quarter a { text-decoration: none; }
  .empty-note { padding: 20px; text-align: center; color: var(--muted); }

  /* Hängender Einzug: Folgezeilen beginnen unter dem Text, nicht unter dem Zeichen */
  .ln { display: flex; gap: .35em; }
  .ln + .ln { margin-top: 2px; }
  .ln .m { flex: none; }
  .ln .t { min-width: 0; overflow-wrap: anywhere; }
  /* In der Tagestabelle zwischen ganzen Wörtern umbrechen (die Spalte wird so breit wie das längste Wort);
     ein zu langes Wort, das nicht in die Spalte passt, bricht im Wort um (R-6.3). */
  table.days .ln .t { overflow-wrap: break-word; }
  /* Spaltenköpfe (Smileys) bleiben in einer Zeile – die Spalte wird mindestens so breit. */
  table.days th { white-space: nowrap; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.cur { background: var(--mark-cur); color: var(--mark-cur-ink); }

  .fazit-box { display: inline-block; width: auto; max-width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; border-radius: 14px; background: var(--card); }
  .kosten { display: flex; align-items: center; gap: 10px; }
  .kosten span { font-size: 20px; }
  #kosten { text-align: right; width: 130px; flex: none; }
  .table-wrap.fit { display: inline-block; max-width: 100%; }
  .table-wrap.fit table { width: auto; }
  table.days.static th { position: static; }
  table.days.static tbody tr { cursor: default; }
  table.days td.num, table.days th.num { text-align: right; }
  table.days td.nw { white-space: nowrap; }
  table.days.static td.quarter a, table.days.static a { text-decoration: none; }
  td a { text-decoration: none; }
  /* Maps-Links: Antippfläche unsichtbar auf 44 px Höhe vergrößert (Innenabstand eines Inline-Links ändert das Layout nicht) */
  .ln.q a, #qHint a { padding: 12px 0; position: relative; }
  /* R-3.1 (seit 3.12.0, Fund A-05): kurze Quartiernamen (‚Hotel‘) gaben eine Antippfläche unter 44 px. Wie iOS wird die Fläche
     unsichtbar auf mindestens 44 px verbreitert – Schrift und Abstände bleiben gleich. */
  .ln.q a::after, #qHint a::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: max(100%, 44px); transform: translateX(-50%); }

  /* iPhone: Tage als Kästen (AppDesign .box) – Kopf mit Datum, Hinweisen und Wetter */
  .box.day { cursor: pointer; }
  .box.day .h { display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .box.day .h .wx { margin-left: auto; font-size: 18px; font-weight: 400; }
  .box.day .wx.empty { opacity: .25; }
  .box.day.gap { background: var(--focus); }
  .box.day.on { background: var(--sel-bg); }
  .box.day a { text-decoration: none; }
  /* iPhone: Bezeichnung mit Doppelpunkt, darunter der Wert; Reisemittel in einer Zeile, seitlich wischen */
  html.phone .meta.trip { display: block; margin-top: 8px; }
  html.phone .meta.trip dd { margin: 0 0 6px; }
  html.phone .meta.trip dd.swipe { white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  html.phone .meta.trip dd.swipe::-webkit-scrollbar { display: none; }
  html.phone .fazit-box { width: 100%; }
  /* Wetter auf dem iPhone 40 px breit, damit alle sieben ohne Wischen nebeneinander passen (bewusste Abweichung) */
  html.phone #wx button { width: 40px; min-width: 40px; }

  .qrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .dlg-body.preview { margin: 0; padding: 24px; background: #fff; color: #000; color-scheme: light; }
  /* Vorschau in voller Seitenbreite (wie die Ausgabe) – ist das Fenster schmaler (iPad hoch, iPhone),
     wischt man seitlich, statt dass Wörter zerreißen oder Inhalte über die Tabelle hinausragen */
  .dlg-body.preview { overflow: auto; }
  .dlg-body.preview .rt { min-width: 960px; }
  html.phone .dlg-body.preview { padding: 16px; }

  #printout { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    html, body, body.docked { background: #fff !important; color: #000; padding: 0 !important; margin: 0; }
    #app, #side, .side-shade, dialog, .fab { display: none !important; }
    #printout { display: block; }
  }
</style>
</head>
<body>
<aside id="side" hidden></aside>
<main id="app"></main>
<div class="fab" id="fab" hidden>
  <button id="toTop" aria-label="Nach oben"></button>
  <button id="toEnd" aria-label="Ans Ende"></button>
</div>
<div id="printout"></div>
<dialog id="dlg"></dialog>
<dialog id="msg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
// Messung (A-18): nichts speichern – Schreiben in den Speicher ist abgeschaltet, Änderungen verschwinden beim Neuladen.
Storage.prototype.setItem = function () {};
Storage.prototype.removeItem = function () {};
Storage.prototype.clear = function () {};
</script>
<script src="../fassung/4.21.1/ui.js"></script>
<script>
'use strict';


// Version und Erstellungszeitpunkt, werden bei jeder neuen Version angepasst.
// Versionsnummer Hauptversion.Nebenversion.Korrektur (siehe CHANGELOG.md).
const APP_VERSION = '3.20.1';
const APP_BUILT = '17.10.2026 um 16:15';
// R-10.3: benötigte AppDesign-Fassung (seit 3.13.0 feste Fassung: Pfad ../fassung/<AD_NEEDED>/ oben und in sw.js). Ist eine andere geladen
// (z. B. GitHub Pages noch nicht fertig oder alter Zwischenspeicher), erscheint gleich beim Start ein Hinweis.
const AD_NEEDED = '4.21.1';
const adLoaded = () => ({ js: typeof AD_VERSION === 'string' ? AD_VERSION : 'älter',
  css: getComputedStyle(document.documentElement).getPropertyValue('--ad-version').trim().replace(/"/g, '') || 'älter' });
setTimeout(() => {
  const { js, css } = adLoaded();
  if (js !== AD_NEEDED || css !== AD_NEEDED) inform('Neue Version wird geladen',
    `⚠️ Reiselogbuch ${APP_VERSION} braucht AppDesign ${AD_NEEDED}, geladen ist ${js === css ? js : `${js} / ${css}`}.<br><br>` +
    'Bitte die App ganz schließen (vom unteren Rand nach oben wischen und wegschieben) und nach ein paar Minuten neu öffnen.');
});

const app = document.getElementById('app');
const side = document.getElementById('side');
const fab = document.getElementById('fab');
const printout = document.getElementById('printout');
const importFile = document.getElementById('importFile');

const STORAGE_KEY = 'reiselogbuch.v1';
const OLD_STORAGE_KEY = 'reisetagebuch.v1'; // Name vor der Umbenennung, wird beim ersten Start übernommen
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WEEKDAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const WEATHER = ['☀️', '🌤', '🌦', '🌧', '☁️', '⛈', '❄️'];
const TRANSPORT = [
  { id: 'pkw', icon: '🚗', name: 'PKW' },
  { id: 'zug', icon: '🚆', name: 'Zug' },
  { id: 'rad', icon: '🚲', name: 'Fahrrad' },
  { id: 'flug', icon: '✈️', name: 'Flugzeug' },
  { id: 'leihwagen', icon: '🚙', name: 'Leihwagen' },
  { id: 'schiff', icon: '🚢', name: 'Schiff' },
  { id: 'wohnmobil', icon: '🚐', name: 'Wohnmobil' },
  { id: 'fuss', icon: '🚶', name: 'Fuß' },
];
const DEFAULT_MOODS = ['🙂', '😊', '😉', '👍', '😋', '😌', '😏', '😳', '🤪', '🥶', '🤷🏻‍♂️', '☹️', '🤮'];
const DEFAULT_FOOD = ['🕗', '🕙', '🕛', '🕒', '🕕', '😋', '👌', '👍', '😕', '🤮', '👎', '⭐️', '🍕', '🍔', '🥩', '🍷', '🍺', '☕️'];
// Zwei getrennte Schnellauswahl-Leisten: Stimmung (Wie war was?/Fazit) und Essen.
const EMOJI_SETS = {
  mood: { defaults: DEFAULT_MOODS, usage: 'moodUsage', hidden: 'hiddenMoods' },
  food: { defaults: DEFAULT_FOOD, usage: 'foodUsage', hidden: 'hiddenFood' },
};
const PROGRAM_SUGGESTIONS = [
  { label: 'Weiterfahrt nach …', text: 'Weiterfahrt nach ' },
  { label: 'Rundgang durch …', text: 'Rundgang durch ' },
  { label: 'Besichtigung …', text: 'Besichtigung ' },
  { label: 'Freetour …', text: 'Freetour ' },
];
const AUTOSAVE_MS = 10000;

// Gemeinsame Bausteine (Icons, Menüs, Sprechblasen, Fenster, Darstellung …) kommen aus AppDesign (ui.js).
// Haken für ui.js: beim Öffnen eines Fensters das automatische Speichern des vorigen beenden.
function onDialogOpen() { clearInterval(autosaveTimer); }

/* ---------- Speicher ---------- */

// Abgleich zwischen iPad und iPhone (T-03, Regeln R-9.2 bis R-9.4): gemeinsamer Baustein createSync aus AppDesign (ui.js).
// Je Feld Zeitpunkt und Gerät – Kopfdaten (metaAt) und Tage (dayAt); gelöschte Reiselogbücher in db.deleted.
const sync = createSync({ list: 'trips', sub: 'days', subAt: 'dayAt', maxFields: ['outputCounter'],
  nouns: ['Reiselogbuch', 'Reiselogbücher', 'Reiselogbüchern'], app: 'Reiselogbuch',
  // Namen der Felder für die Tabelle der Änderungen nach dem Abgleich (R-9.4) – wie im Fenster (R-10.1).
  labels: { title: 'Reisetitel', participants: 'Reiseteilnehmer', start: 'Beginn', end: 'Ende', transport: 'Reisemittel',
    quarterList: 'Quartierliste', foodColumn: 'Spalte Essen', moodColumn: 'Spalte Wie war was?', quarterColumn: 'Spalte Quartier',
    fazit: 'Fazit', kosten: 'Gesamtausgaben', weather: 'Wetter', program: 'Verlauf', comment: 'Wie war was?', food: 'Essen und Trinken',
    sameQuarter: 'Quartier wie Vortag', quarter: 'Quartier', place: 'Ort', noMap: 'Google-Maps-Link' },
  // Seit 3.11.6: Werte wie in der App – Reisemittel mit Symbol und Namen statt der gespeicherten Kürzel (R-10.1).
  values: { transport: ids => TRANSPORT.filter(x => ids.includes(x.id)).map(x => `${x.icon} ${x.name}`).join(', ') } });
const snapshot = sync.snapshot, latestChange = sync.latest, mergeData = sync.merge;
function stampChanges() { lastSnap = sync.stamp(db, lastSnap); }

function normalize(data) {
  data.trips ||= [];
  data.moodUsage ||= {};
  data.hiddenMoods ||= [];
  data.foodUsage ||= {};
  data.hiddenFood ||= [];
  data.deleted ||= [];
  // Darstellung: 'auto' folgt dem iPad (Voreinstellung), 'light'/'dark' übersteuern. Das alte Feld 'theme' entfällt.
  data.settings = { appearance: 'auto', hideEmpty: false, ...(data.settings || {}) };
  delete data.settings.theme;
  if (!['auto', 'light', 'dark'].includes(data.settings.appearance)) data.settings.appearance = 'auto';
  if (typeof data.settings.lastTrip !== 'string') delete data.settings.lastTrip;
  for (const t of data.trips) {
    t.days ||= {};
    t.transport ||= [];
    t.quarterList ??= false;
    t.foodColumn ??= false;
    t.moodColumn ??= true;
    t.quarterColumn ??= true;
    t.outputCounter ||= 0;
    t.dayAt ||= {};
  }
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) ?? localStorage.getItem(OLD_STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* leer starten */ }
  return normalize({});
}

function save() {
  stampChanges();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    inform('Speichern fehlgeschlagen', 'Der Speicher ist voll oder nicht verfügbar. Bitte ein Backup erstellen.');
    return false;
  }
}

let db = load();
let lastSnap = snapshot(db);
let currentTripId = null;
let searchTerm = '';
let searchIndex = 0;
let autosaveTimer = null;
let searchOpen = false;
let searchJump = null;     // Zeitgeber für den Sprung zum ersten Treffer    // Suchzeile unter der Kopfzeile eingeblendet
// R-8.1 (seit 3.11.0): ein einziger Zustand für quer und hoch – sichtbar bleibt beim Drehen sichtbar (quer fest links,
// hoch über den Inhalt gelegt), ausgeblendet bleibt ausgeblendet. Nur Tippen ändert ihn, nie das Drehen.
let sideOpen = true;
let emptyPrompted = false; // Ohne Reiselogbuch öffnet sich "Neues Reiselogbuch" einmal von selbst
let storagePersistent = false; // Safari löscht dauerhaften Speicher nicht von selbst (z. B. bei knappem Speicher)

/* ---------- Datum ---------- */

// Datumsangaben immer als 'YYYY-MM-DD', gerechnet in UTC, damit die Sommerzeit nicht stört.
function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function toISO(date) { return date.toISOString().slice(0, 10); }
function todayISO() {
  const n = new Date();
  return toISO(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())));
}
function addDays(iso, n) {
  const d = parseISO(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return toISO(d);
}
const pad = (n, len = 2) => String(n).padStart(len, '0');
function dayLabel(iso) {
  const d = parseISO(iso);
  return `${WEEKDAYS[d.getUTCDay()]}, ${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.`;
}
function longDayLabel(iso) {
  return `${WEEKDAYS_LONG[parseISO(iso).getUTCDay()]}, ${fullDate(iso)}`;
}
function fullDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function shortDate(iso) {
  const [, m, d] = iso.split('-');
  return `${d}.${m}.`;
}
function tripDays(trip) {
  const days = [];
  if (!trip.start || !trip.end || trip.end < trip.start) return days;
  for (let d = trip.start; d <= trip.end; d = addDays(d, 1)) days.push(d);
  return days;
}
function nowStamp() {
  const n = new Date();
  return {
    date: `${pad(n.getDate())}.${pad(n.getMonth() + 1)}.${n.getFullYear()}`,
    time: `${pad(n.getHours())}:${pad(n.getMinutes())}`,
    file: `${n.getFullYear()}.${pad(n.getMonth() + 1)}.${pad(n.getDate())} ${pad(n.getHours())}.${pad(n.getMinutes())}`,
  };
}

/* ---------- Reisen ---------- */

const getTrip = id => db.trips.find(t => t.id === id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Startreise: die Reise, in die heute fällt; sonst die zuletzt beendete; sonst die nächste geplante.
// T-88 (seit 3.17.0): zuerst das zuletzt verwendete Reiselogbuch dieses Geräts, sonst nach Datum.
function pickStartTrip() {
  const last = getTrip(db.settings.lastTrip);
  if (last) return last;
  const today = todayISO();
  const current = db.trips.find(t => t.start <= today && today <= t.end);
  if (current) return current;
  const ended = db.trips.filter(t => t.end < today).sort((a, b) => b.end.localeCompare(a.end));
  if (ended.length) return ended[0];
  const planned = db.trips.filter(t => t.start > today).sort((a, b) => a.start.localeCompare(b.start));
  return planned[0] || null;
}

function overlappingTrip(start, end, ignoreId) {
  return db.trips.find(t => t.id !== ignoreId && start <= t.end && t.start <= end);
}

function transportText(trip) {
  return TRANSPORT.filter(t => trip.transport.includes(t.id)).map(t => `${t.icon} ${t.name}`).join(', ');
}

/* ---------- Tage ---------- */

function rawEntry(trip, iso) { return trip.days[iso] || {}; }

// Quartier (Name + Ort) eines Tages; mit Häkchen "wie Vortag" wird es vom Vortag übernommen, auch über mehrere Tage.
function quarterOf(trip, iso) {
  for (let d = iso, i = 0; i < 1000; d = addDays(d, -1), i++) {
    const e = rawEntry(trip, d);
    if (!e.sameQuarter) return { name: e.quarter || '', place: e.place || '', noMap: Boolean(e.noMap) };
    if (d <= trip.start) break;
  }
  return { name: '', place: '', noMap: false };
}

// Sichtbare Tabellenspalten; "Tag" und "Verlauf" werden immer angezeigt.
const cols = trip => ({ mood: trip.moodColumn !== false, food: Boolean(trip.foodColumn), quarter: trip.quarterColumn !== false });
const colCount = trip => { const c = cols(trip); return 2 + c.mood + c.food + c.quarter; };
// Seit 3.11.6: Spalten der Ausgabe mit festen Anteilen (Verlauf und ‚Wie war was?‘ je 28, Essen und Quartier je 22) – die Breite
// hängt nicht von der Textmenge ab, die letzten beiden Spalten sind gleich breit; ‚Tag‘ ist so schmal wie das Datum.
// Fehlt eine Spalte, teilen sich die übrigen den Platz im selben Verhältnis.
const outCols = trip => { const c = cols(trip), w = [28, c.mood && 28, c.food && 22, c.quarter && 22].filter(Boolean), sum = w.reduce((a, x) => a + x, 0);
  return `<colgroup><col>${w.map(x => `<col style="width:${(x / sum * 100).toFixed(2)}%">`).join('')}</colgroup>`; };
const headCells = trip => { const c = cols(trip);
  return `<th>Tag</th><th>Verlauf</th>${c.mood ? '<th>🙂☹️😉</th>' : ''}${c.food ? '<th>🍽️🍷☕️</th>' : ''}${c.quarter ? '<th>😴💤</th>' : ''}`; };

// Erfasst: Wetter, Verlauf oder eine sichtbare Spalte (Essen zählt nicht); ausgeblendete Spalten zählen nicht.
function isRecorded(trip, iso) {
  const e = rawEntry(trip, iso);
  const c = cols(trip);
  return Boolean(e.weather || e.program || (c.mood && e.comment) || (c.quarter && quarterOf(trip, iso).name));
}

function firstGap(trip) {
  return tripDays(trip).find(d => !isRecorded(trip, d)) || null;
}

function matchesSearch(trip, iso, term) {
  const e = rawEntry(trip, iso);
  const q = quarterOf(trip, iso);
  const c = cols(trip);
  return [e.program, c.mood && e.comment, c.food && e.food, c.quarter && q.name, c.quarter && q.place]
    .filter(Boolean).join('\n').toLocaleLowerCase('de').includes(term);
}

/* ---------- Text-Formatierung mit hängendem Einzug ---------- */

const segmenter = new Intl.Segmenter();
const EMOJI_RE = /\p{Extended_Pictographic}/u;
const graphemes = text => Array.from(segmenter.segment(text || ''), s => s.segment);

function emojisIn(text) {
  return graphemes(text).filter(s => EMOJI_RE.test(s));
}

function splitLines(text) {
  return (text || '').split('\n').map(l => l.trim()).filter(Boolean);
}

// Verlauf: bei mehreren Zeilen jede mit ▫️, bei einer Zeile ohne Zeichen.
function programItems(text) {
  const lines = splitLines(text).map(l => l.replace(/^(▫️|▫|-|•)\s*/u, ''));
  return lines.map(t => ({ m: lines.length > 1 ? '▫️' : '', t }));
}

// Führende Smileys (auch mehrere) einer Zeile abtrennen: "🕛 😋 Text" → { m: "🕛😋", t: "Text" }.
// Höchstens drei werden zum Zeichen; eine längere Reihe ist Inhalt: die ganze Zeile ist dann Text und bricht
// am Rand der Zelle um (R-6.3).
const MAX_MARKS = 3;
function splitLeadingEmojis(line) {
  const g = graphemes(line);
  const marks = [];
  let i = 0;
  while (i < g.length && (EMOJI_RE.test(g[i]) || /^\s+$/.test(g[i]))) {
    if (EMOJI_RE.test(g[i])) marks.push(g[i]);
    i++;
  }
  const rest = g.slice(i).join('').trim();
  return marks.length && marks.length <= MAX_MARKS && rest ? { m: marks.join(''), t: rest } : { m: '', t: line };
}

// Kommentar: führende Smileys werden zum Zeichen, der Text rückt daneben ein.
function commentItems(text) {
  return splitLines(text).map(splitLeadingEmojis);
}

// Trennt den Namen vom Rest: am ersten " - " (bzw. – —), optional auch am ersten Komma.
// "Santai Resort - Kingscliff" → ["Santai Resort", " - Kingscliff"]
// T-86 (seit 3.18.0): der Name (Maps-Link) endet am ersten ‚ – ‘, Komma, Doppelpunkt oder an einer öffnenden Klammer –
// gleich für Essen und Quartier; Bindestrich ohne Leerzeichen, Punkt, Uhrzeit (8:30) und Betrag (4,50) gehören zum Namen.
function splitName(text) {
  const m = text.match(/\s+[–—-]\s+|\s*[,:](?!\d)|\s*\(/);
  if (!m || m.index === 0) return [text, ''];
  return [text.slice(0, m.index), text.slice(m.index)];
}

const linkAttrs = inApp => inApp ? ' target="_blank" rel="noopener" onclick="event.stopPropagation()"' : '';

// Quartier: 📍 als Zeichen, nur der Hotelname ist der Link; Ort danach ist normaler Text.
// Gesucht wird mit dem ganzen Eintrag. Mit "Kein Maps-Link" weder 📍 noch Link.
function quarterHtml(q, term = '', inApp = false) {
  if (!q.name) return '';
  // Ein eingetragener Ort steht nach einem Komma hinter dem Namen; Teile, die dort schon vorkommen, entfallen.
  const lower = q.name.toLocaleLowerCase('de');
  const parts = (q.place || '').split(',').map(x => x.trim()).filter(x => x && !lower.includes(x.toLocaleLowerCase('de')));
  const tail = parts.length ? ', ' + parts.join(', ') : '';
  if (q.noMap) return `<div class="ln"><span class="t">${highlight(q.name + tail, term)}</span></div>`;
  const [name, rest] = splitName(q.name);
  return `<div class="ln q"><span class="m">📍</span><span class="t"><a href="${mapsUrl(q)}"${linkAttrs(inApp)}>${highlight(name, term)}</a>${highlight(rest + tail, term)}</span></div>`;
}

// Essen: "Smileys Name – Kommentar" (auch Komma, Doppelpunkt, Klammer); 📍 als Zeichen, nur der Name ist der Link (Suche: Name + Ort des Quartiers).
// Ein "⊘" am Zeilenanfang schaltet den Maps-Link für dieses Lokal aus.
const NO_LINK = '⊘';
function foodItems(text, place) {
  return splitLines(text).map(line => {
    const noLink = line.startsWith(NO_LINK);
    const { m, t } = splitLeadingEmojis(noLink ? line.slice(NO_LINK.length).trim() : line);
    const [name, rest] = splitName(t);
    return { m, name, rest, maps: !noLink && name.trim() ? mapsUrl({ name, place }) : '' };
  });
}

function foodHtml(items, term = '', inApp = false) {
  return items.map(({ m, name, rest, maps }) =>
    // Smileys und 📍 bilden gemeinsam die linke Spalte, damit Folgezeilen unter dem Namen beginnen.
    `<div class="ln">${m || maps ? `<span class="m">${esc(m)}${maps ? '📍' : ''}</span>` : ''}<span class="t">${maps
      ? `<a href="${maps}"${linkAttrs(inApp)}>${highlight(name, term)}</a>${highlight(rest, term)}`
      : highlight(name + rest, term)}</span></div>`).join('');
}

// "⊘" am Anfang der Zeile mit dem Cursor setzen oder wieder entfernen.
function toggleNoLink(ta) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  const line = v.slice(start);
  const on = line.startsWith(NO_LINK);
  const cut = on ? NO_LINK.length + (line[NO_LINK.length] === ' ' ? 1 : 0) : 0;
  const ins = on ? '' : NO_LINK + ' ';
  ta.value = v.slice(0, start) + ins + v.slice(start + cut);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = Math.max(start, pos + ins.length - cut);
}

// Optional werden Suchtreffer im (bereits maskierten) Text gelb markiert.
function highlight(text, term) {
  const safe = esc(breakable(text)); // zu lange Wörter dürfen im Wort umbrechen (R-6.3)
  if (!term) return safe;
  // Zwischen den Zeichen darf eine unsichtbare Umbruchstelle stehen (lange Wörter, R-6.3)
  const pattern = (esc(term).match(/&[a-z0-9#]+;|./gsu) || []).map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\u200B?');
  return safe.replace(new RegExp(pattern, 'gi'), m => `<mark>${m}</mark>`);
}

function linesHtml(items, term = '') {
  return items.map(({ m, t }) =>
    `<div class="ln">${m ? `<span class="m">${esc(m)}</span>` : ''}<span class="t">${highlight(t, term)}</span></div>`).join('');
}

/* ---------- Smileys ---------- */

// Nach Häufigkeit sortiert, noch nie benutzte in Standardreihenfolge dahinter; entfernte ausgeblendet.
function quickMoods(kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const hidden = new Set(db[set.hidden]);
  const order = m => { const i = set.defaults.indexOf(m); return i < 0 ? 999 : i; };
  const all = [...new Set([...Object.keys(usage), ...set.defaults])].filter(m => !hidden.has(m));
  return all
    .filter(m => set.defaults.includes(m) || usage[m] > 0)
    .sort((a, b) => (usage[b] || 0) - (usage[a] || 0) || order(a) - order(b));
}

// Zähler an die Änderung eines Kommentars anpassen; wieder verwendete Smileys kommen zurück.
function countMoods(before, after, kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const diff = {};
  emojisIn(after).forEach(m => diff[m] = (diff[m] || 0) + 1);
  emojisIn(before).forEach(m => diff[m] = (diff[m] || 0) - 1);
  for (const [m, n] of Object.entries(diff)) {
    if (!n) continue;
    usage[m] = Math.max(0, (usage[m] || 0) + n);
    if (!usage[m]) delete usage[m];
    if (n > 0) db[set.hidden] = db[set.hidden].filter(h => h !== m);
  }
}

/* ---------- Hilfen ---------- */

function mapsUrl({ name, place }) {
  const query = [name, place].map(s => (s || '').trim()).filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function insertAtCursor(ta, text, ownLine) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const before = v.slice(0, pos);
  const prefix = ownLine && before && !before.endsWith('\n') ? '\n' : '';
  const ins = prefix + text;
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
  autoGrow(ta);
}


// Datumsfeld so breit wie das Datum, mit kurzem Abstand zum eigenen Kalender-Icon (auf allen Geräten gleich).
const dateBox = (id, value, label) => `<span class="datebox"><input type="date" id="${id}" value="${value}" aria-label="${label}">${ic('calendar')}</span>`;
function fitDate(inp) {
  const cs = getComputedStyle(inp);
  const ctx = (fitDate.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  // Das Datum wird in der Sprache des Geräts angezeigt; gemessen wird die breitere Schreibweise.
  const d = inp.value ? new Date(inp.value + 'T12:00') : new Date(2000, 11, 28);
  const w = Math.max(...[fullDate(inp.value || '2000-12-28'), d.toLocaleDateString(), d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' })]
    .map(t => ctx.measureText(t).width));
  inp.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 14) + 'px';
}

// Betragsfeld mindestens so breit wie "100.000,00", bei längeren Beträgen wächst es mit.
function fitMoney(inp) {
  const cs = getComputedStyle(inp);
  const ctx = (fitMoney.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const w = Math.max(ctx.measureText('100.000,00').width, ctx.measureText(inp.value).width);
  inp.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 6) + 'px';
}

function insertEmoji(ta, emoji) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
  const head = v.slice(lineStart, pos);
  const onlyEmojis = graphemes(head).every(g => EMOJI_RE.test(g) || /^\s+$/.test(g));
  let before, ins;
  if (onlyEmojis) {
    before = v.slice(0, lineStart) + head.trimEnd();
    ins = emoji + ' ';
  } else {
    before = v.slice(0, pos);
    ins = '\n' + emoji + ' ';
  }
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = before.length + ins.length;
  autoGrow(ta);
}

function render({ scrollToGap = false } = {}) {

    </dl>

    <div class="table-wrap">
      <table class="days">
        <thead><tr>${headCells(trip)}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${visible.length ? '' : `<div class="empty-note">${term ? 'Keine Treffer.' : 'Noch keine Tage erfasst.'}</div>`}
    </div>

    ${stays.length ? `
      <h2>Quartierliste</h2>

        <table class="days static">
          <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th></tr></thead>
          <tbody>${stays.map((st, i) => `<tr class="${i % 2 ? 'alt' : ''}">
            <td>${quarterHtml(st.q, '', true)}</td>

            <td class="num">${st.nights}</td>

  const bar = app.querySelector('#bar');

  app.querySelector('#mainMore').onclick = e => openMainMenu(e.currentTarget, trip);

  if (scrollToGap) openAt(app.querySelector('tr.gap'));

function progressText(trip) {
  const today = todayISO();
  const days = tripDays(trip);
  const recorded = days.filter(d => isRecorded(trip, d)).length;
  let progress;
  if (today < trip.start) progress = `Reise beginnt in ${Math.round((parseISO(trip.start) - parseISO(today)) / 864e5)} Tagen`;
  else if (today > trip.end) progress = `Reise beendet · ${days.length} Tage`;
  else progress = `Tag ${days.indexOf(today) + 1} von ${days.length}`;
  return progress + ` · ${recorded} erfasst`;
}

// Suche (iPad und iPhone gleich): Suchzeile unter der Kopfzeile mit Trefferanzeige ‚3 von 57‘, ⓧ und ⌃ ⌄;
// gezeigt werden nur passende Tage, die Treffer sind gelb, der aktuelle hellorange.
const searchRowHtml = term => `<div class="nb2">
    <span class="searchbox active">${ic('search')}<input type="search" id="search" placeholder="Suchen" value="${esc(searchTerm)}" autocomplete="off" autocapitalize="off" enterkeyhint="search">${term ? `
      <span class="smeta"><span class="scount" id="scount"></span><button type="button" class="sclear" id="sclear" aria-label="Suche löschen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M15 9l-6 6M9 9l6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></span>` : ''}</span>
    <span class="navgrp"><button type="button" id="sprev" aria-label="Voriger Treffer" ${term ? '' : 'disabled'}>${ic('chevron-up')}</button><button type="button" id="snext" aria-label="Nächster Treffer" ${term ? '' : 'disabled'}>${ic('chevron-down')}</button></span>
  </div>`;

function bindSearch(term) {
  app.querySelector('#searchBtn').onclick = () => {
    searchOpen = !searchOpen;
    if (!searchOpen) { searchTerm = ''; searchIndex = 0; }
    render();
    if (searchOpen) app.querySelector('#search').focus();
  };
  const search = app.querySelector('#search');
  const refocus = () => {
    const s = app.querySelector('#search');
    s.focus();
    s.selectionStart = s.selectionEnd = s.value.length;
  };
  if (search) {
    // Markiert wird sofort; zum ersten Treffer gesprungen wird erst nach einer kurzen Tipp-Pause.
    search.oninput = () => {
      searchTerm = search.value;
      searchIndex = 0;
      render();
      refocus();
      clearTimeout(searchJump);
      searchJump = setTimeout(() => showHit(true), 500);
    };
    // Eingabetaste springt zum nächsten Treffer (wie in Safari).
    search.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); stepHit(1); } };
  }
  if (term) {
    app.querySelector('#sclear').onclick = () => { searchTerm = ''; searchIndex = 0; render(); refocus(); };
    app.querySelector('#sprev').onclick = () => stepHit(-1);
    app.querySelector('#snext').onclick = () => stepHit(1);
    showHit(false);
  }
}

// Fazit und Gesamtausgaben (iPad und iPhone).
function bindTripEnd(trip) {
  app.querySelector('#fazit').onclick = () => { setOpener('#fazit'); openFazitDialog(trip); };
  // Betrag: Tausenderpunkt beim Tippen, Komma für Cent (höchstens zwei Stellen); beim Verlassen wird ",00" ergänzt.
  const kosten = app.querySelector('#kosten');
  kosten.oninput = () => {
    const raw = kosten.value.replace(/[^\d,]/g, '');
    const [i, ...rest] = raw.split(',');
    const int = i.replace(/^0+(?=\d)/, '').slice(0, 9);
    const dec = rest.join('').slice(0, 2);
    const hasComma = raw.includes(',');
    trip.kosten = int || dec ? Number(`${int || 0}.${dec || 0}`) : null;
    kosten.value = int || hasComma ? `${int ? thousands(int) : '0'}${hasComma ? ',' + dec : ''}` : '';
    save();
  };
  kosten.onblur = () => { kosten.value = trip.kosten == null ? '' : money(trip.kosten); fitMoney(kosten); };
  kosten.addEventListener('input', () => fitMoney(kosten));
  fitMoney(kosten);
}

const fazitHtml = trip => `<h2>Fazit</h2>

// Quartierliste als Liste: Quartier mit Maps-Link, darunter Zeitraum und Nächte.
function phoneStaysHtml(trip) {
  const stays = cols(trip).quarter ? quarterStays(trip) : [];
  return stays.length ? `<h2>Quartierliste</h2><div class="ilist">${stays.map(st => `<div class="irow"><span class="t">${quarterHtml(st.q, '', true)}

}


// Treffer-Navigation der Suche: jeder markierte Begriff in der Tabelle ist ein Treffer; der aktuelle ist hellorange.
const hitMarks = () => [...app.querySelectorAll('table.days:not(.static) mark, #pdays mark')];
function showHit(scroll) {
  const marks = hitMarks();
  const n = marks.length;
  if (searchIndex >= n) searchIndex = Math.max(0, n - 1);
  marks.forEach((m, i) => m.classList.toggle('cur', i === searchIndex));
  const count = app.querySelector('#scount');
  if (!count) return;
  count.textContent = n ? `${searchIndex + 1} von ${n}` : '0';
  const input = app.querySelector('#search');
  input.style.paddingRight = (app.querySelector('.smeta').offsetWidth + 14) + 'px';
  app.querySelector('#sprev').disabled = !n || searchIndex <= 0;
  app.querySelector('#snext').disabled = !n || searchIndex >= n - 1;
  if (scroll && n) scrollUnderBar(marks[searchIndex]);
}

// Treffer direkt unter die Suchzeile (und den Tabellenkopf) rollen, mit einer halben Zeile Abstand.
function scrollUnderBar(el) {
  const row = el.closest('tr, .kv') || el;
  const bar = document.getElementById('bar');
  const head = app.querySelector('table.days:not(.static) thead');
  const offset = (bar?.offsetHeight || 0) + (head?.offsetHeight || 0) + 12;
  const top = row.getBoundingClientRect().top + scrollY - offset - (window.visualViewport?.offsetTop || 0);
  window.scrollTo({ top: Math.max(0, top) });
}

function stepHit(dir) {
  const n = hitMarks().length;
  const next = searchIndex + dir;
  if (next < 0 || next >= n) return;
  searchIndex = next;
  showHit(true);
}

// Die Liste der Seitenleiste (iPhone: Startliste) behält beim Neuaufbau ihre Position; der gewählte Eintrag
// bleibt sichtbar – auch wenn er erst durch Wischen sichtbar wurde (nicht unter Kopf oder Backup-Kachel).
let sideScroll = 0;
function keepSideScroll() {
  const list = side.querySelector('.side-list');
  if (!list) return;
  list.scrollTop = sideScroll;
  const cur = list.querySelector('.side-row.current');
  if (cur) {
    const lr = list.getBoundingClientRect(), r = cur.getBoundingClientRect();
    const tile = side.querySelector('.side-foot .bhint')?.getBoundingClientRect();
    const bottom = Math.min(lr.bottom, tile ? tile.top : lr.bottom);
    if (r.top < lr.top + 6) list.scrollTop += r.top - lr.top - 6;
    else if (r.bottom > bottom - 6) list.scrollTop += r.bottom - bottom + 6;
  }
  sideScroll = list.scrollTop;
  list.addEventListener('scroll', () => { sideScroll = list.scrollTop; }, { passive: true });
}

// Reise anlegen oder bearbeiten; überschneidende Zeiträume werden verhindert.
function openTripDialog(trip) {
  const isNew = !trip;
  const t = trip || { title: '', participants: '', start: todayISO(), end: addDays(todayISO(), 14), transport: [], quarterList: false, foodColumn: true, moodColumn: true, quarterColumn: true };
  const transport = new Set(t.transport);
  openDialog(`
    <form method="dialog">
      ${dlgHead(isNew ? 'Neues Reiselogbuch' : 'Einstellungen')}
      <div class="dlg-body">
        <div class="step"><label for="fTitle">Reisetitel</label>
          <input type="text" id="fTitle" autocapitalize="sentences" autocorrect="on" spellcheck="true" value="${esc(t.title)}" placeholder="z. B. Australien">
          <div class="warn" id="titleWarn" hidden></div></div>
        <div class="step"><label for="fPeople">Reiseteilnehmer</label>
          <input type="text" id="fPeople" autocapitalize="sentences" autocorrect="on" spellcheck="true" value="${esc(t.participants)}" placeholder="z. B. Gerhild & Arnold">
          <div class="warn" id="peopleWarn" hidden></div></div>
        <div class="step"><label>Reisezeitraum</label>
          <div class="dates">
            <span class="pair"><span class="dl">Von</span>${dateBox('fStart', t.start, 'Von')}</span>
            <span class="pair"><span class="dl">Bis</span>${dateBox('fEnd', t.end, 'Bis')}</span>
          </div>
          <div class="warn" id="tripWarn" hidden></div>
        </div>
        <div class="step"><label>Reisemittel</label>
          <div class="chips">
            ${capHtml(TRANSPORT.map(x => `<button type="button" data-t="${x.id}" aria-pressed="${transport.has(x.id)}">${x.icon} ${x.name}</button>`).join(''), 'transport')}
          </div>
          <div class="warn" id="transportWarn" hidden style="margin-top:2px"></div>
        </div>
        <div class="step"><label>Konfiguration Tabellenspalten</label>
          <div class="hint" style="margin:0 0 6px">Die Spalten ‚Tag‘ und ‚Verlauf‘ werden immer angezeigt.</div>
          <div class="swlist">
            <label class="check sw"><input type="checkbox" id="fMood" ${t.moodColumn !== false ? 'checked' : ''}> Spalte 🙂☹️😉 ‚Wie war was?‘</label>
            <label class="check sw"><input type="checkbox" id="fFood" ${t.foodColumn ? 'checked' : ''}> Spalte 🍽️🍷☕️ ‚Essen und Trinken‘</label>
            <label class="check sw"><input type="checkbox" id="fQuarterCol" ${t.quarterColumn !== false ? 'checked' : ''}> Spalte 😴💤 ‚Quartier‘</label>
          </div>
          <div class="hint">Ausgeblendete Spalten fehlen in Tabelle, Tageserfassung und Ausgabe. Vorhandene Einträge bleiben erhalten.</div>
        </div>
        <div class="step">
          <div class="swlist" style="margin:0"><label class="check sw"><input type="checkbox" id="fQuarterList" ${t.quarterList ? 'checked' : ''}> Quartierliste in der Ausgabe</label></div>
          <div class="hint">Am Ende der Ausgabe: alle Quartiere mit Zeitraum, Anzahl Nächte und Maps-Link. Nur mit Spalte Quartier.</div>
        </div>
      </div>
    </form>`);

  const fTitle = dlg.querySelector('#fTitle');
  const fStart = dlg.querySelector('#fStart');
  const fEnd = dlg.querySelector('#fEnd');
  const warn = dlg.querySelector('#tripWarn');
  const ok = dlg.querySelector('#dlgOk');
  fitDate(fStart);
  fitDate(fEnd);

  // Pflichtfelder: Reisetitel, Reiseteilnehmer, Reisezeitraum, Reisemittel – ohne eigene Kennzeichnung.
  // Fehlermeldungen stehen in Rot unter dem jeweiligen Feld (Feld mit rotem Rahmen), aber erst nach einer Eingabe:
  // Titel/Teilnehmer, wenn das Feld leer verlassen oder geleert wurde; Zeitraum, sobald ein Datum geändert oder ein
  // Titel eingegeben wurde; Reisemittel, wenn das letzte abgewählt wurde. Ein Tippen auf das Häkchen zeigt alle
  // fehlenden Angaben und scrollt zur ersten; ohne Änderung schließt das Häkchen einfach.
  const fPeople = dlg.querySelector('#fPeople');
  const checks = {
    title: { box: dlg.querySelector('#titleWarn'), fields: [fTitle], touched: false,
      text: () => fTitle.value.trim() ? '' : 'Bitte einen Reisetitel eingeben.' },
    people: { box: dlg.querySelector('#peopleWarn'), fields: [fPeople], touched: false,
      text: () => fPeople.value.trim() ? '' : 'Bitte Reiseteilnehmer eingeben.' },
    dates: { box: warn, fields: [fStart, fEnd], touched: false, text: () => {
      if (!fStart.value || !fEnd.value) return 'Bitte Beginn und Ende der Reise wählen.';
      const other = overlappingTrip(fStart.value, fEnd.value, trip?.id);
      return other ? `Wähle einen Zeitraum, der sich nicht mit ‚${other.title}‘ (${fullDate(other.start)} - ${fullDate(other.end)}) überschneidet.` : '';
    } },
    transport: { box: dlg.querySelector('#transportWarn'), fields: [], touched: false,
      text: () => transport.size ? '' : 'Bitte mindestens ein Reisemittel wählen.' },
  };
  let hadTitle = Boolean(fTitle.value.trim());
  const validate = () => {
    let valid = true;
    for (const [key, c] of Object.entries(checks)) {
      const text = c.text();
      if (text) valid = false;
      // Sobald ein Titel da ist, wird auch ein Problem beim Zeitraum gezeigt (z. B. Überschneidung durch das vorgeschlagene Datum).
      const on = Boolean(text) && (c.touched || (key === 'dates' && hadTitle));
      c.box.textContent = on ? text : '';
      c.box.hidden = !on;
      c.fields.forEach(f => f.classList.toggle('invalid', on));
    }
    return valid;
  };
  ok.addEventListener('click', ev => {
    if (!dlgDirty()) { ev.preventDefault(); dlg.close('cancel'); return; }
    if (validate()) return;
    ev.preventDefault();
    Object.values(checks).forEach(c => { c.touched = true; });
    validate();
    dlg.querySelector('.warn:not([hidden])')?.closest('.step').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  dlg.querySelectorAll('#transport button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? transport.add(b.dataset.t) : transport.delete(b.dataset.t);
    if (!transport.size) checks.transport.touched = true;
    validate();
  });
  // Von und Bis gleichen sich an, damit das Ende nie vor dem Beginn liegt.
  const dateChanged = () => { checks.dates.touched = true; fitDate(fStart); fitDate(fEnd); validate(); };
  fStart.oninput = () => { if (fStart.value && fEnd.value < fStart.value) fEnd.value = fStart.value; dateChanged(); };
  fEnd.oninput = () => { if (fEnd.value && fStart.value > fEnd.value) fStart.value = fEnd.value; dateChanged(); };
  fTitle.oninput = () => { if (fTitle.value.trim()) hadTitle = true; else if (hadTitle) checks.title.touched = true; validate(); };
  fTitle.onblur = () => { checks.title.touched = true; validate(); };
  let hadPeople = Boolean(fPeople.value.trim());
  fPeople.oninput = () => { if (fPeople.value.trim()) hadPeople = true; else if (hadPeople) checks.people.touched = true; validate(); };
  fPeople.onblur = () => { checks.people.touched = true; validate(); };
  validate();

  // Quartierliste nur mit sichtbarer Spalte Quartier.
  const fQuarterCol = dlg.querySelector('#fQuarterCol');
  const fQuarterList = dlg.querySelector('#fQuarterList');
  const syncQuarterList = () => {
    fQuarterList.disabled = !fQuarterCol.checked;
    fQuarterList.closest('.step').classList.toggle('off', !fQuarterCol.checked);
  };
  fQuarterCol.onchange = syncQuarterList;
  syncQuarterList();

  // Geändert: Vergleich mit dem Stand beim Öffnen.
  const state = () => JSON.stringify([fTitle.value, fPeople.value, fStart.value, fEnd.value, [...transport].sort(),
    ...['#fMood', '#fFood', '#fQuarterCol', '#fQuarterList'].map(id => dlg.querySelector(id).checked)]);
  const initial = state();
  dlgDirty = () => state() !== initial;

  // x schließt; das Häkchen legt ein neues Reiselogbuch an bzw. übernimmt die Einstellungen.
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok' || !validate()) return render();
    const target = trip || { id: uid(), days: {}, fazit: '', kosten: null, outputCounter: 0 };
    target.title = fTitle.value.trim();
    target.participants = dlg.querySelector('#fPeople').value.trim();
    target.start = fStart.value;
    target.end = fEnd.value;
    target.transport = TRANSPORT.map(x => x.id).filter(id => transport.has(id));
    target.quarterList = dlg.querySelector('#fQuarterList').checked;
    target.foodColumn = dlg.querySelector('#fFood').checked;
    target.moodColumn = dlg.querySelector('#fMood').checked;
    target.quarterColumn = fQuarterCol.checked;
    if (isNew) db.trips.push(target);
    save();
    if (isNew) return showTrip(target.id);
    render();
  };
}

// Einen Tag in 2 bis 5 Schritten erfassen (je nach sichtbaren Spalten); speichert automatisch alle 10 Sekunden.
function openDayDialog(trip, iso) {
  setOpener(`#app [data-day="${iso}"]`); // Zeile bzw. Kasten; auch beim Blättern zum nächsten Tag
  const days = tripDays(trip);
  const idx = days.indexOf(iso);
  const isFirst = idx <= 0;
  const original = trip.days[iso] ? { ...trip.days[iso] } : null;
  const e = original || {};
  const weather = new Set(graphemes(e.weather));
  const knownQuarters = [...new Set(days.map(d => quarterOf(trip, d).name).filter(Boolean))];
  const prev = isFirst ? { name: '', place: '' } : quarterOf(trip, days[idx - 1]);
  const same = Boolean(e.sameQuarter) && !isFirst;
  const c = cols(trip);
  let stepNo = 2;
  const nextNo = () => ++stepNo;

  openDialog(`
    <form method="dialog">
      ${dlgHead(isPhone() ? `${WEEKDAYS[parseISO(iso).getUTCDay()]}, ${fullDate(iso)}` : longDayLabel(iso), { right: `<span class="grp">
        <button type="button" data-nav="-1" ${isFirst ? 'disabled' : ''} aria-label="Vortag">${ic('chevron-left')}</button>
        <button type="button" data-nav="1" ${idx >= days.length - 1 ? 'disabled' : ''} aria-label="Folgetag">${ic('chevron-right')}</button></span>` })}
      <div class="dlg-body">
        <div class="step">
          <div class="step-head"><label><span class="step-num">1</span>Wetter</label></div>
          <div class="emoji-row strip">
            ${capHtml(WEATHER.map(w => `<button type="button" aria-pressed="${weather.has(w)}" data-w="${w}">${w}</button>`).join(''), 'wx')}
          </div>
        </div>
        <div class="step">
          <div class="step-head"><label for="fProgram"><span class="step-num">2</span>Verlauf</label></div>
          <div class="chips" id="suggest">
            ${PROGRAM_SUGGESTIONS.map((s, i) => `<button type="button" data-s="${i}">${esc(s.label)}</button>`).join('')}
          </div>
          <textarea id="fProgram" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Wie ist der Tag verlaufen? Eine Zeile pro Punkt.">${esc(e.program || '')}</textarea>
        </div>
        <div class="step" ${c.mood ? '' : 'hidden'}>
          <div class="step-head"><label for="fComment"><span class="step-num">${c.mood ? nextNo() : ''}</span>Wie war was?</label></div>
          <div class="emoji-row" id="moods"></div>
          <textarea id="fComment" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Smiley antippen, dann ein paar Worte dazu.">${esc(e.comment || '')}</textarea>
          <div class="hint">${MOOD_HINT}</div>
        </div>
        ${trip.foodColumn ? `<div class="step">
          <div class="step-head"><label for="fFoodText"><span class="step-num">${nextNo()}</span>Essen und Trinken</label><span class="head-checks"><label class="check chip head-check"><input type="checkbox" id="noLink"> keinen Google-Maps Link</label></span></div>
          <div class="emoji-row" id="foodMoods"></div>
          <textarea id="fFoodText" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Eine Zeile pro Lokal: Smileys, Name – Kommentar">${esc(e.food || '')}</textarea>
          <div class="hint">Format: ‚🕛😋 Hard Rock Café – Steak war super‘. Der Name wird zum Link in Google Maps (mit dem Ort des Quartiers). ‚keinen Google-Maps Link‘ gilt für die Zeile, in der du gerade schreibst (markiert mit ⊘).</div>
        </div>` : ''}
        <div class="step" ${c.quarter ? '' : 'hidden'}>
          <div class="step-head"><label for="fQuarter"><span class="step-num">${c.quarter ? nextNo() : ''}</span>Quartier</label><span class="head-checks">${isFirst ? '' : `<label class="check chip head-check"><input type="checkbox" id="fSame" ${same ? 'checked' : ''}> Quartier wie Vortag</label>`}<label class="check chip head-check"><input type="checkbox" id="fNoMap" ${e.noMap && !same ? 'checked' : ''}> keinen Google-Maps Link</label></span></div>
          <div class="qrow"><input type="text" id="fQuarter" autocapitalize="sentences" autocorrect="on" spellcheck="true" list="quarterList" placeholder="z. B. Oaks Townsville Hotel">
          <datalist id="quarterList">${knownQuarters.map(q => `<option value="${esc(q)}">`).join('')}</datalist>
          <input type="text" id="fPlace" autocapitalize="sentences" autocorrect="on" spellcheck="true" placeholder="Ort für Google Maps, z. B. Cairns, Australien"></div>
          <div class="hint" id="qHint"></div>
        </div>
        ${micHint()}
      </div>
    </form>`, true);

  const fProgram = dlg.querySelector('#fProgram');
  const fComment = dlg.querySelector('#fComment');
  const fQuarter = dlg.querySelector('#fQuarter');
  const fPlace = dlg.querySelector('#fPlace');
  const fSame = dlg.querySelector('#fSame');
  const qHint = dlg.querySelector('#qHint');
  const savedInfo = dlg.querySelector('#dlgSub');
  let own = { name: same ? '' : (e.quarter || ''), place: same ? '' : (e.place || '') };
  const fFood = dlg.querySelector('#fFoodText');
  let lastComment = e.comment || '';
  let lastFood = e.food || '';
  let lastSnapshot = JSON.stringify(original);

  // Schritt 1: Wetter
  dlg.querySelectorAll('#wx button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? weather.add(b.dataset.w) : weather.delete(b.dataset.w);
  });

  // Schritt 2: Vorschläge als neue Zeile einfügen
  dlg.querySelectorAll('#suggest button').forEach(b => b.onclick = () => {
    insertAtCursor(fProgram, PROGRAM_SUGGESTIONS[b.dataset.s].text, true);
    capNext(fProgram); // nach ‚Weiterfahrt nach …‘ beginnt der Ort groß
  });

  // Schritt 3: Smiley-Schnellauswahl
  mountMoodRow(dlg.querySelector('#moods'), fComment, () => { lastComment = fComment.value.trim(); });
  if (fFood) mountMoodRow(dlg.querySelector('#foodMoods'), fFood, () => { lastFood = fFood.value.trim(); }, 'food');
  if (fFood) {
    const noLink = dlg.querySelector('#noLink');
    const syncNoLink = () => {
      const v = fFood.value;
      const pos = fFood.selectionStart ?? v.length;
      noLink.checked = v.slice(v.lastIndexOf('\n', pos - 1) + 1).startsWith(NO_LINK);
    };
    ['keyup', 'click', 'input', 'focus', 'select'].forEach(ev => fFood.addEventListener(ev, syncNoLink));
    noLink.onchange = () => { toggleNoLink(fFood); syncNoLink(); };
    syncNoLink();
  }

  // Schritt 4: Quartier
  const fNoMap = dlg.querySelector('#fNoMap');
  let ownNoMap = fNoMap.checked;
  const updateQuarter = () => {
    const useSame = Boolean(fSame?.checked);
    fQuarter.disabled = fPlace.disabled = fNoMap.disabled = useSame;
    const q = useSame ? prev : { ...own, noMap: ownNoMap };
    fQuarter.value = q.name;
    fPlace.value = q.place;
    fNoMap.checked = Boolean(q.noMap);
    if (useSame && !prev.name) qHint.textContent = 'Am Vortag ist noch kein Quartier eingetragen.';
    else qHint.innerHTML = q.name && !q.noMap ? `<a href="${mapsUrl(q)}" target="_blank" rel="noopener" style="text-decoration:none">📍 In Google Maps prüfen</a>` : '';
  };
  fNoMap.onchange = () => { ownNoMap = fNoMap.checked; updateQuarter(); };
  fQuarter.oninput = () => { own.name = fQuarter.value; updateQuarter(); };
  fPlace.oninput = () => { own.place = fPlace.value; updateQuarter(); };
  if (fSame) fSame.onchange = updateQuarter;
  updateQuarter();


  const collect = () => {
    const useSame = Boolean(fSame?.checked);
    const next = {
      weather: WEATHER.filter(w => weather.has(w)).join(''),
      program: fProgram.value.trim(),
      comment: fComment.value.trim(),
      sameQuarter: useSame,
      quarter: useSame ? '' : own.name.trim(),
      place: useSame ? '' : own.place.trim(),
      noMap: useSame ? false : ownNoMap,
      // Bei ausgeblendeter Essen-Spalte bleiben vorhandene Einträge erhalten.
      food: fFood ? fFood.value.trim() : (e.food || ''),
    };
    return (next.weather || next.program || next.comment || next.sameQuarter || next.quarter || next.place || next.food) ? next : null;
  };

  const persist = () => {
    const next = collect();
    const snapshot = JSON.stringify(next);
    if (snapshot === lastSnapshot) return;
    countMoods(lastComment, next?.comment || '');
    lastComment = next?.comment || '';
    countMoods(lastFood, next?.food || '', 'food');
    lastFood = next?.food || '';
    if (next) trip.days[iso] = next; else delete trip.days[iso];
    if (save()) {
      lastSnapshot = snapshot;
      savedInfo.textContent = `Automatisch gespeichert um ${nowStamp().time}`;
    }
  };

  const restore = () => {
    countMoods(lastComment, original?.comment || '');
    countMoods(lastFood, original?.food || '', 'food');
    if (original) trip.days[iso] = original; else delete trip.days[iso];
    save();
  };

  autosaveTimer = setInterval(persist, AUTOSAVE_MS);
  const initialDay = JSON.stringify(collect());
  dlgDirty = () => JSON.stringify(collect()) !== initialDay;

  dlg.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    persist();
    render();
    openDayDialog(trip, days[idx + Number(b.dataset.nav)]);
  });
  dlg.onclose = () => {
    clearInterval(autosaveTimer);
    if (dlg.returnValue === 'ok') persist(); else restore();
    render();
  };
}

/* ---------- Ausgabe ---------- */

// "Reiselogbuch <Titel> JJJJ.MM.TT-JJJJ.MM.TT V001", nie zwei Leerzeichen hintereinander.
function outputName(trip, version) {
  const title = trip.title.replace(/[\\/:*?"<>|]/g, '-');
  const range = `${trip.start.replace(/-/g, '.')}-${trip.end.replace(/-/g, '.')}`;
  return `Reiselogbuch ${title} ${range} V${pad(version, 3)}`.replace(/\s+/g, ' ').trim();
}

// Alle Regeln gelten nur innerhalb von .rt, damit sie beim Drucken nicht in die App durchschlagen.
// Schrift und Tabellen aus der Mustertabelle der Ausgabe in AppDesign (outputCss, R-6.2); hier nur, was dazukommt.
const OUTPUT_CSS = outputCss('.rt') + `
  body { font: 11pt/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #000; background: #fff; margin: 24px; }
  .rt .ln { display: flex; gap: .35em; }
  .rt .ln + .ln { margin-top: 2px; }
  .rt .ln .m { flex: none; }
  .rt .ln .t { min-width: 0; overflow-wrap: anywhere; }
  .rt .stats td { border: none; padding: 1px 16px 1px 0; }
  .rt a { color: #1a5fb4; }
  .rt a.m { text-decoration: none; }
  .rt p { white-space: pre-line; }
  @media print { body { margin: 0; } }
`;

function tripStats(trip) {
  const days = tripDays(trip);
  const rec = days.filter(d => isRecorded(trip, d));
  const quarters = new Set(rec.map(d => quarterOf(trip, d).name).filter(Boolean));
  // Varianten mit/ohne Emoji-Darstellungszeichen (z. B. ☹️ und ☹) zählen gemeinsam.
  const count = (list) => {
    const c = new Map();
    list.forEach(x => {
      const key = x.replace(/\uFE0F/g, '');
      const hit = c.get(key) || { shown: x, n: 0 };
      if (x.includes('\uFE0F')) hit.shown = x;
      hit.n++;
      c.set(key, hit);
    });
    return [...c.values()].sort((a, b) => b.n - a.n).map(h => [h.shown, h.n]);
  };
  const weather = count(rec.flatMap(d => graphemes(rawEntry(trip, d).weather)));
  const c = cols(trip);
  const moods = count([...(c.mood ? rec.map(d => rawEntry(trip, d).comment) : []), trip.fazit].flatMap(emojisIn));
  const fmt = list => list.map(([e, n]) => `${n}×${e}`).join(' · ') || '–';
  return [
    ['Reisetage', `${days.length}, davon erfasst ${rec.length}`],
    ...(c.quarter ? [['Quartiere', String(quarters.size)], ['Nächte', String(quarterStays(trip).reduce((n, st) => n + st.nights, 0))]] : []),
    ['Wetter', fmt(weather)],
    ['Smileys', fmt(moods)],
  ];
}

// Aufeinanderfolgende Nächte im selben Quartier werden zu einem Aufenthalt zusammengefasst.
function quarterStays(trip) {
  const stays = [];
  for (const d of tripDays(trip)) {
    const q = quarterOf(trip, d);
    if (!q.name) continue;
    const last = stays[stays.length - 1];
    if (last && last.q.name === q.name && last.lastNight === addDays(d, -1)) {
      last.lastNight = d;
      last.nights++;
    } else {
      stays.push({ q, firstNight: d, lastNight: d, nights: 1 });
    }
  }
  return stays;
}

// Inhalt der Ausgabe: nur erfasste Tage, ohne Wetter-Platzhalter.
function outputBody(trip, version, stamp) {
  const c = cols(trip);
  const rows = tripDays(trip).filter(iso => isRecorded(trip, iso)).map(iso => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    return `<tr>
      <td class="nw">${dayLabel(iso)}${e.weather ? `<br>${esc(e.weather)}` : ''}</td>
      <td>${linesHtml(programItems(e.program))}</td>
      ${c.mood ? `<td>${linesHtml(commentItems(e.comment))}</td>` : ''}
      ${c.food ? `<td>${foodHtml(foodItems(e.food, q.place))}</td>` : ''}
      ${c.quarter ? `<td>${quarterHtml(q)}</td>` : ''}
    </tr>`;
  }).join('');
  const transport = transportText(trip);
  const stays = trip.quarterList && c.quarter ? quarterStays(trip) : [];
  return `<div class="rt">
    <h1>Reiselogbuch – ${esc(trip.title)}</h1>
    <table class="meta">
      <tr><td><b>Reiseteilnehmer:</b></td><td>${esc(trip.participants)}</td></tr>
      <tr><td><b>Reisezeitraum:</b></td><td>${fullDate(trip.start)} - ${fullDate(trip.end)}</td></tr>
      ${transport ? `<tr><td><b>Reisemittel:</b></td><td>${esc(transport)}</td></tr>` : ''}
    </table>
    <table class="grid">
      ${outCols(trip)}
      <thead><tr>${headCells(trip)}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${colCount(trip)}">Noch keine Tage erfasst.</td></tr>`}</tbody>
    </table>
    <h2>Fazit</h2>
    <div>${linesHtml(commentItems(trip.fazit))}</div>
    <h2>Gesamtausgaben</h2>
    <p>${formatEuro(trip.kosten)}</p>
    ${stays.length ? `
      <h2>Quartierliste</h2>
      <table class="grid fit">
        <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th></tr></thead>
        <tbody>${stays.map(s => `<tr>
          <td>${quarterHtml(s.q)}</td>
          <td class="nw">${shortDate(s.firstNight)} - ${fullDate(addDays(s.lastNight, 1))}</td>
          <td class="num">${s.nights}</td>
        </tr>`).join('')}</tbody>
      </table>` : ''}
    <h2>Statistik</h2>
    <table class="stats">
      ${tripStats(trip).map(([k, v]) => `<tr><td><b>${k}:</b></td><td>${esc(v)}</td></tr>`).join('')}
    </table>
    <p class="created">Ausgabe V${pad(version, 3)} erstellt am ${stamp.date} um ${stamp.time}</p>
  </div>`;
}

/* ---------- Speichern über das Teilen-Menü ---------- */


function outputDocument(trip, version, stamp) {
  return `<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(outputName(trip, version))}</title>
<style>${OUTPUT_CSS}</style></head>
<body>${outputBody(trip, version, stamp)}</body></html>`;
}

function backupFile() { return backupFileOf('Reiselogbuch', db); }

// Vorschau der Ausgabe in der App, immer hell; zeigt die Nummer der nächsten Datei, ohne den Zähler zu erhöhen.
function openPreview(trip) {
  const version = (trip.outputCounter || 0) + 1;
  openDialog(`
    <form method="dialog">
      ${dlgHead('Vorschau', { sub: esc(outputName(trip, version)), check: false,
        right: `<span class="grp"><button type="button" class="txt" id="prvPdf">${ic('file-text')}PDF</button><button type="button" class="fill" id="prvShare" aria-label="Teilen">${ic('share')}</button></span>` })}
      <div class="dlg-body preview">
        <style>${OUTPUT_CSS.replace(/\bbody\b/g, '.dlg-body.preview')}.dlg-body.preview { margin: 0; padding: 24px; }</style>
        ${outputBody(trip, version, nowStamp())}
      </div>

function nextOutput(trip) {
  trip.outputCounter = (trip.outputCounter || 0) + 1;
  save();
  return { version: trip.outputCounter, stamp: nowStamp() };
}

// Muss direkt aus dem Antippen heraus aufgerufen werden, sonst blockiert Safari das Teilen-Menü.
async function exportHtml(trip) {
  const { version, stamp } = nextOutput(trip);
  const file = { name: `${outputName(trip, version)}.html`, type: 'html', content: outputDocument(trip, version, stamp) };
  if (dlg.open) dlg.close();
  const result = await shareFiles([file]);
  dlgOpener = '#shareBtn';
  showOutputResult(`Ausgabe V${pad(version, 3)}`, file.name, result);
}

// PDF über das Drucken-Menü; der Seitentitel wird als Dateiname vorgeschlagen.
function exportPdf(trip) {
  const { version, stamp } = nextOutput(trip);
  const name = outputName(trip, version);
  dlgOpener = '#shareBtn';
  showOutputResult(`Ausgabe V${pad(version, 3)}`, name + '.pdf', 'print');
  const oldTitle = document.title;
  printout.innerHTML = `<style>${OUTPUT_CSS.replace(/\bbody\b/g, '#printout')}</style>${outputBody(trip, version, stamp)}`;
  document.title = name;
  const restore = () => { document.title = oldTitle; window.removeEventListener('afterprint', restore); };
  dlg.addEventListener('close', () => { printout.innerHTML = ''; }, { once: true });
  window.addEventListener('afterprint', restore);
  dlg.addEventListener('close', restore, { once: true });
  setTimeout(() => window.print(), 50);
}

function showOutputResult(title, name, result) {
  const remind = !backedUpToday() && result !== 'aborted' && result !== 'error';
  openDialog(`
    <form method="dialog">
      ${dlgHead(esc(title), { check: false })}
      <div class="dlg-body">
        <div class="step">${shareResultText(result, name)}</div>
        ${remind ? backupReminderHtml() : ''}
      </div>
    </form>`);
  bindBackupReminder();
}

function backupReminderHtml() {
  return `<div class="step" id="reminder">
      <strong>💾 Denk daran, auch ein Backup zu erstellen.</strong>
      <div class="hint">${lastBackupText()}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="primary" id="backupNow">${ic('save')}Backup erstellen</button>
      </div>
    </div>`;
}

function bindBackupReminder() {
  const btn = dlg.querySelector('#backupNow');
  if (!btn) return;
  btn.onclick = async () => {
    const name = await saveBackup();
    const box = dlg.querySelector('#reminder');
    if (box && name) box.innerHTML = name;
  };
}

// Erstellt das Backup über das Teilen-Menü; der Zeitpunkt zählt nur, wenn das Menü abgeschlossen wurde.
// anchor: Schaltfläche, von der es kommt – sie bleibt bis zum Schließen der Meldung blau.
async function saveBackup(anchor) {
  hold(anchor);
  const file = backupFile();
  const result = await shareFiles([file]);
  if (result === 'shared' || result === 'downloaded') {
    db.settings.lastBackup = Date.now();
    save();
    if (isPhone()) render(); else renderSide();
  }
  const text = shareResultText(result, file.name);
  if (!dlg.querySelector('#reminder')) await inform('Backup', text);
  release(anchor);
  return text;
}



/* ---------- Backup ---------- */


importFile.addEventListener('cancel', () => release(importAnchor));
importFile.onchange = async () => {
  const file = importFile.files[0];
  importFile.value = '';
  if (!file) return release(importAnchor);
  try {
    const { data, savedAt, savedOn } = await readBackup(file, 'trips');
    normalize(data);
    // Abfrage (R-9.2): Zeitpunkt und Gerät des Backups, neuer oder älter – Abgleichen · Ersetzen · Abbrechen.
    const choice = await sync.ask(document.querySelector(importAnchor), db, data, savedAt, savedOn);
    if (!choice) return release(importAnchor);
    // Das letzte Backup und das zuletzt verwendete Reiselogbuch gelten je Gerät: die Werte aus der Datei werden nicht übernommen.
    const { lastBackup, lastTrip } = db.settings;
    let stats = null;
    if (choice === 'merge') ({ data: db, stats } = mergeData(db, data));
    else db = data;
    db = normalize(db);
    db.settings.lastBackup = lastBackup;
    if (lastTrip) db.settings.lastTrip = lastTrip; else delete db.settings.lastTrip;
    lastSnap = snapshot(db);   // übernommene Änderungen behalten Zeitpunkt und Gerät von drüben
    save();
    applyTheme();
    if (dlg.open) dlg.close();
    // Abgleichen bleibt in der aktuellen Ansicht; Ersetzen beginnt wie beim Start.
    if (choice === 'merge' && getTrip(currentTripId)) render(); else showTrip(pickStartTrip()?.id);
    // R-9.4: Ergebnis mit Tabelle der Änderungen auf diesem Gerät (breites Fenster).
    if (stats) await sync.showResult(stats, savedAt, savedOn);
    release(importAnchor);
  } catch (e) {
    await inform('Backup laden', '⚠️ Die Datei konnte nicht gelesen werden. ' + esc(e.message));
    release(importAnchor);
  }
};

/* ---------- Start ---------- */

applyTheme();
// Beim Start immer am Anfang beginnen (der Sprung zum ersten offenen Tag kommt von der App, nicht von Safari).
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
// Dauerhaften Speicher anfordern (einmalig, ohne Rückfrage); das Ergebnis steht im Menü der Seitenleiste.
if (navigator.storage?.persist) {
  navigator.storage.persisted()
    .then(p => p || navigator.storage.persist())
    .then(p => { storagePersistent = Boolean(p); })
    .catch(() => {});
}
// Beim Start ist die Seitenleiste immer eingeblendet (im Hochformat über den Inhalt gelegt).
sideOpen = true;
// R-7.2 (seit 3.15.0, T-84): Im iPhone-Aufbau (auch iPad im schmalen Fenster) beginnt jedes Neuladen in der Startliste,
// ohne blauen Eintrag; der iPad-Aufbau öffnet wie bisher die laufende (sonst zuletzt beendete, sonst nächste) Reise.
// Die Startreise bleibt gewählt, damit ein breiteres Fenster sie mit der Seitenleiste zeigt.
showTrip(pickStartTrip()?.id);
if (isPhone()) { phoneList = true; startList = true; window.scrollTo(0, 0); render(); }
// Wechsel quer/hoch: Seitenleiste fest oder darübergelegt; sonst nur Höhen und Breiten nachführen.
let wasWide = isWide();
let wasPhone = isPhone();
window.addEventListener('resize', () => {
  placeDialogs();
  // R-8.1: Ist ein Menü oder eine Abfrage aus der Seitenleiste offen, bleibt sie in jedem Fall sichtbar.
  if (document.querySelector('#side .on') && document.querySelector('.menu, .pop')) sideOpen = true;
  // Wechsel fest ↔ darübergelegt bzw. iPad- ↔ iPhone-Aufbau: neu aufbauen; der Zustand sideOpen bleibt (R-8.1).
  if (isPhone() !== wasPhone || isWide() !== wasWide) { wasPhone = isPhone(); wasWide = isWide(); render(); return; }
  const bar = document.getElementById('bar');
  if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  if (!side.hidden) document.documentElement.style.setProperty('--side-w', side.offsetWidth + 'px');
});
// Beim Scrollen bekommt die Kopfzeile eine Haarlinie, auf dem iPhone wandert der große Titel in die Leiste (ui.js, updateBar).

</script>
<div id="messung" style="position:fixed;left:12px;bottom:12px;z-index:9999;display:flex;gap:8px;align-items:center;
  font:600 13px -apple-system,system-ui;background:#ff3b30;color:#fff;border-radius:16px;padding:6px 6px 6px 12px">
  Messung – speichert nicht <button type="button" id="mKopie" style="font:inherit;border:0;border-radius:12px;padding:6px 10px;background:#fff;color:#ff3b30">Protokoll kopieren</button></div>
<script>
'use strict';
// Messung (A-18): ab dem Antippen eines Feldes im Fenster 3 s lang jede Änderung; jede Eingabe verlängert um 1,5 s.
(() => {
  const vv = window.visualViewport, body = () => dlg.querySelector('.dlg-body');
  let t0 = null, ende = 0, zeilen = [], letzte = '', zeile = null;
  document.addEventListener('click', e => { const z = e.target.closest?.('#app [data-day]'); if (z) zeile = z; }, true);
  const stand = () => {
    const f = document.activeElement, d = dlg.getBoundingClientRect(), z = zeile?.isConnected ? zeile.getBoundingClientRect() : null;
    const oben = vv ? vv.offsetTop : 0, unten = vv ? vv.offsetTop + vv.height : innerHeight, fr = f?.getBoundingClientRect?.();
    return [vv ? Math.round(vv.height) : '-', vv ? Math.round(oben) : '-', Math.round(scrollY), Math.round(d.top), Math.round(d.height),
      Math.round(body()?.scrollTop ?? 0), z ? Math.round(z.top) : '-',
      fr && f !== dlg ? (fr.top >= oben && fr.bottom <= unten ? 'ja' : 'nein') : '-'].join('\t');
  };
  const notiere = q => {
    if (t0 === null || performance.now() > ende || zeilen.length > 400) return;
    const s = stand();
    if (s === letzte && q === 'Bild') return;
    letzte = s;
    zeilen.push(String(Math.round(performance.now() - t0)).padStart(5) + '\t' + s + '\t' + q);
  };
  const bild = () => { notiere('Bild'); if (performance.now() < ende) requestAnimationFrame(bild); };
  const verlaengere = ms => { const lief = performance.now() < ende; ende = Math.max(ende, performance.now() + ms); if (!lief) requestAnimationFrame(bild); };
  const orig = placeDialogs;
  placeDialogs = function () { orig(); notiere('placeDialogs'); };
  if (vv) {
    vv.addEventListener('resize', () => notiere('vv resize'));
    vv.addEventListener('scroll', () => notiere('vv scroll'));
  }
  addEventListener('scroll', () => notiere('Seite rollt'), { passive: true });
  dlg.addEventListener('scroll', () => notiere('Fenster rollt'), { capture: true, passive: true });
  if (window.ResizeObserver) new ResizeObserver(() => notiere('Fenster Größe')).observe(dlg);
  dlg.addEventListener('focusin', e => {
    if (!e.target.matches('input, textarea')) return;
    if (t0 === null || performance.now() > ende) {
      t0 = performance.now(); ende = 0; letzte = '';
      zeilen = ['Reiselogbuch 3.20.1 (Kopie) · ' + innerWidth + '×' + innerHeight + ' · ' + (navigator.userAgent.match(/Version\/[\d.]+/)?.[0] || ''),
        '    ms\tvv-Höhe\tvv-oben\tscrollY\tFenster\tF-Höhe\tF-gerollt\tZeile\tFeld sichtbar\tAuslöser'];
    }
    verlaengere(3000);
    notiere('Antippen ' + (e.target.id || e.target.tagName));
    setTimeout(() => notiere('350 ms (scrollIntoView)'), 360);
  });
  dlg.addEventListener('input', () => { notiere('Eingabe'); verlaengere(1500); });
  document.getElementById('mKopie').onclick = async () => {
    const text = zeilen.join('\n') || 'Noch kein Protokoll – im Fenster ein Feld antippen.';
    try { await navigator.clipboard.writeText(text); inform('Kopiert', 'Das Protokoll ist in der Zwischenablage. Füge es im Chat ein.'); }
    catch (e) { inform('Nicht kopiert', 'Kopieren ging nicht.'); }
  };
})();
</script>
